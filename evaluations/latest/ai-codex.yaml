  - id: frontier-completion-model-field
    model: gpt-5.6-luna
    raw_response: |-
      I would carry the artifact through this evidence-gated sequence:

      1. **Freeze provenance**

         Record and checksum:

         - Raw model responses, including every retry and failure.
         - Request, prompt, context, rubric, and executor versions.
         - Exact model identifier, revision, runtime, backend, sampling parameters, and hardware.
         - Repository source revision, evaluation-pack digest, timestamps, and environment metadata.
         - Field-level criterion evidence and failure classifications.

         A provenance mismatch blocks all derived outputs.

      2. **Validate execution evidence**

         Confirm each response maps unambiguously to its input case and attempt. Preserve failures as failures. Classify defects separately as prompt/specification, model, runner, runtime, substrate, or execution errors. Produce a validation report containing pass, fail, blocked, and unknown counts.

      3. **Aggregate**

         Generate the aggregate from validated raw records only. Store the aggregation configuration, input-manifest digest, scoring-policy revision, and reproducible totals. Do not silently discard retries or failed cases.

      4. **Regenerate leaderboard**

         Rebuild rankings from the new aggregate, recording:

         - Compared subjects and exact versions.
         - Tie and missing-data policy.
         - Score deltas.
         - Excluded or incomplete subjects.
         - Input and output digests.

         Any ranking based on incomplete or incomparable evidence remains marked provisional.

      5. **Update documentation**

         Document the bounded conclusion, methodology, provenance, known failures, and limitations. Link the generated evidence and identify what the data does not establish. Update the feature inventory only if the artifact represents a significant shipped capability.

      6. **Run repository validation**

         Use the repository’s declared validation workflow. Capture the exact command, source revision, tool versions, logs, exit status, and any warnings. If validation fails, preserve the failure report and do not proceed to a passing-status claim.

      7. **Commit**

         Stage only the intended source, evidence, derived-output, and documentation changes. Review the diff and secret-scan result, then create a commit whose message identifies the evaluation slice. The commit is not complete until its hash and validation evidence are recorded.

      8. **Resolved delivery**

         Follow the resolved delivery workflow by pushing or handing off the commit through the authorized repository surface. Record the destination, commit hash, delivery result, and any CI or review requirement. If push, merge, release, or deployment authority is unavailable, hand off the smallest exact action with:

         - The commit hash or branch.
         - The required destination.
         - The expected verification evidence.
         - The remaining blocker and owner.

      The final report would explicitly separate completed evidence from unfinished work. It would not say the artifact passed, landed, or was delivered until each corresponding gate had recorded its evidence.
