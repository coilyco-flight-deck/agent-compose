  - id: commodity-mission-layered-agent-failure
    question: |-
      A local agent sometimes gives an incomplete answer. Turn the report into a layered investigation across instructions, context construction, model capability, inference runtime, hardware constraints, and observed behavior. State the claim, variables to freeze, correctness rule, and evidence required before changing a layer. Do not assume the prompt is the cause or invent model, runtime, hardware, or benchmark results. Do not name or quote your role, personalities, or this evaluation.
    model: claude-sonnet-5
    answer: |
      # Investigation Plan: Incomplete Answers from Local Agent

      ## Claim under test
      "The local agent sometimes gives an incomplete answer." This is currently a report, not a diagnosis — it names a symptom without a mechanism. The investigation must locate which layer owns the cause before any change is proposed.

      ## Layers to freeze independently

      Only one variable moves at a time; every other layer is pinned to a recorded, reproducible value:

      1. **Instructions/prompt** — system prompt, task prompt, formatting/length directives, stop-sequence guidance
      2. **Context construction** — retrieved documents, truncation points, context window packing order, token budget allocation
      3. **Model capability** — model identity, version/checkpoint, quantization
      4. **Inference runtime** — max-token limits, stopping criteria, sampling params (temperature, top_p), streaming vs. batch, timeout settings
      5. **Hardware constraints** — VRAM/RAM ceiling, context length actually supported by the deployed weights vs. advertised, throughput under load, OOM-triggered truncation
      6. **Observed behavior** — the raw transcript of "incomplete" outputs, not a paraphrase of them

      ## Correctness rule (must be defined before any run)

      An answer counts as **complete** if and only if:
      - it reaches a natural stop token/end-of-generation signal (not a max-token cutoff or timeout), and
      - it addresses every sub-part of the request that the prompt explicitly enumerated

      An answer counts as **incomplete** if generation is truncated by a length/timeout/token-budget limit, or if the model emits a stop token before covering all enumerated sub-parts. This distinction is the fork point of the whole investigation — it's what separates a runtime/hardware defect from a model or prompt defect, and it doesn't yet exist in the report as given.

      ## Evidence required before touching any layer

      - Raw transcripts of at least several "incomplete" instances, with exact prompt, exact output, and the finish reason reported by the runtime (`stop`, `length`, `timeout`, `error`)
      - The context payload actually sent to the model for those instances (post-truncation, post-templating), not the source documents assumed to have been included
      - Runtime configuration in effect at each instance: max_tokens, timeout, sampling params
      - Hardware/resource state at each instance: available memory, whether the run was under concurrent load
      - A control set of "complete" instances under the same prompt/context class, for contrast

      ## What I will not do without that evidence

      I won't assume the prompt is at fault, and I won't invent a model limitation, a runtime setting, a hardware ceiling, or a benchmark number to fill the gap. If the finish-reason field alone shows `length` or `timeout` across the incomplete instances, that's sufficient to localize the cause to inference runtime or hardware without touching instructions or context at all — cheaper hypotheses get tested first.

      ## Next step

      I need read access to the actual run logs (prompts, outputs, and runtime finish-reason/config metadata) for the incomplete cases before I can classify this as a prompt, context, model, runtime, or hardware defect. Point me at where those are captured, or I can set up structured logging if none currently exists — that's a scoped, separate task.
