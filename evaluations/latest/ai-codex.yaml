  - id: frontier-replay-aosh-evidence
    model: gpt-5.6-luna
    raw_response: |-
      I would handle it as a bounded evidence-maintenance task:

      1. **State the claim**

         “The local-model reliability issue is reproducible under a specified prompt, context, model, runtime, hardware, and executor configuration.”

         The supplied record does not yet support that claim. It supports only that new hardware measurements, model responses, benchmarks, and deployment state are absent.

      2. **Run the smallest experiment**

         Freeze one representative input and one expected-output rubric. Execute the same request repeatedly using:

         - one pinned model identifier and model file digest
         - one pinned inference-runtime version and configuration
         - one fixed prompt and context snapshot
         - one fixed sampling configuration and seed policy
         - one declared hardware target and executor
         - one fixed concurrency and request-count value

         Record every raw response, error, timeout, latency, token-count result, retry, and process exit status. Preserve timestamps, configuration hashes, model/runtime identifiers, and hardware measurements if the executor can provide them. If a required measurement is unavailable, record `unavailable`, not an estimate.

      3. **Maintain the AOSH evidence artifact**

         Add or revise only derived claims supported by the raw record. The artifact should contain:

         - claim and correctness criteria
         - exact experiment inputs and frozen variables
         - model, runtime, executor, and hardware fields
         - run count and retry provenance
         - raw-result references
         - failure classification: prompt, model, runner, substrate, or specification
         - observed result and uncertainty
         - bounded recommendation
         - artifact version and generation timestamp

         Mark missing values explicitly and leave recommendation status as provisional until the experiment produces evidence. Do not add benchmark numbers, reliability rates, hardware conclusions, or rollout claims.

      4. **Bounded recommendation**

         “Do not select, reject, tune, or roll out the local model based on the supplied record. First run the frozen repeated-request experiment and compare raw outcomes against the predefined rubric. Any recommendation should be limited to the tested configuration and observed workload.”

      5. **QA handoff**

         QA receives the experiment definition, correctness rubric, immutable input/context snapshot, artifact diff, and raw-result manifest. QA independently verifies that:

         - the experiment is repeatable
         - the rubric was defined before execution
         - raw results match the derived summary
         - retries and failures are not hidden
         - unsupported claims are absent
         - the artifact distinguishes missing evidence from negative evidence

         QA should return an acceptance verdict with referenced run identifiers, or list the exact unmet criteria. QA does not approve deployment or infer live behavior.

      6. **DevOps handoff**

         DevOps receives only the operationally relevant configuration and the exact required observation:

         “For the tested model/runtime configuration, provide approved read-only hardware and deployment-state observations, including whether the configuration is deployed, where it is running, and the relevant rollout or health evidence.”

         DevOps owns obtaining live state, deployment, rollout, rollback, and recovery evidence. Until that handoff returns verified observations, the artifact must state that deployment status and rollout outcome are unknown.
