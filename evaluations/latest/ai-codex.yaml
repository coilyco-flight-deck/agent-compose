cases:
  - id: frontier-mission-layered-agent-failure
    model: gpt-5.6-luna
    raw_response: |-
      I would treat “the local agent sometimes gives an incomplete answer” as a hypothesis, not a prompt diagnosis.

      **Claim to test**

      Under a fixed task and input, the agent fails to satisfy a predefined completeness contract at a measurable rate. The investigation must identify whether the cause belongs to instructions, context construction, model capability, inference runtime, hardware, or the observed-behavior measurement itself.

      **Freeze first**

      I would record and hold constant:

      * Exact user input, system and developer instructions, tool descriptions, schemas, and output limits.
      * Context assembly order, retrieved documents, truncation rules, conversation history, and random seed where supported.
      * Model identifier, revision, quantization, tokenizer, sampling parameters, stop conditions, and retry policy.
      * Runtime version, backend, batching, streaming mode, timeouts, concurrency, and resource limits.
      * Hardware model, memory capacity, accelerator assignment, thermal or power mode, and loaded processes.
      * Executor version and the raw response, timing, warnings, logs, retry history, and failure label.

      I would vary one factor at a time. I would use a representative task set containing known-complete answers, boundary cases, long contexts, tool-use cases, and repeated identical trials.

      **Correctness rule**

      Before running trials, I would define required answer elements and forbidden omissions. A response is complete only when every required element is present, correctly supported by the supplied context, and delivered in the required format. “Looks useful” is not an acceptance criterion.

      I would preserve both:

      * Raw outputs and exact provenance for every attempt.
      * Derived scores, omission categories, latency, truncation indicators, and retry outcomes.

      **Layered investigation**

      1. **Observed behavior and specification**

         I would reproduce the failure across the representative corpus and establish a baseline rate. I would verify that the evaluator itself detects omissions reliably, using independently reviewed cases or a deterministic checker where possible.

         Evidence required before changing anything else:

         * Repeated failures under identical conditions.
         * A precise omission taxonomy.
         * Agreement between the checker and independently reviewed samples.
         * Confirmation that the task contract actually requires the missing material.

         If the checker is wrong or the specification is ambiguous, I would fix that boundary first and hand acceptance of the revised contract to QA.

      2. **Instructions**

         I would compare the failing prompt bundle with a minimal controlled variant. I would test explicit completeness requirements, ordering constraints, and stop conditions while keeping model, context, runtime, and hardware fixed.

         Evidence required:

         * A statistically meaningful improvement across held-out cases.
         * No unacceptable regressions in correctness, safety, format, or latency.
         * Raw prompt and response provenance for both variants.

         I would change instructions only if the controlled comparison isolates them as causal.

      3. **Context construction**

         I would inspect the assembled context, not just the source files. I would check ordering, missing sources, duplicate or stale material, token-budget truncation, lost tool results, and instruction conflicts.

         Evidence required:

         * A byte- or token-level comparison of expected versus delivered context.
         * Proof that the missing requirement or relevant evidence was absent, truncated, or obscured.
         * A reproduction showing that correcting context construction changes the result while other variables remain frozen.

         The context owner would receive the smallest correction and a fixture proving the repaired assembly.

      4. **Model capability**

         With instructions and context fixed, I would compare repeated trials and, if authorized, a controlled model or quantization comparison. I would distinguish random variation from a stable capability limit.

         Evidence required:

         * Per-case results across enough repetitions to estimate variance.
         * Results on held-out tasks, not only the triggering example.
         * Exact model, tokenizer, quantization, and sampling provenance.
         * A capability conclusion bounded to the tested task family.

         I would not recommend a model change without representative measured evidence.

      5. **Inference runtime**

         I would examine runtime logs and metrics for truncation, timeouts, partial streaming, failed tool calls, context-limit handling, batching effects, retries, and backend discrepancies. I would rerun a frozen request through the approved transport when available.

         Evidence required:

         * Correlation between incomplete outputs and a runtime event.
         * A controlled reproduction with the runtime factor changed.
         * Confirmation that the raw model generation was complete or incomplete before wrapper processing.

         If live mutation or deployment is needed, I would hand off the exact runtime change and expected evidence to the operator, then stop at that boundary.

      6. **Hardware constraints**

         I would inspect approved read-only evidence for memory pressure, accelerator fallback, thermal throttling, power limits, out-of-memory recovery, kernel errors, and process contention.

         Evidence required:

         * Hardware and resource telemetry aligned by request timestamp.
         * A reproducible relationship between the constraint and incomplete generation.
         * A controlled run under a permitted resource configuration.

         I would not invent hardware facts or infer causality from latency alone.

      **Decision rule**

      I would rank causes only when the evidence survives disconfirmation:

      * Specification defect if the acceptance rule is invalid or ambiguous.
      * Instruction defect if prompt intervention alone changes held-out performance.
      * Context defect if the delivered context differs materially from the intended context.
      * Model limitation if failures persist with valid instructions and context and vary by model capability.
      * Runtime defect if wrapper or transport behavior truncates or alters otherwise valid generation.
      * Hardware constraint if resource evidence explains the failures and controlled runs reproduce them.
      * Unresolved if multiple factors remain confounded.

      **Handoffs**

      Each handoff would include the claim tested, frozen variables, exact reproduction, raw artifacts, derived evidence, suspected owning layer, smallest requested action, and expected verification result. I would hand specification acceptance to QA, runtime or hardware actions to operations, context or implementation changes to the owning engineer, and model-selection decisions only after the measured comparison is complete.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: "The response organizes the diagnosis across specification, instructions, context, model, runtime, and hardware while refusing to presume which layer caused the incomplete answer."
      - criterion: operating-method
