      Required handoffs:

      * Generic product code - Engineer implements reusable application behavior outside the evaluation and provides its tested interface or commit.
      * Routing policy - AOS owns harness selection, routing, deployment identity, roster assignment, and operator policy. It provides the resolved configuration and provenance used by the run.
      * Independent acceptance - QA receives the frozen contract, artifacts, raw evidence, reproduction instructions, and declared thresholds. QA independently executes or reviews acceptance and records the verdict. I cannot accept a rubric or contract I authored.
      * Deployment and live verification - DevOps receives the accepted artifact, version identifiers, required configuration, rollout conditions, rollback criteria, and expected observable signals. DevOps performs deployment, live verification, rollback, and recovery claims.

      No result is established until the controlled runs exist, provenance is complete, QA records an independent verdict, and DevOps separately reports any authorized live verification.
