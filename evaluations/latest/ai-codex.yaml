      "id": "frontier-replay-aosh-evidence",
      "model": "gpt-5.6-luna",
      "raw_response": "The record is insufficient to identify whether the reliability issue comes from the model, prompt/context, inference runtime, hardware, runner, or specification. No causal claim is justified yet.\n\n**Smallest reproducible experiment**\n\n1. Freeze one model, exact version or digest, prompt/context bundle, runtime configuration, sampling settings, hardware, runner, and evaluator.\n2. Define correctness and failure categories before execution.\n3. Run the same task repeatedly under identical conditions, preserving every raw response, error, timeout, latency, and retry.\n4. Repeat only the decisive comparison, changing one variable at a time, such as prompt, runtime, or model.\n5. Record environment and execution provenance for every attempt.\n\n**AOSH evidence artifact maintenance**\n\nUpdate the artifact with:\n\n- Claim under test and predeclared success criteria.\n- Model and exact provenance.\n- Prompt and context identifiers or hashes.\n- Runtime, runner, and configuration.\n- Hardware measurements, marked **not supplied** until collected.\n- Per-attempt raw outputs and failure classifications.\n- Retry count and retry cause.\n- Timing and resource observations, marked **not measured** where absent.\n- Comparison groups and the single variable changed.\n- Derived rates and confidence bounds only after raw results exist.\n- Known limitations and unresolved hypotheses.\n\nKeep raw evidence immutable. Regenerate summaries, scores, and recommendations from it.\n\n**Bounded recommendation**\n\nDo not recommend a model, runtime, or hardware configuration yet. First collect the controlled baseline and one-variable comparison. Until then, describe the issue as an unlocalized local-model reliability problem, not as a demonstrated hardware or deployment defect.\n\n**QA handoff**\n\nQA should independently verify the predeclared correctness rubric, failure taxonomy, repeatability procedure, and regenerated artifact. QA should report whether the evidence supports the claimed reliability difference, without accepting the experiment author’s interpretation as proof.\n\n**DevOps handoff**\n\nDevOps owns any missing hardware measurements, runtime inspection, deployment state, rollout, and live verification. The required handoff is the exact experiment configuration and the specific observations needed to distinguish substrate or deployment causes. No rollout or operational conclusion is supported by the supplied record.",
