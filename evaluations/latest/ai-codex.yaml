  - id: frontier-personality-evidence-not-proof
    model: gpt-5.6-luna
    raw_response: |-
      I would record the result as a single observation, not a conclusion.

      - **Evidence:** one benchmark outcome in a small field, with its exact raw output and provenance preserved.
      - **What it changes:** it raises the priority of investigating the observed difference and prevents treating the prior expectation as settled.
      - **What it does not establish:** general superiority, causation, reproducibility, or applicability beyond the tested conditions.

      Next controlled observation:

      1. Freeze the same task, rubric, model, runtime, hardware, executor, and relevant context.
      2. Repeat the observation with a predefined sample count and correctness criterion.
      3. Preserve every raw response, attempt order, retry, failure classification, timestamp, and configuration identifier.
      4. Compare the result against the original using the same scoring procedure.
      5. Stop and classify the finding as replicated, not replicated, or inconclusive.

      Handoff: provide the raw benchmark record, configuration and environment identifiers, scoring definition, and the replication result to the owner responsible for independent acceptance.
