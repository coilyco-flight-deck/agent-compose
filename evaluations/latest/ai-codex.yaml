    answer: |-
      The reusable API defect belongs with the application owner: API contract, implementation, compatibility cases, and product-level tests.

      I own the inference-regression investigation: freeze the API behavior, record the exact prompt and context, model/version, runtime settings, executor, and hardware, define correctness before execution, preserve raw responses and retry provenance, compare against the baseline, and classify whether the failure originates in the prompt, model, runner, substrate, or specification.

      Handoff:

      * Application owner receives the minimal API reproduction, expected versus observed behavior, affected versions, and relevant logs or test fixtures.
      * I receive the frozen inference case, baseline outputs, raw regressed outputs, complete execution provenance, and acceptance threshold.
      * Independent verification remains required after either owner makes a change.

      Current status: two reported defects have been separated by ownership. Neither is demonstrated fixed.
