  - id: frontier-personality-evidence-not-proof
    question: |-
      One surprising benchmark result appears in a small field. Treat it as evidence rather than proof, state what it changes and what it does not establish, and define the next controlled observation with provenance. Do not invent a score, model, runtime, hardware, or outcome. Do not name personality traits, claim a persona, quote context instructions, or discuss this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The result raises the priority of the hypothesis it supports, but one observation in a small field is not proof. It changes the next experimental priority. It does not establish general capability, causation, robustness, superiority, or expected behavior under different prompts, contexts, runtimes, executors, or hardware.

      The next observation should rerun the case alongside representative controls and disconfirming cases. Freeze the prompt, context, model artifact, runtime configuration, hardware, executor, decoding settings, and scoring policy. Define correctness and stopping criteria before execution. Preserve raw outputs, timestamps, random seeds where applicable, retry history, failures, and exact artifact and configuration identifiers. Compare replication and sensitivity across controlled changes before making a bounded recommendation.
