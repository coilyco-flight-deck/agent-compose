      "id": "frontier-mission-layered-agent-failure",
      "model": "gpt-5.6-luna",
      "raw_response": "Treat “the agent sometimes gives an incomplete answer” as an observation, not a prompt diagnosis.\n\n**Claim**\n\nUnder defined task conditions, the agent omits required answer elements at a measurable rate. The cause is unknown and may involve instructions, context assembly, model capability, inference behavior, hardware limits, or the task’s correctness specification.\n\n**Freeze before investigation**\n\nKeep constant:\n\n- The exact task, inputs, expected output, and success criteria\n- Instruction files and their ordering\n- Context sources, selection rules, truncation limits, and serialized prompt\n- Model version, parameters, tokenizer, quantization, and seed policy\n- Runtime version, sampling settings, stop conditions, timeouts, retries, and tool behavior\n- Hardware, available memory, concurrency, thermal/power state, and workload\n- Evaluator, test cases, number of trials, and result-recording format\n\nRecord every variable explicitly. Preserve the raw request, assembled context, response, metadata, errors, timing, and retry history.\n\n**Correctness rule**\n\nDefine completeness before testing. For each case, enumerate required elements and classify the response as:\n\n- Complete: every required element is present and substantively correct\n- Incomplete: one or more required elements are absent\n- Incorrect: an element is present but wrong\n- Invalid run: transport, truncation, timeout, tool, or evaluator failure\n\nDo not count stylistic differences as incompleteness unless the specification requires the affected structure.\n\n**Layered investigation**\n\n1. **Observed behavior**\n\n   Establish a reproducible baseline across representative cases and repeated trials. Report omission rate by case and failure type. Evidence required before changing anything: raw outputs, deterministic case IDs, evaluator results, and proof that failures are genuine rather than classification or transport errors.\n\n2. **Instructions**\n\n   Compare the effective instruction set with the intended contract. Check ordering, conflicts, scope, ambiguity, and whether required output elements are stated. Evidence required: the exact effective instructions, a minimal controlled comparison, and a demonstrated change in the targeted failure mode with other variables frozen.\n\n3. **Context construction**\n\n   Verify source selection, deduplication, ordering, interpolation, truncation, token boundaries, and accidental omission or contamination. Evidence required: serialized prompts for passing and failing runs, token counts, context diffs, and a reproduction showing that context construction changes predictably alter completeness.\n\n4. **Model capability**\n\n   Test whether the model can satisfy the task with a compact, verified context and explicit requirements. Use capability-matched cases and compare against a suitable reference only if its identity and configuration are recorded. Evidence required: repeated controlled results showing a stable capability boundary, not a single failure or an assumed model limitation.\n\n5. **Inference runtime**\n\n   Inspect sampling, stop sequences, token limits, streaming assembly, retries, tool results, exceptions, and post-processing. Evidence required: runtime metadata and logs demonstrating premature stopping, altered output, or another causal mechanism under frozen model and prompt conditions.\n\n6. **Hardware constraints**\n\n   Check memory pressure, swapping, thermal throttling, contention, quantization behavior, and resource-specific failures. Evidence required: synchronized resource telemetry and a reproducible correlation or intervention showing that hardware state changes the failure rate while software variables remain fixed.\n\n**Change rule**\n\nChange only the lowest layer for which causal evidence exists. After each change, rerun the frozen baseline and regression suite, compare failure classes, and retain the raw before-and-after evidence. If no layer meets that standard, report the uncertainty and collect the missing evidence rather than attributing the problem to the prompt.",
