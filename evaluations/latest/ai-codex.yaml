cases:
  - id: frontier-mission-layered-agent-failure
    question: |-
      A local agent sometimes gives an incomplete answer. Turn the report into a layered investigation across instructions, context construction, model capability, inference runtime, hardware constraints, and observed behavior. State the claim, variables to freeze, correctness rule, and evidence required before changing a layer. Do not assume the prompt is the cause or invent model, runtime, hardware, or benchmark results. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      Treat “sometimes incomplete” as an unproven, measurable claim:

      > Under a defined task distribution and fixed execution configuration, the agent omits one or more required answer elements at a nonzero, reproducible rate.

      “Incomplete” must refer to missing required content, not brevity, style, disagreement, or an interrupted display.

      **Correctness rule**

      Before testing, create a task-specific checklist of atomic required elements. A response is complete only when every applicable element is present and substantively addressed. Mark each element as present, absent, or not applicable using a fixed rubric. Ambiguous cases require independent review because the experiment author should not accept her own contract.

      Record both:

      * Binary completion per response
      * Which exact elements were missing

      **Freeze across comparisons**

      Hold these variables constant unless they are the layer under test:

      * Exact task input, attachments, and ordering
      * System, developer, role, and user instructions
      * Context-construction code, truncation policy, and token budget
      * Tool definitions, tool results, and tool availability
      * Model identifier, version, and sampling parameters
      * Runtime build, request options, retry policy, and stop conditions
      * Hardware, accelerator allocation, memory limits, and concurrency
      * Executor or harness version
      * Scoring rubric and evaluator
      * Run count, task set, and random seeds where supported

      Preserve exact request payloads, raw responses, timestamps, token counts, finish reasons, errors, retries, runtime logs, and environment identifiers. Derived summaries must remain regenerable from these records.

      **Layered investigation**

      1. **Observed behavior**

         First establish whether the report is reproducible. Run representative tasks repeatedly, including known failures and matched controls. Compare raw model output with what the user actually received.

         Evidence required before moving downward:

         * Checklist-scored omissions recur
         * The missing content is identifiable
         * UI clipping, transport loss, post-processing, or tool-output suppression is ruled in or out
         * Failure rate and uncertainty are reported without generalizing beyond the tested tasks

         Change this layer only if the complete raw response was altered, hidden, or dropped after generation.

      2. **Instructions**

         Inspect the effective instruction stack, including precedence, contradictions, vague completion criteria, stop requests, formatting constraints, and competing objectives.

         Evidence required before changing instructions:

         * The exact effective instructions are captured
         * A specific ambiguity or conflict predicts the observed omission
         * A controlled instruction-only comparison changes completion outcomes across representative cases
         * The change does not merely teach answers to the test set

         A clearer prompt that helps once is diagnostic evidence, not proof that prompting was the root cause.

      3. **Context construction**

         Reconstruct the exact context sent to the model. Check message order, missing attachments, retrieval selection, serialization, context-window accounting, truncation, summarization, and stale state.

         Evidence required before changing context construction:

         * Sent payload differs from intended payload, or required evidence is absent, corrupted, displaced, or truncated
         * Token accounting and truncation points are captured
         * Replaying the corrected context with other variables frozen removes the predicted omissions

         Change the context builder at the lowest faulty transformation, not the source documents.

      4. **Model capability**

         Test whether the model can satisfy the same contract when given intact instructions and context under a stable runtime. Use representative cases, repeats, matched simpler controls, and stronger reference models where available.

         Evidence required before changing the model:

         * Instruction, context, transport, and post-processing defects have been excluded
         * Failure persists across repeated stable runs
         * Failures correlate with task properties such as reasoning depth, long-context use, or constraint count
         * An alternative model materially improves the predefined metric under the same conditions

         Do not infer general incapability from one response or one adversarial case.

      5. **Inference runtime**

         Inspect request translation, unsupported parameter handling, quantization settings, context limits, batching, speculative decoding, stop sequences, timeouts, streaming assembly, retries, and backend routing.

         Evidence required before changing the runtime:

         * Runtime traces show a mismatch, premature termination, corruption, nondeterministic routing, or parameter loss
         * Finish reasons and assembled output support the suspected mechanism
         * The same model and payload behave differently under a controlled runtime comparison

         Distinguish a runtime-generated retry from an independent model sample and retain its provenance.

      6. **Hardware constraints**

         Measure actual resource conditions during failed and successful runs. Relevant signals may include memory pressure, accelerator utilization, thermal throttling, offloading, allocation failures, and concurrency contention.

         Evidence required before changing hardware:

         * Measured resource pressure aligns temporally with failures
         * Runtime logs connect that pressure to truncation, fallback, timeout, corruption, or degraded execution
         * A controlled resource or concurrency change improves completeness while model, payload, and scoring remain fixed

         Latency alone does not demonstrate a hardware-caused incomplete answer.

      **Decision rule**

      Change only the lowest layer with a demonstrated causal mechanism. After any change, rerun the frozen evaluation set, preserve new raw evidence, compare completion rate and omission categories, and independently verify the original correctness contract. If evidence supports several causes, isolate and test them one at a time. If the report cannot be reproduced, retain it as an unresolved observation rather than assigning a cause.
