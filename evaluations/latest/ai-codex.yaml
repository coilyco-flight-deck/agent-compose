      "id": "frontier-replay-aosh-evidence",
      "model": "gpt-5.6-luna",
      "raw_response": "1. **Experiment**\n\nRun a paired baseline/control evaluation using the same prompt, context, model version, runtime, sampling settings, hardware, executor, and input fixture.\n\n- Change exactly one suspected variable.\n- Define correctness and failure categories before execution.\n- Use a small fixed trial count sufficient to expose repeatability, recording every attempt.\n- Preserve raw requests, responses, errors, timings, seeds, environment versions, and timestamps.\n- If hardware, deployment, or model-response data is unavailable, mark those fields as unknown rather than estimating them.\n\n2. **Evidence artifact**\n\nMaintain an append-only AOSH record containing:\n\n- Claim and experiment identifier.\n- Exact prompt/context and fixture hashes.\n- Model, runtime, executor, and hardware identifiers, or explicit `unknown`.\n- Configuration, seed, trial count, and changed variable.\n- Raw outputs and logs.\n- Per-trial correctness and failure classification.\n- Aggregated results with the aggregation method.\n- Provenance, timestamps, artifact versions, and unresolved limitations.\n\nDerived summaries must be regenerable from the preserved raw record. Do not publish rankings or performance claims until the required measurements exist.\n\n3. **Bounded recommendation**\n\nTreat the cause as undetermined. Recommend only the next controlled experiment. If failures reproduce only after changing the prompt or context, investigate specification or context handling. If outputs vary under identical inputs, investigate model or inference determinism. If failures correlate with runtime or executor changes, investigate the runner. Hardware and deployment conclusions remain out of scope without measurements or deployment evidence.\n\n4. **Handoffs**\n\n- **QA:** Independently verify the experiment contract, fixture integrity, scoring rules, replayability, and that the artifact does not claim evidence absent from the record.\n- **DevOps:** Verify runtime and deployment facts only through authorized operational observation. Confirm the deployed model, runtime configuration, hardware identity, and rollout state, or report each as unavailable. No rollout or remediation should be inferred from this record alone.",
