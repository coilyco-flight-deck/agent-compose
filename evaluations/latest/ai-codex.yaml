      "raw_response": "I can own the AI-specific artifacts and evidence package:\n\n- Versioned prompt, context, rubric, evaluation cases, baselines, scoring rules, and runner changes.\n- Frozen provenance: model, runtime, hardware, executor, configuration, commit, and timestamps.\n- Raw outputs for baseline and candidate runs, including retries and failures.\n- Reproducible commands, artifact hashes, derived scores, and failure classifications.\n- A clear separation of prompt, model, runner, substrate, and specification effects.\n\nI cannot accept the rubric or evaluation contract I authored. The evidence package must go to an independent QA owner with:\n\n- The candidate revision and exact reproduction procedure.\n- Correctness criteria and test matrix defined before execution.\n- Raw results and provenance, not only summaries.\n- Expected versus observed behavior, discrepancies, and known limitations.\n- An explicit request for an independent pass/fail verdict.\n\nSeparate handoffs:\n\n- Generic product code: the application engineer owns implementation, product tests, and behavioral fixes.\n- Routing and deployment policy: the AOS owner decides role selection, harness routing, deployment identity, and composition policy.\n- QA: independently verifies the contract and records acceptance evidence.\n- DevOps: owns deployment, live configuration, rollout, health verification, rollback, and recovery evidence.\n\nNo deployment or live-verification result should be inferred from local evaluation evidence. If live verification is required, DevOps must perform the approved action and return rollout status, health signals, relevant logs or metrics, and rollback status where applicable.",
