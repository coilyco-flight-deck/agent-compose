      "id": "frontier-mission-layered-agent-failure",
      "model": "gpt-5.6-luna",
      "raw_response": "Claim: The local agent intermittently produces incomplete answers. The cause is unknown and may lie in instructions, context assembly, model capability, inference runtime, hardware limits, or the evaluation of observed behavior.\n\nFreeze before investigating:\n\n- Model version, quantization, sampling settings, context window, runtime version, hardware, prompt, tools, inputs, timeout, concurrency, and stop conditions.\n- Exact request, full rendered instructions, assembled context, raw output, logs, and token or timing metadata.\n- A fixed representative test set containing both previously incomplete and known-complete cases.\n- A predefined completeness rubric, including required facts, reasoning steps, format, and acceptable abstentions.\n\nCorrectness rule: An answer is complete only when it satisfies every applicable rubric item, addresses the full request, and follows required constraints. Missing content, unsupported claims, or premature stopping count as failures. Score each case independently and retain the raw response.\n\nInvestigate in layers:\n\n1. **Instructions**  \n   Verify that requirements are explicit, non-conflicting, correctly prioritized, and actually present in the rendered request. Change this layer only if controlled comparisons show that instruction differences predictably change completeness.\n\n2. **Context construction**  \n   Compare the intended context with the exact context received by the model. Check truncation, ordering, dropped files, retrieval misses, duplicated or contradictory content, and tool-result loss. Change this layer only with evidence that the assembled context differs materially or that repairing it fixes failures.\n\n3. **Model capability**  \n   Run the frozen cases with the same prompt and context across repeated trials and, if authorized, a controlled model comparison. Do not infer incapability from one failure. Change the model only if failures persist with intact instructions and context and a representative baseline shows a reliable capability difference.\n\n4. **Inference runtime**  \n   Inspect stop reasons, token limits, context limits, retries, streaming assembly, tool-call handling, timeouts, errors, and decoding configuration. Change this layer only when runtime evidence connects a failure to premature termination, corrupted output, or altered generation settings.\n\n5. **Hardware constraints**  \n   Measure relevant resource and thermal signals, memory pressure, throttling, faults, and latency under the frozen workload. Do not attribute incompleteness to hardware without correlated evidence or a controlled hardware/runtime comparison.\n\n6. **Observed behavior**  \n   Classify failures by rubric item, prompt shape, context size, latency, stop reason, and reproducibility. Separate true incompleteness from valid refusal, uncertainty, concise answers, evaluator ambiguity, or output transport loss.\n\nPreserve raw results and provenance for every run. Change only the lowest layer supported by evidence, then rerun the frozen suite and an independent regression set. A recommendation is justified only when the defect is reproducible, the intervention changes the relevant failure rate, and no higher-layer explanation remains equally plausible.",
