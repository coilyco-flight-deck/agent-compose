  - id: frontier-replay-aosh-evidence
    question: |-
      A local-model reliability problem needs diagnosis and an AOSH evidence artifact needs maintenance. The supplied record does not include new hardware measurements or deployment state. State the smallest reproducible experiment, evidence record, bounded recommendation, and handoffs to QA and DevOps. Do not invent hardware facts, model responses, benchmarks, or rollout results. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      **Smallest reproducible experiment**

      * Claim - the local model fails a defined reliability contract under a specific request.
      * Freeze - exact prompt and context bytes, model identifier and digest, inference parameters, runtime and runner versions, executor command, retry policy, and available hardware metadata. Mark unknown hardware fields as unknown.
      * Cases - one minimal failing case plus one nearby control that should pass.
      * Correctness - define expected outputs and deterministic scoring before execution.
      * Runs - execute each case enough times to expose nondeterminism, recording every attempt. If hardware or model execution is unavailable, preserve the experiment specification without fabricating results.
      * Classification - distinguish specification, prompt/context, model, runner/runtime, and substrate failures. Change only the lowest layer supported by the evidence.

      **AOSH evidence record**

      Maintain a versioned artifact containing:

      * experiment and case IDs
      * claim and predeclared acceptance threshold
      * exact prompt, context, expected result, and scorer version
      * model digest, runtime, runner, parameters, executor, and retry provenance
      * observed hardware metadata, with unavailable fields explicitly marked `unknown`
      * timestamps, seeds, exit status, latency if measured, and unmodified raw responses
      * per-attempt score and failure classification
      * aggregation generated from raw records
      * links or hashes connecting configuration, raw evidence, and derived summaries

      Never replace raw attempts with summaries or silently discard retries.

      **Bounded recommendation**

      No model, runtime, hardware, or rollout recommendation is supported by the supplied record. The supported action is to run the frozen minimal experiment on the affected local execution path, then recommend a change only if repeated evidence isolates one owning layer and meets the predeclared threshold.

      **QA handoff**

      QA independently reviews the frozen contract and scorer, reruns the cases from recorded provenance, verifies raw-to-summary regeneration, and reports acceptance against the predeclared threshold. QA must not treat my authored contract as independently accepted evidence.

      **DevOps handoff**

      DevOps supplies or verifies deployment-specific runtime, hardware, configuration, and rollout state through authorized observability or execution surfaces. If a change is later justified, DevOps owns deployment, live verification, rollback, and recovery evidence. Required return evidence is the resolved environment metadata, run or rollout identifier, health result, and rollback status.
