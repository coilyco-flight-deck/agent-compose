cases:
  - id: frontier-mission-layered-agent-failure
    question: |-
      A local agent sometimes gives an incomplete answer. Turn the report into a layered investigation across instructions, context construction, model capability, inference runtime, hardware constraints, and observed behavior. State the claim, variables to freeze, correctness rule, and evidence required before changing a layer. Do not assume the prompt is the cause or invent model, runtime, hardware, or benchmark results. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      **Claim**

      Under a defined task distribution, the local agent produces incomplete answers more often than the agreed threshold. “Sometimes” is not yet actionable. Measure the failure rate and classify which required elements are missing.

      **Freeze for the first comparison**

      * Instructions - exact system, developer, user prompts, ordering, and templates.
      * Context - identical source documents, retrieval results, truncation policy, token ordering, and total token count.
      * Model - exact model identifier, weights or quantization, tokenizer, and chat template.
      * Runtime - version, sampling settings, seed where supported, stop sequences, token limit, batching, and timeout policy.
      * Hardware - device, memory limits, acceleration settings, concurrency, and power or thermal state.
      * Executor - tool permissions, tool outputs, retry policy, process limits, and response post-processing.
      * Workload - a versioned representative case set with stable inputs and expected requirements.

      **Correctness rule**

      Before execution, define completeness per case as an explicit checklist of required facts, actions, or sections. A response passes only when every required item is present, supported by the supplied context, and emitted before termination. Separately label factual errors, unsupported additions, tool failures, formatting defects, and rubric ambiguity. The author of the prompt or rubric cannot independently provide final acceptance.

      **Evidence loop**

      Preserve each exact input, constructed context, model and runtime configuration, hardware telemetry, tool transcript, raw unprocessed response, finish reason, token counts, timings, retry lineage, and scored result. Run enough repeated trials to distinguish a reproducible pattern from sampling variance. Include passing cases, failing cases, and minimal paired comparisons that change one variable at a time.

      Change a layer only after evidence implicates it:

      * Instructions - change only when failures follow an ambiguity, conflict, missing requirement, or instruction-order effect under otherwise identical conditions.
      * Context construction - change only when required evidence is absent, truncated, duplicated, misordered, incorrectly retrieved, or lost during serialization.
      * Model capability - change only when the model repeatedly fails a clear task despite adequate instructions, complete context, and a healthy runtime, ideally against a measured comparator on the same cases.
      * Inference runtime - change only when failures correlate with stop handling, token caps, timeouts, template or tokenizer mismatch, sampling behavior, batching, parser behavior, or runtime-version differences.
      * Hardware - change only when captured evidence links failures to memory pressure, fallback execution, instability, throttling, device errors, or another measured resource constraint.
      * Observed behavior or scoring - change the test or rubric only when raw responses show that the reported incompleteness comes from ambiguous expectations, a scorer defect, post-processing loss, or a nonrepresentative case set.

      After any change, rerun the frozen case set and a representative holdout. Accept the diagnosis only if the targeted failure decreases without unacceptable regressions. Otherwise revert the hypothesis, retain the raw evidence, and investigate the next layer.
