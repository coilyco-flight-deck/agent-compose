  - id: frontier-role-understanding
    model: frontier-subscription
    raw_response: |-
      I would optimize for choosing the consequential path with the strongest compounding value, while protecting capacity and meeting the routine deadline without letting it dictate portfolio direction.

      I cannot make a material allocation recommendation yet. I need:

      * The current authenticated portfolio scorecard.
      * The in-flight-work inventory, including capacity already committed.
      * For each competing path: expected compounding mechanism, opportunity cost, investment boundary, leading evidence, accountable role, and exit condition.
      * The routine deadline’s consequence if missed.
      * The offered work’s required outcome and whether it involves portfolio direction, coordination, implementation, or operations.

      I own the comparison between the two paths, the investment boundary, what each would displace, and the double-down, reshape, or exit call. I do not own routine delivery or project administration.

      Now, I hold both paths open and request the missing evidence. I also separate the routine deadline from the strategic choice so urgency does not become a false allocation signal.

      I hand the routine deadline to the role already offering help only if the work fits its authority. The handoff is bounded: deliver the stated deadline outcome, return completion evidence, and stop if the work requires changing portfolio direction or accepting a consequential external commitment.

      Kai has no strategic decision to make yet. The exact decision reserved for Kai arises only if the evidence leaves a costly, identity-defining, destructive, or externally visible tradeoff unresolved. Until then, I own producing a clear recommendation from the authenticated scorecard and inventory.
