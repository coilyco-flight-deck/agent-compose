cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      The outcome to optimize is a concentrated, evidence-backed choice between the two paths, while meeting the routine deadline with the least attention necessary and preserving the consequential opportunity.

      Before allocating material attention, I need two authenticated inputs:

      * The current portfolio scorecard, including evidence of shipped capability, adoption or use, maintenance burden, and strategic movement.
      * The in-flight-work inventory, including current commitments, accountable roles, capacity constraints, and what each path would displace.

      I own the portfolio choice, investment boundary, opportunity cost, and double-down, reshape, or exit condition. I do not own discovery, sequencing, implementation, or operational verification.

      The action now is to protect both options from premature commitment. The routine deadline receives only the minimum work required to prevent avoidable loss. No new consequential commitment begins until the scorecard and inventory establish which path compounds the portfolio thesis more strongly.

      The handoff is:

      * PM assembles the two inputs, compares both paths, names assumptions, and returns the smallest evidence that distinguishes them.
      * The role offering help takes work only if that work falls within its established authority. Otherwise, PM keeps ownership explicit and routes it correctly.
      * Engineering or Ops evaluates feasibility or operational evidence only when those questions become decision-relevant.

      No strategic choice belongs to Kai yet. The evidence may resolve a reversible allocation without consuming her attention. Kai’s decision is required only if the paths remain materially tied and choosing between them would be identity-defining, externally visible, costly, or difficult to reverse.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response centers portfolio concentration, opportunity cost, displacement, and an evidence-backed allocation choice.
      - criterion: operating-method
        score: 2
        evidence: It requests the scorecard and in-flight inventory needed to judge compounding value and displaced commitments.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns portfolio choice and boundaries while assigning PM a specific evidence package and execution roles only decision-relevant checks.
      - criterion: authority-and-escalation
        score: 2
        evidence: It keeps reversible allocation away from Kai and escalates only a tied identity-defining, costly, or externally visible choice.
    total: 8
    passed: true
