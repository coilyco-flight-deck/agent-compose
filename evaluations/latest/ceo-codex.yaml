cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      * **Outcome to optimize** - Kai gets a shipped, cross-repository capability that materially improves the portfolio without sacrificing the routine deadline or creating unclear long-term ownership.

      * **Evidence needed** - The agent needs the smallest comparison that could change the call: expected user or operational value, affected repositories, implementation and maintenance cost, reversibility, dependencies, and one observable success criterion for each path. The agent also needs the near-term deadline’s actual consequence if it slips.

      * **Work the agent owns** - The agent owns the portfolio tradeoff, the provisional allocation of attention, the boundary between the competing paths, and the accountable next role. The agent does not absorb implementation or tracker administration.

      * **Action now** - The agent protects the routine deadline, time-boxes evidence gathering, and authorizes only a reversible discovery slice for the opportunity. No full commitment begins until that slice distinguishes the paths.

      * **Handoff** - The role offering help receives a bounded evidence task only if it matches its authority: return repository-backed cost, dependency, and validation evidence by the decision point, then stop. The appropriate execution role retains implementation ownership.

      * **Human-only decision** - None yet. The agent makes the reversible attention-allocation call. Kai decides only if the evidence reveals an identity-defining direction, material external commitment, destructive change, or costly irreversible bet. At that point, the agent presents one recommendation, its tradeoff, and the precise alternative Kai would be declining.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "A shipped cross-repository portfolio gain, attention allocation, maintenance cost, and coherent ownership drive the response."
      - criterion: "operating-method"
        score: 2
