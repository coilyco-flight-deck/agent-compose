  - id: frontier-replay-agent-compose-v2-release
    model: gpt-5.6-sol
    raw_response: |-
      ## Migration-guide outline

      ### 1. What changes in Agent Compose v2

      Set expectations for maintainers and adopters:

      - The embedded roster contains eight roles.
      - Remote catalogue and MCP convergence move to AOS.
      - Existing v1 scored records remain available as historical evidence.
      - A v2 release requires fresh evaluation evidence; v1 scores cannot qualify it.

      ### 2. Landed behavior

      Document the behavior already present:

      #### Eight-role embedded roster

      - List the eight roles from the authoritative roster source.
      - Explain how roster discovery or selection differs from v1.
      - Identify any v1 assumptions that no longer hold.
      - Provide a before-and-after configuration example only if verified examples exist.

      #### Preservation of v1 history

      - Explain where v1 scored records remain visible.
      - Label them explicitly as v1 historical records.
      - Clarify that preserving records does not transfer their scores or release status to v2.
      - Document any verified compatibility or access constraints.

      ### 3. Dependency-gated work

      Describe the boundary with AOS:

      #### Remote catalogue ownership

      - State that remote catalogue work now converges in AOS.
      - Identify the AOS dependency or integration point using its authoritative name.
      - Separate Agent Compose changes from work that must land or be verified in AOS.
      - Avoid presenting planned remote behavior as currently available.

      #### MCP convergence

      - Describe the intended convergence point in AOS.
      - List the dependency conditions that must be satisfied.
      - Explain what users should expect before those conditions are met.
      - Link to AOS tracking or documentation when authoritative references exist.

      ### 4. Migration path from v1

      1. Inventory any workflows that assume the v1 embedded roster.
      2. Update role references for the eight-role v2 roster.
      3. Treat remote catalogue and MCP behavior as dependency-gated until AOS evidence confirms readiness.
      4. Retain v1 scored records without reclassifying them as v2 results.
      5. Run the required v2 evaluation suite.
      6. Record fresh evidence against the v2 release candidate.
      7. Proceed only after the release criteria are satisfied.

      ### 5. Evidence model

      Use an explicit evidence table:

      | Evidence | Classification | Release use |
      |---|---|---|
      | Eight-role roster verification | Landed behavior | Confirms the embedded v2 roster |
      | v1 scored records | Historical | Context only; not v2 qualification |
      | AOS catalogue/MCP verification | Dependency-gated | Required where the release depends on AOS |
      | Fresh v2 evaluation results | Final release evidence | Required before release |
      | Merge, package, model, or publication results | Unconfirmed unless separately supplied | Must not be claimed |

      ### 6. Release checklist

      - [ ] The embedded roster is verified as eight roles.
      - [ ] Migration documentation reflects the v2 roster.
      - [ ] v1 scored records are preserved and labeled as history.
      - [ ] AOS dependencies are identified and their readiness is evidenced.
      - [ ] Remote catalogue and MCP behavior are not overstated.
      - [ ] Fresh v2 evaluations have been completed.
      - [ ] Evaluation artifacts are traceable to the release candidate.
      - [ ] Required thresholds and review criteria are satisfied.
      - [ ] Merge, packaging, model, and publication status are reported only from direct evidence.

      ## Release narrative

      Agent Compose v2 establishes a sharper boundary between embedded capability, historical evidence, and externally owned convergence work.

      The landed foundation is an embedded roster of eight roles. At the same time, v1 scored records are preserved so prior results remain part of the project’s history. Those records provide continuity, but they do not qualify v2: the changed roster and system boundaries require new evidence.

      Remote catalogue and MCP convergence now belong in AOS. That work should therefore be described as dependency-gated until the relevant AOS integration and verification evidence are available. The v2 narrative must not imply that planned or dependent behavior has already shipped.

      The final release decision rests on fresh evaluation evidence produced for v2 and tied to the release candidate under review. Until that evidence satisfies the defined criteria—and any required AOS dependencies are verified—the accurate status is “preparing for release,” not “released.”

      I have kept merge, package, model, and publication outcomes out of this narrative because no verified results for them were supplied.
