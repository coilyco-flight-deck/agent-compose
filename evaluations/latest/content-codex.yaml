  - id: frontier-replay-agent-compose-v2-release
    model: gpt-5.6-sol
    raw_response: |-
      ## Migration-guide outline

      **Audience and goal**

      Operators and maintainers migrating from Agent Compose v1 to v2. The guide should help them understand what changes immediately, what remains blocked by dependencies, and what evidence is required before release.

      ### 1. What changes in v2

      * **Embedded roster** - Agent Compose v2 embeds eight roles.
      * **Responsibility boundary** - Remote catalogue and MCP convergence move to AOS.
      * **Evaluation history** - Existing v1 scored records remain available as historical evidence.
      * **Release standard** - Historical scores do not qualify v2 for release. V2 requires fresh evaluation evidence.

      ### 2. Migration steps

      1. Update integrations that assume the previous embedded roster to recognize the eight-role roster.
      2. Remove expectations that Agent Compose performs remote catalogue or MCP convergence.
      3. Configure the corresponding AOS-owned convergence path.
      4. Preserve v1 scored records without rewriting or presenting them as v2 results.
      5. Run fresh evaluations against the v2 implementation.
      6. Review the resulting evidence before making a release decision.

      ### 3. Landed behavior

      Document these as implemented v2 boundaries:

      * The embedded roster contains eight roles.
      * Remote catalogue convergence is no longer owned by Agent Compose.
      * MCP convergence is no longer owned by Agent Compose.
      * V1 scored records are retained as history rather than discarded or reclassified.

      ### 4. Dependency-gated work

      Document these as incomplete until their dependencies are verified:

      * End-to-end remote catalogue convergence depends on the corresponding AOS capability.
      * End-to-end MCP convergence depends on the corresponding AOS capability.
      * Any migration path relying on those capabilities remains gated until the AOS integration is available and verified.

      The guide should name the dependency without implying that it has merged, shipped, or been published.

      ### 5. Final release evidence

      Require a release evidence bundle that includes:

      * Fresh evaluation results produced against v2.
      * The evaluated v2 revision or artifact identity.
      * The evaluation configuration and applicable model identity.
      * Results covering the eight-role roster.
      * Results covering the Agent Compose to AOS responsibility boundary.
      * A clear account of failures, exceptions, and unresolved dependency gates.
      * An explicit release decision based on the fresh evidence.

      V1 scores may provide historical context, but they must remain labeled as v1 evidence and must not substitute for v2 evaluation.

      ## Release narrative

      Agent Compose v2 sharpens the product boundary. It embeds a focused roster of eight roles while moving remote catalogue and MCP convergence into AOS, where those cross-system responsibilities now belong. This gives each layer a clearer job and makes the migration contract easier to reason about.

      The transition preserves the v1 scored records as history. Those records remain useful for understanding earlier behavior and comparing evaluation eras, but they are not evidence that v2 is ready. Changes to the roster and convergence boundary create a new evaluation target.

      Release therefore depends on two distinct conditions. First, AOS-owned convergence must be available and verified wherever the v2 workflow depends on it. Second, v2 must produce fresh evaluation evidence that covers its eight-role roster and revised responsibility boundary. Until that evidence exists and the dependency gates are resolved, v2 should be described as implemented or pending verification according to the known state, not as released.

      This framing preserves the record, makes dependencies visible, and keeps the final release claim tied to current evidence rather than inherited confidence.
    scores:
