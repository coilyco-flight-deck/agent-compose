      "raw_response": "## Migration-guide outline\n\n### 1. Overview\n\n- Agent Compose v2 updates the embedded roster to the current loader-derived role set.\n- v1 scored records remain available as historical evaluation records.\n- Remote catalogue and MCP convergence move to AOS.\n- Release requires fresh evaluation evidence.\n\n### 2. What changed\n\n#### Landed behavior\n\n- The embedded roster is now derived from the current loader role set.\n- Existing v1 scored records are preserved as history rather than replaced.\n- Remote catalogue convergence is owned by AOS.\n- MCP convergence is owned by AOS.\n\n#### Dependency-gated work\n\n- AOS must provide the remote catalogue convergence path.\n- AOS must provide the MCP convergence path.\n- Any integration depending on those paths should remain visibly gated until their interfaces and behavior are available.\n\n#### Still required before release\n\n- Run a fresh evaluation against the v2 behavior.\n- Record the new evaluation results independently from the preserved v1 history.\n- Confirm that the release evidence covers roster derivation, historical-record preservation, and the AOS-owned convergence boundaries.\n- Do not describe the release as complete until that evidence is available.\n\n### 3. Migration impact\n\n- Consumers should treat the loader-derived role set as the source of truth for the embedded roster.\n- Consumers should read v1 scored records as historical evidence, not as the current v2 evaluation result.\n- Catalogue and MCP convergence should be obtained through AOS-owned integration points once those dependencies are ready.\n- Existing claims based only on v1 scores should be labeled as historical.\n\n### 4. Verification checklist\n\n- [ ] Confirm the embedded roster matches the current loader-derived role set.\n- [ ] Confirm v1 scored records remain intact and labeled as history.\n- [ ] Confirm catalogue convergence is delegated to AOS.\n- [ ] Confirm MCP convergence is delegated to AOS.\n- [ ] Produce fresh v2 evaluation evidence.\n- [ ] Attach the evidence to the release record before publication.\n\n## Release narrative\n\nAgent Compose v2 clarifies both what the embedded product owns and how its history should be read.\n\nThe embedded roster now follows the current loader-derived role set, keeping the shipped roster aligned with the loader that resolves it. Earlier v1 scored records remain preserved as historical evidence, so the project retains its evaluation trail while making room for fresh v2 results.\n\nThe change also establishes a clearer ownership boundary. Remote catalogue convergence and MCP convergence move to AOS. Those capabilities are therefore dependency-gated. They should be described as work that AOS must provide, not as completed Agent Compose behavior.\n\nRelease readiness depends on new evidence. The preserved v1 scores explain where the project has been, but they do not validate v2. Before release, I need fresh evaluation results that cover the new roster behavior, the retained historical records, and the AOS integration boundary. Until that evidence exists, v2 can be described as changed and partially dependency-gated, but not as fully release-validated.",
