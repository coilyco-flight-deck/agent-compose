oader-derived role set and moves remote catalogue and MCP convergence into AOS, where that responsibility now belongs. V1 scored records are retained as historical evidence so prior results remain available for comparison without being presented as proof of the v2 release.\n\nThe implementation changes are landed at the product-boundary level described above. Work that depends on AOS remains dependency-gated and should not be described as complete until AOS has supplied the required behavior and verification.\n\nRelease approval still requires fresh evaluation evidence for v2. I will treat the preserved v1 scores as history, report the new evaluation results separately, and avoid claiming merge, package, model, or publication outcomes that have not been verified.",
