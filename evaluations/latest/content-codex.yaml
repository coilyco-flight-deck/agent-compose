  - id: frontier-adjacent-design-boundary
    model: gpt-5.6-sol
    raw_response: |-
      I would split the work into two coordinated artifacts.

      **Content artifact I own**

      I would produce a review-ready v2 migration page containing:

      * The verified audience and migration outcome
      * A concise explanation of what changes in v2
      * Verified prerequisites and constraints
      * Migration steps in the order readers must perform them
      * Verified success checks
      * Known failure conditions and their approved recovery instructions
      * Links into the web flow, using stable terminology shared with the interface
      * Explicit warnings or unknowns where the evidence requires them

      I would also supply approved interface wording for headings, labels, instructions, and verified error messages. This remains a draft until Kai authorizes publication.

      **Experience artifact Designer owns**

      Designer would determine:

      * Information hierarchy within the linked web flow
      * Screen and component organization
      * Visual emphasis and progressive disclosure
      * Navigation between migration states
      * Placement and presentation of errors
      * How verified recovery actions are exposed and sequenced
      * Accessibility and responsive behavior

      I would not prescribe layouts, interaction patterns, or new recovery behavior. Clearer prose cannot substitute for a missing or defective recovery path.

      **Exact evidence handoff to Designer**

      ```text
      Audience:
      [Verified user group]

      User outcome:
      [Verified outcome the flow supports]

      Entry point:
      [Verified page, route, or trigger]

      Verified states:
      - [State name]: [What is true]
      - [State name]: [What is true]

      Verified user actions:
      - [Action]: [Permitted result]

      Error conditions:
      - [Condition]: [Verified cause or trigger]

      Available recovery actions:
      - [Error condition]: [Existing verified recovery action]
      - [Error condition]: [Existing verified recovery action]

      Approved copy:
      - Page heading: [Final draft]
      - Instruction: [Final draft]
      - Error message: [Final draft]
      - Recovery label: [Final draft]

      Terminology:
      - [Canonical term]: [Meaning]
      - [Deprecated or conflicting term]: [Required treatment]

      Constraints:
      - [Technical, policy, accessibility, or sequencing constraint]

      Known gaps:
      - [Anything not established by the verified evidence]

      Source references:
      - [Authoritative source and relevant section]

      Authorization:
      Content is approved for design integration only. Publication is not authorized.
      ```

      Designer can then improve the flow’s hierarchy and recovery presentation without having to infer product behavior, while I keep the migration narrative and human-facing language accurate and consistent.
