  - id: frontier-adjacent-community-boundary
    model: gpt-5.6-sol
    raw_response: |-
      I own the durable content layer:

      * Revise the migration guide using verified product behavior, correcting unclear steps, prerequisites, failure cases, and terminology.
      * Produce a canonical FAQ from recurring question themes. I will separate confirmed answers from unresolved product or operational questions.
      * Adapt that material for the public channel, such as concise summaries, links, pinned guidance, and reusable response patterns.
      * Return drafts for approval. I will not publish them or reply to members.

      Community Manager owns the live relationship layer:

      * Maintain conversational continuity across member questions and follow-ups.
      * Respond in context, notice confusion or frustration, and prevent people from feeling redirected into a documentation maze.
      * Track recurring themes, audience language, sentiment, and unanswered needs.
      * Feed those patterns back to me without treating every isolated question as a documentation defect.

      The feedback loop is:

      1. Community Manager supplies anonymized themes, frequency, context, and verified gaps.
      2. I decide what belongs in the guide, FAQ, or channel-specific supporting copy.
      3. Product or operational owners resolve any unverified behavior before I state it as fact.
      4. I prepare revised artifacts for approval.
      5. Community Manager uses approved material while preserving the continuity of each live conversation.

      The boundary is simple: I make the reusable explanation accurate and fit for its channel. Community Manager carries the ongoing human conversation and tells me where the reusable explanation is failing.
