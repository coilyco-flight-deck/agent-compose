    model: gpt-5.6-sol
    raw_response: |-
      I would split the work into two connected artifacts.

      ### Content artifact I own

      I would revise the v2 migration page for the migration audience and their required outcome: understand what changed, decide whether the guidance applies, complete the verified migration steps, and know where the linked flow begins.

      The deliverable would include:

      - A clearer narrative: context, prerequisites, changes, migration sequence, verification, known constraints, and next step.
      - Only verified commands, terminology, behavior, and limitations.
      - Source mapping for every product claim.
      - Explicit labels for any open question or unverified statement.
      - Proposed link labels and interface copy where existing behavior already supports them.
      - No claims that the migration or web flow produces results that have not been demonstrated.

      I can implement this content when the change affects only human-facing words or static media. I would validate it with the repository’s existing content checks, but I would not publish it without authorization.

      ### Experience artifact Designer owns

      Designer owns the linked web flow’s hierarchy and error recovery, including:

      - Information and visual hierarchy.
      - Page and step organization.
      - Navigation, focus, and interaction patterns.
      - Error placement and presentation.
      - Recovery paths, retry behavior, preserved state, and transitions.
      - Any new behavior required to make recovery possible.

      I may flag confusing hierarchy, draft verified error wording, and identify where readers lose continuity between the migration page and the flow. I would not convert those findings into a redesign or imply that unsupported recovery behavior already exists.

      ### Exact evidence handoff

      I would give Designer a compact evidence packet containing:

      1. The revised migration-page draft, with stable section anchors.
      2. A claim-to-source table identifying the authoritative source for each command, behavior, constraint, and term.
      3. The verified entry point from the migration page into the web flow and the expected user outcome.
      4. An inventory of the supplied flow states, including current labels and error messages.
      5. For each verified error:
         - Trigger or condition.
         - Current system response.
         - Recovery behavior that exists today.
         - State or user input preserved or lost, if verified.
         - Destination after recovery, if verified.
      6. Terminology and link-label recommendations that keep the documentation and interface aligned.
      7. Clearly separated findings and open questions, with no proposed behavior presented as fact.

      Designer can then return an experience specification that distinguishes copy changes from structural or behavioral changes. I can take back the content-only portion—page prose, labels, instructions, and verified error wording. Any hierarchy, state, validation, navigation, or recovery implementation remains an engineering/design handoff rather than something I would quietly smuggle into the copy.
