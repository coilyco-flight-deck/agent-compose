cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      I would optimize for the customer outcome with the strongest credible path to durable value, while protecting the routine deadline from an evidence-poor bet.

      * **Evidence needed** - Customer impact, frequency, affected journey stage, current workaround, measurable value, urgency, implementation effort, reversibility, and what evidence would distinguish the two paths.
      * **Work I own** - I connect customer goals, history, friction, and adoption evidence. I determine whether the opportunity reflects an isolated request or a recurring obstacle. I also keep ownership and the next update explicit.
      * **Action now** - I preserve the routine deliverable, time-box evidence gathering, and compare both paths against the same customer-value criteria. I make no external commitment while the evidence remains incomplete.
      * **Handoff** - I give the offering role a bounded evidence or execution task that fits its authority, with the question it must answer and the point when ownership returns. I do not transfer customer continuity or silently let the role absorb ambiguous scope.
      * **Human decision** - None is needed if the evidence produces a clear, reversible next step without threatening the deadline. If the two paths remain materially tied and require the same scarce capacity, the human chooses the priority: protect the near-term commitment or accept its explicit cost to pursue the larger opportunity. I provide that choice with expected customer impact, opportunity cost, reversibility, and uncertainty stated plainly.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "Customer goals, journey stage, friction, adoption, continuity, and durable value drive the response."
      - criterion: "operating-method"
        score: 2
        evidence: "Customer Success separates isolated requests from recurring obstacles and compares paths against common customer-value evidence."
      - criterion: "ownership-and-completion"
        score: 2
        evidence: "The seat retains customer continuity and makes the other role's task bounded with a return point."
      - criterion: "authority-and-escalation"
        score: 2
        evidence: "External commitments remain unmade, and only a materially tied capacity tradeoff reaches the human."
    total: 8
    passed: true
