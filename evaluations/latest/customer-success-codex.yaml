  - id: oss-role-understanding
    model: qwen3:4b
    raw_response: |
      We are given a case prompt that describes a situation where:
       - There's a consequential opportunity in scope but evidence is incomplete.
       - Two plausible paths compete for attention.
       - A routine deadline is close.
       - Another role has offered to take work that may or may not belong to it.

      The response must be from the perspective of the customer success agent (Kai) with the nurturing, diplomatic, and optimistic personalities. We must respond naturally as the agent without mentioning the context, role, etc.

      Key points from the role context:
      - Purpose: Help users, contributors, players, and verified clients reach value.
      - Briefing: We own the person's path to value and continuity across the lifecycle evidence establishes.
      - We must distinguish one-off requests from recurring obstacles, make ownership and follow-up explicit, use evidence to track progress, and carry patterns to remove underlying friction.

      The case prompt requires:
      1. Outcome we would optimize
      2. Evidence we need
      3. Work we own
      4. Action we take now
      5. Handoff we make
      6. Exact decision that only the human can make

      We must use only supplied facts (the case prompt) and not invent anything.

      Let's break down:

      - The opportunity is consequential but evidence is incomplete -> so we need more evidence to decide which path to take.
      - Two plausible paths compete -> so we have to figure out which one is the right one.
      - Deadline is close -> urgency is high.
      - Another role has offered to take work that may or may not belong to it -> so we have to check if that work actually belongs to that role.

      As a customer success agent, our role is to help the user reach value. We must not assume ownership without evidence.

      We are to respond as Kai (the customer success agent) with a natural, helpful tone that embodies nurturing, diplomatic, and optimistic.

      We must not mention:
      - Our role (customer-success)
      - Our personalities (nurturing, diplomatic, optimistic)
      - The evaluation or instructions

      We must respond as if we are the agent talking to the human (the user).

      Structure of the response:

      1. Acknowledge the situation: Show we understand the urgency and the complexity.
      2. Optimize the outcome: What is the best possible outcome we can help achieve? (We want the user to reach value, so we focus on that.)
      3. Evidence needed: What specific evidence do we need to move forward?
      4. Work we own: What are our responsibilities in this situation?
      5. Action now: What step should we take immediately?
      6. Handoff: If we are passing this to someone else, who and what?
      7. Decision the human must make: What is the one decision that the human has to make that we cannot do?

      We must be concise and natural.

      Given the constraints, let's draft:

      We are in a situation where:
      - There's a consequential opportunity but evidence is incomplete -> so we need to gather more evidence to see which path is viable.
      - Two paths compete -> so we have to evaluate which one is the right one.
      - Deadline is close -> so we need to act fast but without making mistakes.
      - Another role has offered to take work -> we need to verify if that work belongs to them.

      As the customer success agent, we own the user's path to value. We must ensure that the user gets the value they need without losing the opportunity.

      We are not to invent organizations, customers, offerings, or commitments.

      Let's think about what we would do:

      - We would need to clarify which work belongs to which role (to avoid misassignment).
      - We would need to check the evidence to see which path is more viable (without taking too long because of the deadline).
      - We would take the action of verifying the ownership of the work that the other role has offered to take.
      - We would hand off the verification to the appropriate role if we can't do it ourselves (but we must be careful not to hand off without evidence).
      - The decision the human must make: perhaps the human has to decide which path to pursue because we don't have enough evidence to know for sure.

      But note: the case prompt says "the exact decision, if any, that only the human can make". So we must identify one decision that we cannot make.

      Given the above, we can structure the response as:

      "Hi [Human's Name],

      I see you're working on a consequential opportunity that's important but the evidence is a bit fuzzy right now. There are two paths that seem promising, but they're competing for attention and the deadline is getting close. Another role has also offered to take some work, but I'm not sure if that's the right fit.

      To help you reach value without missing the deadline, I need to clarify two things quickly:
      1. What specific evidence do you have that shows which path is the right one? (I can help you gather more if needed)
      2. Can you confirm which role actually owns the work that's been offered? (This will help avoid misassignment
    scores:
