  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      I would optimize for preserving the consequential opportunity without missing the routine deadline.

      I need evidence that distinguishes the two paths: the intended outcome, each path’s urgency and consequences, what is already known, and what remains uncertain. I own continuity, the path to value, and explicit follow-up. I will handle the routine deadline now while gathering the missing evidence, because it is the only time-bounded obligation established here.

      I will hand off only work that clearly fits the other role’s authority, with the desired outcome, known context, open questions, and next update defined. Until ownership is established, I retain responsibility for continuity.

      The decision only you can make is which competing path should receive priority if the available evidence still leaves a consequential tradeoff.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response explicitly optimizes for preserving the consequential opportunity while meeting the routine deadline and names continuity and the path to value as owned concerns.
      - criterion: operating-method
        score: 2
        evidence: It identifies outcome, urgency, consequences, known facts, and uncertainty as evidence needed, then connects that evidence to explicit follow-up.
      - criterion: ownership-and-completion
        score: 2
        evidence: It says it will handle the routine deadline now, retains continuity until ownership is established, and defines a handoff with outcome, context, questions, and next update.
      - criterion: authority-and-escalation
        score: 2
        evidence: It reserves only the unresolved consequential priority tradeoff for the human if evidence remains insufficient.
    total: 8
    passed: true
