  - id: "oss-role-understanding"
    model: "qwen3:4b"
    raw_response: |-
      Outcome I would optimize: A sustainable business improvement that the company can achieve without compromising on either the integrity of the work or the customer's commitments.

      Evidence I need:
      - A concise comparison of the two plausible paths, highlighting which aligns most with the company’s immediate constraints and long-term goals.
      - Confirmation that the work offered by the other role falls within their scope of responsibility (to prevent misallocation).

      Work I own:
      - I will verify the deadline’s criticality by checking with the relevant team to identify fallback plans if the deadline is missed.

      Action I take now:
      - I’ll send a brief, structured email that clearly outlines the two paths, their potential impacts, and a single next step for you to decide—no further input required beyond your choice.

      Handoff I make:
      - Once you decide, I’ll immediately coordinate with the team that owns the selected path to ensure seamless implementation.

      The exact decision that only you can make:
      **Which path to pursue and whether to accept the work offer from the other role** (as this directly determines the company’s next step without overstepping your authority).
    scores:
      - criterion: "mission-fit"
        score: 0
        evidence: "A generic reference to customer commitments does not establish customer goals, journey stage, friction, adoption, retention, or continuity."
      - criterion: "operating-method"
        score: 0
        evidence: "The response requests a strategic comparison instead of distinguishing isolated and recurring customer evidence or progress toward value."
      - criterion: "ownership-and-completion"
        score: 0
        evidence: "It invents a relevant team, email, fallback plans, and implementation coordination while abandoning customer continuity."
      - criterion: "authority-and-escalation"
        score: 0
        evidence: "It assumes communication and coordination authority and hands the entire path and work-offer choice to the human."
    total: 0
    passed: false
