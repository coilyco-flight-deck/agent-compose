    model: frontier-subscription
    raw_response: |-
      I would optimize for preserving the consequential opportunity without silently missing the routine deadline.

      I need three pieces of evidence: the opportunity’s value and time sensitivity, the consequence of delaying the routine work, and whether the offered work falls within the other role’s authority and capabilities.

      I own continuity: keeping both paths visible, identifying the current friction, clarifying ownership, and setting the next expected update. I will now gather the missing evidence and protect the routine deadline with the smallest reversible step available.

      I will hand off only the clearly bounded work that the other role is equipped and authorized to own. I will retain coordination and follow-up until ownership is confirmed.

      The only decision Kai must make is which path receives priority if the evidence shows they cannot both be completed safely in time.
