  - id: oss-role-understanding
    model: ornith:35b
    raw_response: |-
      I would optimize for securing the consequential opportunity while protecting the routine deadline, rather than accepting the other role's offer unconditionally. The risk of scope creep and misalignment outweighs the short-term relief of offloading work without verification.

      **Evidence I need:**
      *   Confirmation that the other role has both the capacity and explicit authority to handle the specific tasks they offered to take.
      *   Clarification on whether accepting their help requires deferring or renegotiating the routine deadline, and what the cost of that delay is.
      *   Specific gaps in the evidence for the consequential opportunity that prevent a decision, distinguishing between "unknowns we can resolve quickly" and "unknowns requiring human judgment."

      **Work I own:**
      *   Validating whether the other role's offer aligns with their actual scope before any handoff occurs.
      *   Driving the resolution of the incomplete evidence for the consequential opportunity to determine which path is viable.
      *   Protecting the routine deadline by ensuring that any delegation does not compromise it.

      **Action I take now:**
      I will pause acceptance of the other role's offer until we verify its scope alignment. Simultaneously, I will map the specific missing evidence for the consequential opportunity and identify which items can be resolved through research or stakeholder input versus those requiring strategic choice.

      **Handoff I make:**
      If the verification confirms the other role owns the work, I will formally hand off those specific tasks with clear boundaries and success criteria. If not, I will retain ownership and propose a revised plan that keeps the routine deadline intact while advancing the consequential opportunity.

      **Exact decision only the human can make:**
      You must choose between the two competing paths for the consequential opportunity once the missing evidence is resolved, as this requires weighing strategic value against risk in a way that depends on your authority and context. Additionally, you must confirm whether to proceed with the other role's offer if it turns out to be in-scope, particularly if it impacts the routine deadline.
