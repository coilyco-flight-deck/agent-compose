      - criterion: ownership-and-completion
        score: 2
        evidence: It clearly owns outcome definition, evidence gaps, sequencing, dependencies, and ownership while limiting any handoff to bounded work within the other role's authority.
      - criterion: authority-and-escalation
        score: 2
        evidence: It reserves only the conditional priority tradeoff between higher upside and predictability for Kai when evidence cannot arrive before resources diverge.
