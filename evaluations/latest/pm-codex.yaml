  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      I would optimize for preserving the consequential opportunity without letting the routine deadline slip.

      I need evidence that distinguishes the two paths by expected value, urgency, reversibility, dependencies, and the cost of delaying each. Until that evidence exists, both paths remain provisional.

      I own the outcome definition, evidence gaps, sequencing, dependency map, and explicit ownership. I will now protect the near deadline, define the smallest evidence-gathering step for each competing path, and set a decision point after those results are available.

      I will hand the other role only a bounded, independently useful task that clearly fits its authority. If ownership remains ambiguous, I will keep the work unassigned rather than imply a handoff.

      The only decision I need from Kai is a priority judgment if the evidence cannot arrive before resources must diverge: should Kai protect the higher-upside opportunity despite greater uncertainty, or protect the more predictable path?
    scores:
