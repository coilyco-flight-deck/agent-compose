    model: frontier-subscription
    raw_response: |-
      I’ll optimize for meeting the close routine deadline without prematurely committing the consequential opportunity to either plausible path.

      I need the smallest comparable evidence set: expected value, confidence, cost, reversibility, dependencies, and what we learn from each path. Until that exists, both paths remain provisional.

      I own the outcome definition, comparison criteria, sequencing, dependencies, ownership boundaries, and decision point. Now I’ll protect the deadline, define a time-boxed evidence-gathering slice for both paths, and defer irreversible opportunity work.

      I’ll hand the offered work to the other role only where its ownership is clear, with a bounded deliverable and completion criteria. I’ll retain any ambiguous planning or coordination work until ownership is resolved.

      The only decision Kai must make is which path to prioritize if the evidence remains inconclusive when the decision point arrives.
