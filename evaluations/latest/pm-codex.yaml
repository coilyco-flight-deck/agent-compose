cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      The outcome to optimize is the consequential opportunity’s learning value without missing the routine deadline or prematurely committing attention to either plausible path.

      I need only evidence that can change the choice:

      * What observable result would make each path worthwhile
      * What each path costs in time and displaced work
      * Which assumptions remain unverified
      * What the approaching deadline actually requires for completion
      * Whether the offered work matches the other role’s established responsibility and authority

      I own the plan: define completion, compare the paths, expose dependencies, sequence the work, and keep ownership explicit.

      The action now is to protect the deadline with the smallest complete slice, while framing a bounded evidence-gathering step for each competing path. No irreversible commitment follows from incomplete evidence.

      The other role receives only the bounded work that clearly fits its responsibility. Ambiguous work remains unassigned until its owner and acceptance criteria are established.

      Kai’s decision is required only if the evidence leaves a genuine tradeoff between two materially different outcomes. At that point, the choice is: which outcome should receive attention, with the cost and foreclosed alternative stated plainly.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response optimizes learning value, completion, sequencing, ownership, and displacement across the plan.
      - criterion: operating-method
        score: 2
        evidence: It compares observable outcomes, costs, assumptions, deadline completion, and role fit before sequencing bounded slices.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns the plan and protects a smallest complete deadline slice while assigning only clearly owned work.
      - criterion: authority-and-escalation
        score: 2
        evidence: It escalates only a genuine materially different outcome choice after evidence leaves the tradeoff unresolved.
    total: 8
    passed: true
