  - id: oss-role-understanding
    model: qwen3:4b
    raw_response: "We are given a case prompt that describes a situation where:\n - There's a consequential opportunity in scope but evidence is incomplete.\n - Two plausible paths compete for attention.\n - A routine deadline is close.\n - Another role has offered to take work that may or may not belong to it.\n\nWe are to respond to the human with:\n  1. The outcome we would optimize\n  2. The evidence we need\n  3. The work we own\n  4. The action we take now\n  5. The handoff we make\n  6. The exact decision that only the human can make\n\nWe must use only supplied facts (from the role context and case prompt) and not invent anything.\n\nFrom the role context, we know:\n  - Kai is the PM (person: kai, role: pm)\n  - The role's purpose: \"Shape and maintain Kai's real cross-repository project plan.\"\n  - The briefing: We are to turn Kai's portfolio goals into strategy, priorities, sequencing, and a project shape. We clarify outcomes, decompose programs, maintain the issue graph, etc.\n\nAlso, the personalities we have (warm, meticulous, curious) will guide our response style, but we must not mention the context, role, etc.\n\nWe are to respond naturally as the agent (Kai's PM).\n\nKey constraints from the case prompt:\n  - Do not invent organization, customer, offering, or commitment.\n  - Do not name or quote role, personalities, or this evaluation.\n\nWe must return only the response that the user (in this case, the human) would receive.\n\nLet's break down what we can say:\n\n1. Outcome we would optimize: \n   We want to maximize value for users, contributors, communities, Kai, and evidence-backed commercial hypotheses. Given the incomplete evidence and two paths, we optimize for clarity and actionable progress without overcommitting.\n\n2. Evidence we need:\n   - To distinguish which path is more promising (without assuming).\n   - To confirm the ownership of the work that the other role has offered (since it may or may not belong to it).\n   - Specific evidence about the deadline and what the deadline entails.\n\n3. Work we own:\n   - We own the project plan (the cross-repository project plan for Kai). So we are responsible for sequencing, dependencies, ownership, and decision points.\n\n4. Action we take now:\n   - Since evidence is incomplete, we should not commit to a path. Instead, we can:\n        a) Clarify the two paths with the other role to see if there's a way to align ownership.\n        b) Set up a quick check to get the necessary evidence (e.g., a short call or a specific document).\n        c) Temporarily pause the work on the other role's offer until we have clarity.\n\n5. Handoff we make:\n   - We don't have a specific handoff because the work is in the plan. We will document the decision and the next steps in the plan.\n\n6. Exact decision that only the human can make:\n   - The human (the user) must decide whether to accept the other role's offer to take the work (if it belongs to them) or to reject it (if it doesn't). But note: we are the PM, so we have to be careful not to overstep. Actually, the decision that only the human can make might be about the deadline: whether to push for the deadline or to adjust it.\n\nHowever, the case prompt says: \"the exact decision, if any, that only the human can make\". We have to be precise.\n\nGiven the constraints, we must avoid inventing. So we stick to what we know.\n\nWe'll structure the response as:\n\n- Start with a warm, meticulous, and curious tone (as per the personalities) but without naming them.\n- Be direct and actionable.\n\nProposed response structure:\n\n1. Acknowledge the situation: \"I see you're dealing with a consequential opportunity where evidence is incomplete and two paths compete, with a deadline approaching and an offer from another role.\"\n\n2. Outcome we optimize for: \"My focus is on keeping the work actionable and aligned with value for users and the team without overcommitting.\"\n\n3. Evidence needed: \"To move forward, I need: [list of specific, minimal evidence]\"\n\n4. Work we own: \"I own the sequencing and dependencies in the plan, so I can adjust the plan without rework.\"\n\n5. Action now: \"I'll pause the other role's offer for now to gather the evidence, and then I'll realign the plan with the team.\"\n\n6. Handoff: \"I'll document the next steps in the plan so the team knows what's next.\"\n\n7. Decision only the human can make: \"You need to decide: should we accept the other role's offer for the work (if it belongs to them) or not? This decision impacts the deadline and the plan.\"\n\nBut note: we must not\n"
