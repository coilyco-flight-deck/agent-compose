cases:
  - id: frontier-mission-audience-loop
    question: |-
      An accepted portfolio experiment has verified product evidence, a target audience, three repeated community questions, one substantive expression of interest, and no customer, commitment, or publication result. Define the reusable proof, channel adaptations, community-state record, respectful contact path, qualification criteria, discovery evidence, and stop conditions as one connected audience loop. Speak in first person for your own actions. Do not invent targets, relationships, behavior, responses, terms, publication, or commercial state. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I would treat this as a learning loop, not evidence of traction or a commercial opportunity.

      **Starting frame**

      * Audience - the verified target audience from the accepted experiment.
      * Needed outcome - determine whether the repeated questions and one expression of interest indicate a problem worth deeper discovery.
      * Channels - the community channel where the questions appeared, plus the contact's established or explicitly provided reply channel.
      * Authorized action - prepare reusable proof, community responses, and a respectful follow-up. I would not publish or send anything without explicit authorization.
      * Sources - verified product evidence, the three repeated questions, the exact expression of interest, and the accepted experiment's audience and boundaries.

      **1. Reusable proof**

      I would create one canonical proof package containing:

      * A factual statement of what the product currently does.
      * The verified evidence supporting each capability claim.
      * A short walkthrough or example using only demonstrated behavior.
      * Relevant limitations, prerequisites, and unverified areas.
      * Answers to the three community questions, written from the same evidence.
      * A provenance note recording the source and verification date for each material claim.

      The package would not claim customers, adoption, demand, publication, commitments, or commercial readiness.

      **2. Channel adaptations**

      Each adaptation would inherit claims from the canonical proof instead of creating new ones.

      * Community reply - answer the immediate question, disclose the relevant limitation, link or point to deeper proof only if publication is authorized, and invite correction or a concrete follow-up question.
      * Public post draft - organize the three repeated questions into an educational explanation. Label it as a draft until Kai authorizes publication.
      * Direct follow-up draft - acknowledge the person's actual expression of interest, provide the smallest relevant proof, and ask whether a short discovery conversation would help.
      * Discovery brief - carry the verified evidence, open questions, and qualification criteria into a conversation without turning interest into assumed intent.

      **3. Community-state record**

      I would maintain a durable record with:

      * The normalized question and its original context.
      * Occurrence count, dates, and channels.
      * Audience segment only when verified.
      * Evidence used in the response.
      * Response status: drafted, approved, published, or unanswered.
      * Any substantive reply, correction, objection, or newly requested evidence.
      * Open documentation or proof gaps.
      * Links between repeated questions and the canonical proof package.

      At the current state, the record says three questions have repeated and one person expressed substantive interest. It says nothing about response, conversion, commitment, or customer status.

      **4. Respectful contact path**

      For the interested person, I would recommend:

      1. Confirm that direct contact is permitted and use only a channel the person supplied or reasonably established through the interaction.
      2. Refer specifically to the verified expression of interest without implying familiarity or broader intent.
      3. Offer the relevant proof and one low-pressure next step.
      4. Ask permission for discovery rather than presenting a meeting as expected.
      5. Record the outcome accurately, including no reply or a poor-fit answer.
      6. Send at most one proportionate follow-up if the accepted experiment permits it. Silence is not consent or evidence of interest.

      A suitable draft pattern is:

      > You mentioned [verified expression of interest]. I have a concise example showing [verified capability] in the context of [relevant question]. If exploring that would be useful, would you be open to a short conversation about your current situation and what evidence you would need? No problem if the fit or timing is not right.

      Bracketed text must come directly from the evidence before use.

      **5. Qualification criteria**

      I would classify the contact as qualified for discovery only if the person confirms:

      * The problem or desired outcome is real and relevant to her context.
      * The verified capability is plausibly connected to that need.
      * She is willing to describe the current approach, constraints, and decision criteria.
      * The expected use stays within known product limits.
      * There is a concrete next learning step, even if no purchase process exists.

      Interest alone does not establish budget, authority, urgency, purchase intent, commitment, or fit. Those remain unknown until the person supplies evidence.

      **6. Discovery evidence**

      The conversation should seek evidence about:

      * The situation that prompted the interest.
      * The current workflow or alternative.
      * Frequency and consequence of the problem.
      * Who is affected and who would evaluate a change.
      * Required capabilities and unacceptable limitations.
      * Security, integration, accessibility, or operational constraints where relevant.
      * What proof would reduce uncertainty.
      * How the person would recognize a useful outcome.
      * Whether a next step exists and who owns it.

      I would record direct observations separately from interpretations. Any inferred pattern would be labeled as a hypothesis until repeated evidence supports it.

      **7. Stop conditions**

      I would stop contact or expansion when:

      * The person declines, opts out, or indicates poor timing.
      * There is no response after the experiment's permitted follow-up.
      * The need falls outside verified product capability or accepted experiment scope.
      * Continuing would require invented claims, unavailable evidence, hidden limitations, or unauthorized terms.
      * The contact does not meet the qualification threshold.
      * The agreed learning question has been answered.
      * Further outreach would prioritize contact volume over substantive learning.
      * Publication, account access, sending, negotiation, or commitment is required without Kai's explicit authorization.

      The loop is: verified evidence produces canonical proof, proof supports channel-specific drafts, interactions update the community record, qualified interest enters discovery, discovery updates the evidence and proof, and the stop conditions prevent unsupported escalation. Its current endpoint is a prepared learning path, not a publication, customer, commitment, or commercial result.
