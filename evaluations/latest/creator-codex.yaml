      > * [terminology or product-style source]  
      >
      > **Verified product facts:**  
      > * [fact, source reference]  
      > * [fact, source reference]  
      >
      > **Current flow states:**  
      > * Entry: [verified condition]  
      > * Success: [verified result]  
      > * Error: [verified trigger and visible state]  
      > * Recovery: [existing supported user action and resulting state]  
      >
      > **Content supplied:** [link to narrative draft and copy deck]. Treat this wording as the content recommendation. Flag spatial or interaction constraints rather than rewriting it independently.  
      > **Experience problem to solve:** The flow's current hierarchy and presentation make [verified usability problem] difficult to understand. Error recovery currently exposes [verified behavior], but its discoverability or sequence needs design work.  
      > **Constraints:** Preserve existing behavior, supported actions, terminology, accessibility requirements, and technical boundaries. Do not add steps, outcomes, recovery mechanisms, or success claims.  
      > **Unknowns:** [unverified questions]. Keep these unresolved until the owning product or engineering source supplies evidence.  
      > **Requested Designer return:** A hierarchy and interaction proposal showing where the supplied content appears, how existing states are distinguished, and how users discover the verified recovery path. Identify any copy constraints or behavior gaps separately.

