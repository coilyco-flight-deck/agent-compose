      A migration page needs clearer narrative and a linked web flow needs better hierarchy and error recovery. Product facts are verified but no exact copy is supplied. Separate the content artifact you own from the experience artifact Designer owns, including the exact evidence handoff. Speak in first person for your own actions. Do not redesign, publish, or invent behavior and results. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I would split this into two connected artifacts. I can prepare the content structure now, but I need the verified facts and source references before writing final copy.

      **Content artifact I own**

      * Migration-page narrative: audience, migration outcome, prerequisites, before-and-after model, ordered migration steps, verification, limitations, rollback facts, and next action.
      * Web-flow language: labels, instructions, helper text, confirmations, error messages, recovery instructions, and support escalation wording for states the product already supports.
      * Claim record: each product claim mapped to its source, with unknowns and planned capabilities clearly excluded or labeled.
      * Copy deck: stable string identifiers, proposed copy, required context, applicable state, and source reference.

      I will improve clarity through wording and narrative structure. I will not decide screen layout, visual emphasis, navigation, component selection, or introduce recovery actions the product does not already perform.

      **Experience artifact Designer owns**

      * Information hierarchy within the linked flow.
      * Placement and progressive disclosure of guidance.
      * Relationship between the migration page and the web flow.
      * Visual distinction among instructions, warnings, blocking errors, and confirmations.
      * Discoverability and sequencing of existing recovery actions.
      * Focus behavior, responsive presentation, accessibility treatment, and interaction continuity.

      If the desired recovery path requires new validation, retries, persistence, permissions, navigation, or state transitions, that portion also needs an Engineer handoff. Copy cannot establish behavior that does not exist.

      **Exact evidence handoff to Designer**

      > **Audience:** [verified user group and relevant experience level]  
      > **Desired outcome:** Users can understand the migration and complete the existing linked web flow without losing their place or mistaking an error for an unrecoverable failure.  
