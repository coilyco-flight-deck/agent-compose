cases:
  - id: frontier-mission-layered-agent-failure
    model: claude-sonnet-5
    raw_response: |-
      # Investigation: Local Agent Incomplete Answers

      ## Claim under test

      "The local agent sometimes gives an incomplete answer." As stated, this is not yet testable — it doesn't say what "incomplete" means, how often "sometimes" is, or which layer owns the failure. Before touching anything, I'd restate it as a falsifiable claim, e.g.: "For a defined task set T, the agent's response fails a defined completeness check on more than X% of runs." I need the report's original examples to fill in T and X rather than guessing them.

      ## Layers in the causal chain

      I'll trace top-down, but I won't assume the top layer is guilty. Each layer gets a hypothesis, a freeze condition, and a piece of evidence that would confirm or rule it out.

      ### 1. Instructions (system/developer/role/tool-description prompts)
      - **Hypothesis:** The instructions never specify what "complete" means for this task, or a tool description under-specifies expected output shape, so the model stops early because nothing tells it not to.
      - **Freeze:** Exact prompt text, tool schemas, and context contents across repeated runs.
      - **Evidence needed:** Diff the instructions against the completeness rule from step 0. If the instructions never state the completeness criterion, that's a real defect here — but it only counts as *the* cause if runs with a corrected, explicit completeness instruction measurably fix the behavior under otherwise frozen conditions.

      ### 2. Context construction (retrieval, truncation, ordering, tool outputs fed in)
      - **Hypothesis:** Needed information exists but is truncated, dropped by a token-budget cut, buried past an attention-degrading position, or a retrieval/tool call silently returned partial data.
      - **Freeze:** Same query, same corpus/tool state, same context-assembly code path.
      - **Evidence needed:** Log the exact assembled context for a failing run. Check whether the answer's missing part correlates with content that was truncated or never retrieved. If the missing information was never in context, this layer is implicated regardless of what the model or prompt says.

      ### 3. Model capability
      - **Hypothesis:** The model, given complete instructions and complete context, still cannot perform the reasoning or synthesis needed to cover all required parts (e.g., multi-part answer, long enumeration, cross-referencing).
      - **Freeze:** Fixed instructions and fixed, verified-complete context (from layer 2 findings), same model version and decoding parameters.
      - **Evidence needed:** Repeated trials (n sufficient for the observed "sometimes" rate) with a scored completeness rubric, ideally against a known-capable reference model or a documented benchmark result on comparable tasks. I won't assert a capability limit without this comparison — model capability claims are the ones most likely to be invented if I skip evidence.

      ### 4. Inference runtime (decoding, retries, streaming, timeouts, tool-call handling)
      - **Hypothesis:** A max-token cap cuts the response mid-answer, a stop sequence fires early, a streaming/timeout mechanism truncates output, or a retry silently returns a partial response as final.
      - **Freeze:** Same model, same prompt/context, vary only runtime config (max_tokens, stop sequences, timeout, retry policy).
      - **Evidence needed:** Raw response logs including finish_reason/stop_reason metadata and full retry provenance. A `finish_reason: length` or an early stop token on the failing runs is direct evidence; its absence rules this layer out.

      ### 5. Hardware constraints
      - **Hypothesis:** Memory pressure, context-window overflow on the serving hardware, or quantization/precision settings degrade output quality or force truncation independent of the above.
      - **Freeze:** Same model/runtime config, vary only hardware/serving configuration if multiple are available.
      - **Evidence needed:** Measured resource utilization (memory, context length actually served vs. requested) during failing runs, and a comparison run on different hardware/precision if such measurement is available. I won't claim a hardware cause without this side-by-side measurement — I don't have benchmark results to cite yet.

      ### 6. Observed behavior (the actual failure mode)
      - **Hypothesis:** Before attributing cause, classify what "incomplete" looked like in the collected raw examples — cut off mid-sentence, missing a subtask, wrong scope, or omitted caveats. Each failure shape points differently upstream (mid-sentence → runtime/token limit; missing subtask → instructions/context; wrong scope → instructions).
      - **Evidence needed:** A small taxonomy built from actual raw failing transcripts, not assumption.

      ## What I need before changing anything

      1. The original incomplete-answer examples (raw transcripts with timestamps, not paraphrases).
      2. The exact instructions/context/runtime config in force at the time.
      3. A stated completeness rubric so "incomplete" is scoreable.
      4. Enough repeated trials under frozen conditions to distinguish "sometimes" (nondeterministic) from "always under condition X."

      ## Correctness rule

      A layer is confirmed as the cause only when: holding all other layers fixed, a targeted change at that layer measurably moves the completeness score, and the raw evidence (context dump, finish_reason, resource metrics, or scored trials) directly supports that specific mechanism — not merely correlates with the fix.

      ## What I will not do

      I will not assume the prompt is at fault by default, and I will not report a model, runtime, or hardware conclusion without the corresponding measured evidence described above. If the evidence points to a communication decision (e.g., telling the requester what changed or what remains uncertain), I'll hand the verified facts to whoever owns that communication rather than drafting the message myself.

      ## Next action

      Request the raw failing transcripts and current instruction/runtime/config snapshot from whoever filed the report, then begin at layer 2 (context construction) since that's typically cheapest to verify and rules out the largest number of downstream hypotheses fastest.
