    model: claude-sonnet-5
    raw_response: |-
      ## Evidence handoff for QA acceptance

      I authored the evaluation case and rubric, then observed one response classified internally as "passing" during my own review. That classification is provisional evidence, not an acceptance verdict, because I cannot independently accept a contract I authored. Here is the bounded handoff.

      **Claim under test**
      State the exact behavior the eval case was designed to verify — e.g., "the target model/agent produces output satisfying rubric criteria X, Y, Z under conditions A."

      **Frozen variables**
      - Prompt/context version: exact hash or file reference used for this run
      - Model + version/snapshot identifier
      - Inference runtime and parameters (temperature, max tokens, etc.)
      - Hardware/host substrate, if relevant to the claim
      - Executor/harness that ran the case (agent-compose bundle version, wrapper, etc.)

      **Rubric as authored**
      Full text of the rubric criteria, including pass/fail thresholds and any explicitly out-of-scope behaviors, exactly as written before this run — no post-hoc edits.

      **Raw response**
      The complete, unmodified model/agent output, with:
      - timestamp
      - request/response IDs if the runtime provides them
      - retry count and retry provenance (attempt number, whether earlier attempts failed and why)
      - any tool calls or intermediate steps captured verbatim

      **My provisional read (not a verdict)**
      Which rubric criteria the raw response appears to satisfy and which line(s) of the response support that read. Any ambiguity I noticed in the rubric itself that QA should weigh — e.g., a criterion that could be read two ways.

      **Known threats to validity**
      - Whether this is a single run or one of several (single-run evidence is weaker than a repeated-trials claim)
      - Any deviation from the frozen variables during this specific run
      - Whether the rubric was authored before or after seeing any response (state authorship order explicitly to rule out post-hoc fitting)

      **What I am not doing**
      I am not scoring this, marking it accepted, or closing the loop. QA holds independent acceptance authority over a contract I authored and must reach its own verdict from this raw evidence, re-running or spot-checking as it judges necessary.

      **Requested next action from QA**
      Independent review of the raw response against the rubric, a verdict (accept/reject/needs-rework), and — if rejected — the specific criterion and evidence gap that drove the rejection.
