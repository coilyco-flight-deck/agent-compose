  - id: frontier-replay-aosh-evidence
    model: claude-sonnet-5
    raw_response: |-
      ## Diagnosis framing

      I don't have a claim yet — I need the actual symptom before I can design an experiment. "Local-model reliability problem" is too broad: it could be a prompt defect, a context-window/truncation issue, a runtime/quantization defect, a hardware resource ceiling, or a spec ambiguity in what "reliable" means for this task. I'll state my working hypothesis space and the smallest experiment that discriminates among them, rather than assume a cause.

      ## Smallest reproducible experiment

      **Claim under test:** "The local model produces incorrect or inconsistent outputs on task X at rate Y under condition Z."

      **Variables to identify and freeze:**
      - Prompt/context template (exact bytes, versioned)
      - Model identity (exact weights/quantization/version tag)
      - Inference runtime (name, version, sampling params: temperature, top_p, seed if supported)
      - Hardware substrate (device class, memory ceiling — as reported by the record, not assumed)
      - Executor/harness invoking the model (agent-compose bundle vs. raw call)

      **Design:**
      1. Fix everything except the one variable suspected of causing the failure (start with prompt/context, since that's the layer I own and the cheapest to test).
      2. Define correctness before running anything: an explicit pass/fail rubric per case, not post-hoc judgment.
      3. Run a small fixed case set (5–10 reproducible cases) at a fixed seed/sampling config, repeated at least 3x to distinguish deterministic defects from stochastic variance.
      4. Capture raw responses verbatim, plus retry provenance (attempt number, timestamp, exact params) for every call — no summarization before the raw record exists.
      5. Classify each failure as prompt defect, context defect, model defect, runtime defect, or spec-ambiguity defect. Do not merge categories.

      I do not have hardware measurements or benchmark numbers in the supplied record, so I will not report throughput, latency, or capacity figures. If the reliability symptom turns out to require a hardware or runtime measurement I don't have, that's a bounded gap in this diagnosis, not something I'll estimate.

      ## Evidence record (AOSH artifact maintenance)

      The evidence record needs, at minimum:
      - Claim statement (verbatim, dated)
      - Frozen variable table (prompt hash/version, model tag, runtime version, harness/executor, hardware as reported)
      - Correctness rubric (defined before execution)
      - Raw response log per case per attempt, unmodified
      - Retry provenance log
      - Failure classification per case, with the specific evidence line justifying each classification
      - Aggregation only after raw data is preserved — derived summary stays clearly separated from raw evidence
      - Regeneration note: if any input changes, the derived summary is invalidated and must be regenerated, not patched

      I'll update the existing artifact in place rather than create a parallel one, preserving prior raw records so the failure-rate trend stays comparable across runs.

      ## Bounded recommendation

      Until the experiment runs, I can't recommend a fix, model swap, or runtime change — that would be inventing a result. The recommendation I can state now: **run the frozen-variable experiment above before proposing any remediation.** If the failure classification points to a prompt/context defect, I own the fix. If it points to model, runtime, or hardware, the recommendation is bounded to "this layer showed the defect under these frozen conditions" — not a general capability claim.

      ## Handoffs

      **To QA:** Once the evidence record has raw responses and failure classifications, I'll hand QA the correctness rubric, the case set, and the classified results for independent acceptance review. I authored the rubric, so I do not self-accept it — QA validates whether the classification and pass/fail calls hold up under their own review, separate from my authorship.

      **To DevOps:** If classification implicates runtime configuration, hardware ceiling, or deployment-time behavior (not something I can isolate in a frozen local experiment), I'll hand off: the exact reproduction steps, frozen variable table, raw evidence showing the symptom, and the specific unresolved question (e.g., "does this runtime version/hardware combination reproduce the failure outside this harness?"). I will not propose rollout, rollback, or live configuration changes myself — that determination and any deployment action stays with DevOps.
