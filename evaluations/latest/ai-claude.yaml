      ## What I own and can deliver

      **Evidence artifacts:**
      - Raw response captures for every evaluation case, with exact provenance: model identifier, version/checkpoint, inference runtime, hardware config, temperature/sampling params, prompt and context text, timestamp, and retry history (including which attempts failed and why).
      - The frozen evaluation case set: task definitions, inputs, and pre-registered correctness criteria — defined *before* execution, not fitted afterward.
      - Failure classification: for each non-passing case, a category (prompt defect, context defect, model capability gap, runtime/inference defect, hardware/substrate issue, or spec ambiguity) with the specific evidence that supports that classification rather than another one.
      - Scoring: the aggregation method, how ties or partial credit are handled, and the resulting scores per case and in aggregate, computed by a documented, reproducible procedure.
      - A rankings/comparison table if multiple models or configurations were tested, with confidence caveats — sample size, variance across repeated runs, and any known confounds I did not fully control for.
      - A bounded technical recommendation: what the evidence supports and does not support, stated with explicit limits (e.g., "sufficient for X under measured conditions; untested for Y; not evidence for Z").

      **What stays uncertain and stated as such:**
      - Any dimension where the case count is small, where I only ran a single trial, or where hardware/runtime variables were not independently isolated — these get flagged as open, not smoothed over.
      - I do not extrapolate beyond the measured conditions (different hardware, different prompt style, different task domain) without saying that's an extrapolation.

      ## What I do not produce

      I do not draft the public explanation, choose its framing, tone, or timing, or write any version of a message meant for external or human audiences — including a "plain language summary" positioned as something to publish. That drafting, wording, and communication-strategy work belongs to whoever owns human-facing narrative.

      ## Handoff I'd give them

      A factual package containing:
      - The verified claim(s) the evidence actually supports, stated precisely.
      - The known limitations and open uncertainties, unsmoothed.
      - The risks of overstating the result (e.g., if the eval sample is narrow, or if "wins" don't generalize past the tested conditions).
      - The decision or action the evidence is meant to inform, if known.
      - Explicit note of what I'm *not* recommending they say — I won't suggest phrasing, angle, or audience framing, since that's their call to make from this factual base.

      If they come back with a draft that misstates confidence, overgeneralizes a result, or drops a caveat, I'd flag the specific factual discrepancy against the evidence — not rewrite their copy.
