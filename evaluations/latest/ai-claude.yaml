  - id: frontier-completion-model-field
    model: claude-sonnet-5
    raw_response: |-
      Here's the sequence I'd carry through, treating each step as a gate the next one depends on — nothing here has actually been executed yet, so I'm stating what each step requires and what I'd report given real outputs.

      **1. Provenance checks (before anything derived is trusted)**

      For every completed run I verify, per response:
      - exact model identifier and version/snapshot string as reported by the provider, not the requested alias
      - runtime/inference-path identity (endpoint, API version, decoding params: temperature, top_p, max_tokens, seed if applicable)
      - source revision of the prompt/context pack (commit hash or content digest)
      - pack digest for the evaluation case bundle itself (so a case can't silently drift)
      - retry provenance: attempt count, which attempt's output was scored, and the raw content of failed attempts (not discarded)
      - timestamp and duration

      Any run missing one of these fields gets flagged as *provenance-incomplete* and excluded from aggregation rather than silently backfilled. I don't infer missing identity from context — a run without a verified model string doesn't get counted as that model.

      **2. Failure classification**

      Before scoring, I sort non-clean completions into categories: prompt defect (case itself is ambiguous or wrong), model failure (task-appropriate but incorrect output), runner/harness defect (timeout, malformed request, transport error), and spec defect (the acceptance criterion doesn't match the intended capability). Each failure keeps its raw response and retry chain attached. I do not fold a runner failure into a model capability score.

      **3. Aggregation**

      Only provenance-complete, correctly classified results feed aggregation. I recompute scores from raw stored evidence rather than trusting any intermediate cache, and I keep per-criterion evidence linked to each aggregate number so a leaderboard entry can be traced back to the specific responses that produced it.

      **4. Leaderboard regeneration**

      Regenerate leaderboard output entirely from the aggregation step's fresh output — not patched in place — so a partial or stale leaderboard can't mix with new data. I'd note in the regeneration output which model/runtime cells are new vs. carried from prior runs, and I would not present the leaderboard as final until aggregation is confirmed complete for all fields in scope.

      **5. Documentation**

      Update the evaluation record with: what was measured, the bounded claim the evidence supports, what it does not support, known provenance gaps or excluded runs, and failure classification summary. I keep the model recommendation, if any, bounded strictly to what the measured evidence covers — no extrapolation to untested prompts, runtimes, or hardware.

      **6. Repository validation**

      Run the full validation suite before treating anything as ready. I do not report this as passed preemptively — I'd state the actual pass/fail outcome once run, and if it fails, I stop and fix or report the failure rather than continuing to commit.

      **7. Commit**

      Commit only after validation genuinely passes, with a message that reflects what evidence changed (new runs, corrected classification, regenerated leaderboard) and references the source revision and pack digest used.

      **8. Resolved delivery**

      Hand off through the resolved repository workflow, delivering the complete artifact: raw responses, retry logs, provenance metadata, classified failures, aggregation output, regenerated leaderboard, and documentation — all traceable to the same source revision and pack digest. If any upstream step (provenance, classification, validation) is incomplete or failed, delivery is blocked at that step and I report exactly which step is unresolved and what's needed to close it, rather than delivering a partial result as finished.
