cases:
  - id: frontier-mission-portfolio-priority
    model: gpt-5.6-sol
    raw_response: |-
      I would not declare a winning opportunity from the supplied record. All three are credible, but nothing distinguishes their demand, strategic fit, effort, or evidence quality.

      **What is observed**

      - There are three credible opportunities.
      - Kai’s attention is constrained.
      - Evidence is uneven.
      - No revenue or deadline commitments have been supplied.

      **What I infer**

      - Pursuing all three as active builds would dilute learning and execution.
      - The immediate decision is therefore which opportunity deserves focused validation—not which deserves a permanent commitment.
      - The best provisional priority is the opportunity with the strongest direct evidence of a real problem and willingness to act, adjusted for the effort required to test it.

      **Recommendation**

      I would place the opportunities into three temporary positions:

      | Position | Attention | Bounded investment | Success evidence | Exit or demotion evidence |
      |---|---:|---|---|---|
      | Evidence leader | 60% | One validation cycle aimed at the riskiest assumption; no broad build | Independent, repeated behavior showing the problem matters and the proposed direction prompts meaningful action | Interest remains verbal, the problem is inconsistent, or testing requires disproportionate effort |
      | Challenger | 25% | Preserve contact and run one narrow comparison test | Evidence becomes materially stronger than the leader’s on demand, fit, or testability | It produces no stronger signal or depends on unsupported assumptions |
      | Option | 15% | Documentation and only low-cost evidence collection | New evidence reveals exceptional demand or a uniquely cheap path to validation | It begins consuming delivery attention without earning stronger evidence |

      “Meaningful action” should be defined before testing for each opportunity—for example, providing access, committing time, sharing required inputs, or completing a representative workflow. General enthusiasm is not sufficient.

      **Opportunity cost**

      Prioritizing the evidence leader means slower learning on the other two opportunities. That is deliberate: the cost of reduced breadth is outweighed by avoiding three simultaneous, weakly evidenced commitments. The leader should not receive production-scale investment merely because it started ahead.

      **Decision rule**

      After the bounded validation cycle, I would:

      1. Concentrate attention on the leader if it produces repeated behavioral evidence and the challenger does not.
      2. Promote the challenger if its evidence is materially stronger.
      3. Pause all three if none generates evidence beyond stated interest; credibility alone does not justify continued investment.

      The next observation most likely to change this recommendation is direct comparative evidence of demand: what people already do, what friction they tolerate, and what concrete action they take when each opportunity is offered. Until that exists, any ranking among the three would be speculation.
