  - id: frontier-completion-maintainable-plan
    model: gpt-5.6-sol
    raw_response: |-
      I will treat the accepted priority as the sole portfolio experiment for the next two weeks.

      - Investment: only the minimum work needed to test the priority’s decisive assumption.
      - Success evidence: direct, reviewable evidence that the intended audience encountered the experiment and took the target action or made a credible commitment. Activity, output volume, and positive comments alone will not count.
      - Opportunity-cost guardrail: existing obligations continue, but competing portfolio hypotheses receive no new build, campaign, or expansion work during the experiment. Urgent maintenance is allowed; unrelated exploration is deferred.
      - Evidence record: capture what was offered, to whom, observable responses, non-responses, and reasons for rejection where available.
      - Revisit: at the end of the two-week bound, I will compare the evidence with the strongest competing explanation—for example, that response came from personal goodwill, novelty, or an unusually warm audience rather than genuine demand.
      - Continue condition: the evidence supports another bounded investment in this priority.
      - Exit condition: no credible target action or commitment appears, or the result depends on effort and exceptions that make the path unsustainable. I will then stop further investment and return the attention allocation to portfolio review rather than quietly extending the test.

      The exact target action and audience remain unspecified in the supplied record. They must be made explicit before execution; otherwise success could be redefined after the fact. The next observation most likely to change my recommendation is credible behavior from the intended audience, especially a concrete commitment rather than stated interest.

      Director may coordinate one bounded outcome next: deliver and document the smallest test of the accepted priority within the two-week window, producing a reviewable evidence packet against the predeclared audience, target action, guardrails, and exit condition. This authorizes coordination of the experiment, not expansion into adjacent products, channels, or portfolio bets.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response turns the accepted experiment into a focused, maintainable portfolio investment with explicit opportunity-cost controls.
      - criterion: operating-method
