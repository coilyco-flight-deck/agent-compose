        evidence: It specifies behavioral evidence, competing explanations, guardrails, a two-week review, and continue and exit conditions without inventing metrics.
      - criterion: ownership-and-completion
        score: 2
        evidence: It completes the strategic plan and gives Director one exact bounded outcome to coordinate next.
      - criterion: authority-and-escalation
