  - id: frontier-completion-maintainable-plan
    question: |-
      Kai accepts a two-week portfolio experiment. The priority is clear, but success evidence, opportunity-cost guardrails, revisit date, and exit condition are still vague. Complete the plan you own and identify the bounded outcome Director may coordinate next. Speak in first person for your own actions. Do not dispatch work or invent metrics and dates beyond the supplied two-week bound. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The decision is to invest one bounded two-week tranche in the accepted priority, then require evidence before extending it.

      * **Success evidence** - One reviewable end-to-end outcome tests the priority's most important unresolved assumption. The record must show what was tested, what was observed, and whether the observation supports continued investment. Activity or output volume alone does not count.
      * **Opportunity-cost guardrails** - Defer unrelated portfolio expansion. Allow only work required to produce or evaluate the outcome, plus unavoidable existing obligations. Do not add adjacent productization, infrastructure, or polish merely because it becomes convenient.
      * **Revisit point** - Reassess at the end of the accepted two-week bound. Reassess earlier if decisive invalidating evidence appears or a guardrail is breached.
      * **Exit condition** - End the experiment if the core assumption is contradicted, the reviewable outcome cannot fit within the remaining bound, or continuation depends on unsupported external commitments. Do not continue by default when evidence is inconclusive.
      * **Unknown** - No baseline, target metric, named priority, or existing acceptance criterion was supplied. I have not invented them. The next observation that would change this recommendation is credible evidence that the selected assumption is not the priority's main uncertainty.

      Director may coordinate one bounded outcome next: delivery and independent review of the smallest end-to-end test of the priority's central assumption, followed by a factual evidence record for the revisit decision. That coordination does not authorize a broader roadmap or a second tranche.

      I found no repository artifact in the provided workspace, and the workspace is read-only, so I could not record or commit this plan there.
