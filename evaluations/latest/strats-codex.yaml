  - id: frontier-completion-maintainable-plan
    model: gpt-5.6-sol
    raw_response: |-
      I complete the portfolio plan as follows:

      * **Decision** - Invest the two-week experiment in the accepted priority. Treat broader commitment as unproven until evidence returns.
      * **Success evidence** - Require a usable experiment outcome, direct evidence of the intended behavior or benefit, and a record of what was learned. Activity, completion, and positive impressions alone do not establish success.
      * **Opportunity-cost guardrail** - Pause discretionary work that competes for the same attention. Preserve existing obligations and essential maintenance. Do not expand the experiment into adjacent features, channels, or commitments during the two weeks.
      * **Revisit point** - Review at the end of the two-week bound using the evidence above. Do not prolong the experiment merely to avoid an inconclusive result.
      * **Exit condition** - Stop or deprioritize the priority if the usable outcome is not produced, the intended benefit is not observed, or the experiment requires breaking the opportunity-cost guardrail. Continue only if the evidence supports a specifically bounded next investment.
      * **Unknowns** - The intended behavior, baseline, evidence source, and acceptable tradeoff have not been supplied. I will not manufacture thresholds for them.
      * **Recommendation-changing observation** - Credible evidence that another portfolio obligation is being harmed, or that the experiment cannot expose the intended benefit within two weeks, would justify ending it early.

      Director may coordinate one bounded outcome next: complete the accepted experiment within two weeks while preserving the guardrail, then return the usable outcome, observed evidence, costs displaced, and unresolved uncertainties for the portfolio revisit.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response turns the accepted priority into a bounded portfolio experiment designed to protect existing obligations and inform the next investment decision.
      - criterion: operating-method
        score: 2
        evidence: It defines success evidence, opportunity-cost guardrails, a two-week revisit point, exit conditions, unknowns, and recommendation-changing observations.
      - criterion: ownership-and-completion
        score: 2
        evidence: It completes the strategic plan it owns and gives Director one exact bounded outcome with a defined evidence return package.
      - criterion: authority-and-escalation
        score: 2
        evidence: It avoids dispatching work or inventing thresholds and limits Director's possible coordination to the already accepted two-week experiment.
    total: 8
    passed: true
  - id: frontier-replay-real-portfolio
    model: gpt-5.6-sol
    raw_response: |-
      I recommend investing next in **Agent Compose v2**, specifically the first unresolved dependency in its approved sequence.

      * **Why it ranks first** - It is the only area with an approved outcome and ordered dependencies. That provides a credible path from effort to measurable progress.
      * **Bounded investment** - Complete one dependency through its stated acceptance check, then reassess before funding the next.
      * **Opportunity cost** - AOS convergence, infrastructure convergence, public Eco work, and discretionary platform improvements remain deferred. Platform maintenance should continue only at the minimum needed to preserve current operation because no incident or degradation evidence is supplied.
      * **Success evidence** - The dependency satisfies its acceptance criteria and demonstrably unblocks the next dependency or advances the approved parent outcome.
      * **Exit condition** - Pause if the dependency fails acceptance, no longer unlocks the sequence, or reveals that the parent outcome is not feasible at reasonable cost.

      The current ranking is:

      1. Agent Compose v2
      2. Minimum necessary platform maintenance
      3. AOS and infrastructure convergence
      4. Public Eco work

      Positions 3 and 4 are effectively unranked against each other because the supplied evidence does not establish readiness, value, or a validated next outcome.

      I would change the ranking if any area produces stronger evidence, such as:

      * **Platform maintenance moves first** if verified reliability, security, or operational evidence shows present harm or a material risk to existing capabilities.
      * **AOS and infrastructure convergence moves first** if it gains an accepted outcome, a bounded implementation path, and evidence that it removes a demonstrated constraint affecting multiple portfolio areas.
      * **Public Eco work moves first** if it gains an accepted outcome plus concrete evidence of demand, adoption, contribution, or another defined public benefit.
      * **Agent Compose v2 moves down** if its next dependency is blocked, fails acceptance, loses approval, or proves unable to advance the parent outcome.
      * **Any area can move up** if it shows substantially greater value per bounded unit of attention than the next Agent Compose dependency.

      What remains unknown is the size, cost, readiness, and expected benefit of every candidate. The next observation I would seek is the acceptance result and actual effort for Agent Compose v2’s first unresolved dependency. That result would test whether the approved sequence is translating into progress rather than merely documenting intent.
