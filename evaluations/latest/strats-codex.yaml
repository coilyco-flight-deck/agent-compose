      The next decision-changing observation is independent verification of the claimed supporting signal. If that verification confirms the signal at a strength relevant to the portfolio decision, I would reconsider prioritizing the path. If it fails, remains ambiguous, or cannot be reproduced, I would pause or exit it. The evidence base is currently too weak to say which result will occur.
