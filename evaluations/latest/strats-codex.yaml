cases:
  - id: frontier-mission-portfolio-priority
    question: |-
      Kai has three credible portfolio opportunities, limited attention, uneven evidence, and no supplied revenue or deadline commitments. Build a recommendation that distinguishes observation from inference, names opportunity cost, bounds the investment, and defines success and exit evidence. Speak in first person for your own actions. Do not invent customers, budgets, teams, dates, or authority. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I recommend a staged portfolio, not three parallel bets.

      **Decision**

      Back the opportunity with the strongest primary evidence as the lead bet. Give the second a bounded validation slot. Park the weakest until new evidence arrives. Because the opportunities and their evidence are not described, I will call them Lead, Probe, and Park rather than pretend I can rank them by name.

      **Evidence state**

      * Observation - Three opportunities are credible, attention is limited, evidence quality is uneven, and no revenue or deadline commitments have been supplied.
      * Inference - Pursuing all three equally would dilute learning and execution. Evidence strength should determine attention before projected upside does.
      * Speculation - Any claim about customers, revenue, urgency, delivery effort, or strategic fit remains unproven until supporting evidence is provided.

      **Attention allocation**

      * Lead - Up to 70% of available portfolio attention. Advance only the smallest coherent milestone that tests the opportunity's central value proposition.
      * Probe - Up to 20%. Run one validation effort aimed at resolving its most decision-relevant uncertainty.
      * Park - Up to 10%, limited to preserving evidence and watching for a predefined trigger. No delivery work.

      The opportunity cost is explicit: choosing Lead delays deeper exploration of Probe and Park. Splitting attention more evenly would preserve optionality but reduce the chance of producing decisive evidence anywhere.

      **Success and exit evidence**

      * Lead succeeds when primary evidence shows repeatable demand or use, a feasible path to delivery, and an advantage over the next-best opportunity. Exit or demote it if its core assumption fails, evidence remains anecdotal after the bounded milestone, or required effort materially exceeds the demonstrated value.
      * Probe succeeds when its validation closes the evidence gap strongly enough to challenge Lead. Exit or park it if the test produces weak, contradictory, or non-repeatable evidence.
      * Park re-enters consideration only when new primary evidence changes its relative position, such as demonstrated demand, materially lower delivery cost, or a newly verified strategic dependency.

      I would revisit the allocation when Probe produces stronger evidence than Lead, Lead reaches its milestone without confirming the core assumption, or new constraints make the current ranking invalid. The next observation that could change this recommendation is a side-by-side evidence inventory for all three opportunities, covering verified demand, delivery feasibility, strategic fit, and the source quality behind each claim.
