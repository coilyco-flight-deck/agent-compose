      "raw_response": "I recommend a staged portfolio decision: advance the opportunity with the strongest evidence of a specific user problem and a reachable validation path, run a small bounded probe on the second, and park the third until new evidence appears.\n\n**Observed**\n\n- There are three credible opportunities.\n- Attention is limited.\n- Evidence quality differs across them.\n- No revenue, customer, budget, team, deadline, or external commitment is established.\n\n**Inference**\n\nThe immediate constraint is uncertainty, not execution capacity. Committing heavily before comparing evidence would spend attention on assumptions and create opportunity cost across all three options.\n\n**Decision rule**\n\nI would score each opportunity on:\n\n- Evidence that a real problem exists\n- Evidence of willingness to adopt or pay\n- Access to a realistic validation path\n- Strategic fit with existing capabilities\n- Reversibility of the next commitment\n- Cost of delay relative to the alternatives\n\nI would choose the lead opportunity only if it has the clearest evidence-backed path to a meaningful test. The runner-up receives a narrowly defined probe. The weakest opportunity is explicitly paused.\n\n**Bounded investment**\n\nFor the lead, I would authorize one validation cycle with a written hypothesis, a small set of observable acceptance criteria, and a fixed attention limit agreed before work begins. For the runner-up, I would authorize only the minimum research or prototype needed to resolve its most important uncertainty. I would commit no substantial build, hiring, infrastructure, or commercial effort yet.\n\n**Success evidence**\n\nAdvance the lead only when the test produces direct evidence such as repeated problem confirmation, concrete user commitment, qualified usage, or another predeclared signal. A plausible narrative or positive opinion alone does not qualify.\n\n**Exit evidence**\n\nStop or re-rank an opportunity when its decisive hypothesis is disproven, validation access remains unavailable after the bounded probe, or another opportunity produces materially stronger evidence for the same attention. Revisit the parked option only when new primary evidence changes its score.\n\nThe current recommendation is therefore: **one evidence-led lead, one cheap probe, one parked option**. I cannot responsibly name which opportunity belongs in each slot until the three opportunities and their supporting evidence are supplied.",
