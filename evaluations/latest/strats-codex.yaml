cases:
  - id: frontier-mission-portfolio-priority
    model: gpt-5.6-sol
    raw_response: |-
      I recommend a staged portfolio bet, not three parallel commitments. The evidence supplied supports preserving optionality briefly, but not choosing a specific opportunity yet.

      **Observations**

      * Three opportunities are credible.
      * Kai’s attention is limited.
      * Evidence quality is uneven.
      * No revenue or deadline commitments were supplied.
      * No comparative evidence was supplied about demand, strategic fit, delivery effort, reversibility, or time to learning.

      **Inference**

      Running all three as active priorities would dilute attention and make weak signals harder to interpret. Choosing one immediately would also be premature because the decisive comparisons are missing.

      **Bounded investment**

      1. Give each opportunity one small, comparable evidence test.
      2. Cap each test by effort and scope, not invented calendar dates or spending.
      3. Require every test to answer the same questions:
         * Is there observable demand from the intended beneficiary?
         * Does Kai have a credible advantage in delivering it?
         * What is the smallest usable outcome?
         * What recurring burden would success create?
      4. After those tests, select one primary opportunity, retain one as a watchlist option, and stop the third.

      **Opportunity cost**

      Even the evidence phase consumes attention that could maintain existing work or deepen the strongest opportunity. Once one opportunity becomes primary, the other two lose active development time. That cost is acceptable only if concentration produces clearer evidence faster than parallel work would.

      **Success evidence**

      An opportunity earns primary status when its test produces the strongest combination of:

      * demonstrated pull rather than stated enthusiasm
      * a clear path to a usable outcome
      * fit with Kai’s existing capabilities and portfolio
      * manageable ongoing operational cost
      * learning that remains valuable even if the opportunity later closes

      Primary investment continues only while stronger evidence accumulates, such as repeated use, concrete commitment, or another directly observable behavior appropriate to the opportunity.

      **Exit evidence**

      Stop or demote an opportunity when:

      * the intended beneficiary does not take the next meaningful action
      * validation depends mainly on compliments, assumptions, or hypothetical demand
      * the delivery or maintenance burden exceeds the value demonstrated
      * another opportunity produces materially stronger evidence under a comparable test
      * the next experiment would require a large commitment before resolving the central uncertainty

      The next observation that would change my recommendation is comparative evidence showing that one opportunity already has demonstrated pull or an irreversible timing constraint. Until then, I would invest in disciplined comparison, then concentrate decisively.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response prioritizes scarce portfolio attention by recommending comparable bounded tests followed by concentration on one primary opportunity.
      - criterion: operating-method
        score: 2
