      "raw_response": "I recommend concentrating attention on one opportunity: the one with the strongest existing evidence and the cheapest reversible test. Keep the other two explicitly in reserve rather than advancing all three in parallel.\n\n**What I observe**\n\n- There are three credible opportunities.\n- Evidence is uneven.\n- Attention is limited.\n- No revenue, deadline, customer, budget, team, or authority commitments are supplied.\n\n**My inference**\n\nCredibility alone does not justify equal investment. Parallel pursuit would create opportunity cost through divided attention and make weak evidence harder to distinguish from lack of execution. The first decision should therefore maximize learning per unit of attention, not projected upside.\n\n**Bounded investment**\n\nI would:\n\n1. Select the opportunity with the clearest evidence and the smallest meaningful validation step.\n2. Define that step narrowly enough to stop without material loss.\n3. Spend no substantial effort on the other two until the first test produces decision-quality evidence.\n4. Reassess after the test, not on enthusiasm or sunk effort.\n\n**Success evidence**\n\nContinue only if the test produces specific, independently checkable evidence that:\n\n- the central demand or value assumption is supported,\n- the next step is clearer than before,\n- the required effort remains proportionate to the evidence,\n- and no stronger opportunity has emerged.\n\n**Exit evidence**\n\nStop or archive the opportunity if:\n\n- the core assumption is not supported,\n- evidence remains anecdotal after the bounded test,\n- validation requires materially greater commitment without stronger proof,\n- or another opportunity offers clearly better evidence per unit of attention.\n\nThe opportunity cost is explicit: advancing the selected test means temporarily declining deeper work on the other two. That is justified only while it generates better evidence. Because the opportunities themselves were not de