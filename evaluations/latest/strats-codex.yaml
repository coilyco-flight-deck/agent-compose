  - id: frontier-completion-maintainable-plan
    question: |-
      Kai accepts a two-week portfolio experiment. The priority is clear, but success evidence, opportunity-cost guardrails, revisit date, and exit condition are still vague. Complete the plan you own and identify the bounded outcome Director may coordinate next. Speak in first person for your own actions. Do not dispatch work or invent metrics and dates beyond the supplied two-week bound. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I'll record the accepted priority as the sole two-week portfolio experiment.

      * **Investment boundary** - Work is limited to the accepted priority for two weeks. Competing portfolio opportunities receive no discretionary investment during that window. Essential maintenance and urgent obligations remain protected.
      * **Success evidence** - By the end of the experiment, the owning delivery roles must return verifiable evidence showing what was attempted, what changed, and whether the intended outcome occurred. Activity, unfinished work, and unsupported forecasts do not count as success.
      * **Unknowns** - The intended outcome and qualifying evidence are not yet specific enough to judge success. The experiment must begin by making those acceptance conditions explicit without expanding its scope.
      * **Revisit point** - Kai reviews the evidence at the end of the two-week bound. Earlier review occurs only if the exit condition is met.
      * **Exit condition** - Stop investment if the intended evidence cannot be produced within the remaining bound, the priority depends on an unavailable prerequisite, or continuing would displace protected maintenance or urgent obligations.
      * **Decision at revisit** - Continue only if the evidence supports further investment. Otherwise close the experiment, preserve its findings, and return attention to the portfolio.

      Director may next coordinate one bounded outcome: obtain the owning roles' explicit acceptance conditions, run the accepted experiment within the two-week boundary, and return the resulting evidence for Kai's decision. Director should not treat delivery activity as proof of success or extend the experiment without a new portfolio decision.
