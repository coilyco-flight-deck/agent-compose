      What would change this ranking: if any of AOS/infrastructure convergence, Eco, or platform maintenance produced its own approved parent outcome with ordered dependencies (or equivalent acceptance evidence), that area would become directly comparable and I'd need to weigh it against Agent Compose v2's current position in its dependency chain rather than defaulting to it. Conversely, if Agent Compose v2's dependencies turn out to be blocked or waiting on another role's delivery, that's the signal to pause it and re-rank against whatever else has evidence at that point.

