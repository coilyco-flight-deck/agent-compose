  - id: frontier-mission-portfolio-priority
    question: |-
      Kai has three credible portfolio opportunities, limited attention, uneven evidence, and no supplied revenue or deadline commitments. Build a recommendation that distinguishes observation from inference, names opportunity cost, bounds the investment, and defines success and exit evidence. Speak in first person for your own actions. Do not invent customers, budgets, teams, dates, or authority. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      ## Decision

      Kai should concentrate on one opportunity, run a bounded test of a second, and park the third. The supplied evidence is insufficient to responsibly choose them by name, so I would assign these positions using evidence strength:

      * **Primary** - the opportunity with the strongest direct evidence of present demand or committed adoption.
      * **Probe** - the opportunity with meaningful upside but one decisive unresolved assumption.
      * **Parked** - the remaining credible opportunity, preserved without active development.

      ## Evidence assessment

      * **Observation** - three opportunities are considered credible.
      * **Observation** - their evidence is uneven.
      * **Observation** - attention is limited.
      * **Observation** - no revenue or deadline commitments were supplied.
      * **Inference** - pursuing all three concurrently would fragment attention and make results harder to interpret.
      * **Inference** - credibility alone does not establish portfolio priority. Direct behavioral evidence should outrank enthusiasm, strategic fit, or theoretical market size.
      * **Speculation** - any of the three could ultimately be best. The current information does not establish which one.

      ## Bounded portfolio investment

      * **Primary - one validation cycle.** Produce the smallest complete test of its central value proposition. Define the target behavior and minimum acceptable result before starting. Do not expand scope during the cycle.
      * **Probe - one discriminating experiment.** Test only the assumption most likely to overturn its ranking. Avoid general product development.
      * **Parked - maintenance only.** Record current evidence, the unanswered decisive question, and any unsolicited new signal. Perform no active implementation.

      The principal opportunity cost is that advancing the primary delays learning on the other two. That is intentional. The cost of keeping all three active is repeated context switching, slower evidence production, and three partially developed possibilities instead of one defensible decision.

      ## Success and exit evidence

      * **Primary succeeds** when the test produces repeatable observed behavior supporting demand, demonstrates feasible delivery, and reveals no prohibitive ongoing burden.
      * **Primary exits or loses priority** when the predefined minimum result is missed, delivery proves impractical, or the probe produces materially stronger direct evidence.
      * **Probe advances** when its decisive assumption is supported by observed behavior strong enough to challenge the primary.
      * **Probe exits** when that assumption fails or cannot be tested without an investment comparable to making it primary.
      * **Parked advances** only when new independent evidence changes its ranking. Internal enthusiasm alone is insufficient.

      ## Strongest competing explanations

      * The apparently strongest opportunity may only have more documentation, not more demand. Compare evidence types, not evidence volume.
      * The high-upside opportunity may look weak because it has received less attention. The probe should test its decisive assumption cheaply.
      * The parked opportunity may be strategically enabling rather than independently valuable. Advance it only if another priority demonstrably depends on it.

      I would revisit the recommendation when one opportunity gains direct commitment, repeated use, measurable adoption, or credible delivery evidence that changes the ranking. The most important missing observation is the actual evidence attached to each opportunity. Until that is available, naming a winner would be false precision.
