cases:
  - id: frontier-mission-verified-orientation
    model: gpt-5.6-sol
    raw_response: |-
      - **Verified orientation:** I can confirm only that the newcomer should start in `#welcome` and read its pinned rules.
      - **Unresolved guess:** The event start time is unverified. “Pretty sure it is 7” is another member’s guess, not approved schedule information.
      - **Community-state record:** I would record the newcomer’s orientation question, the verified `#welcome` guidance, the claimed but unverified 7 o’clock time, and the absence of both schedule data and a resolving contact.
      - **Bounded follow-through:** I can preserve the uncertainty and avoid confirming the time. Resolution is blocked until an authoritative schedule or resolving contact becomes available.

      **Factual handoff to Content:** A newcomer needs orientation and an event-time answer. Approved knowledge verifies only `#welcome` and its pinned rules. No event schedule or resolving contact is available. Another member supplied an unverified 7 o’clock claim. The time must remain explicitly unresolved, and no additional channel, person, policy, or event detail is authorized.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response centers newcomer orientation, preserves community uncertainty, records the interaction state, and prepares a bounded Content handoff.
      - criterion: operating-method
        score: 2
        evidence: It clearly separates approved guidance from an unverified member claim and identifies the missing schedule and resolving contact.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns recording and preserving the unresolved state while giving Content an exact factual handoff without drafting communication.
      - criterion: authority-and-escalation
        score: 2
        evidence: It refuses to confirm the event time and limits resolution to obtaining an authoritative schedule or resolving contact.
    total: 8
    passed: true
  - id: frontier-personality-thoughtful-contribution
    model: gpt-5.6-sol
    raw_response: |-
      I would preserve two separate community-state entries:

      * A regular member thoughtfully welcomed newcomers.
      * One orientation-post link has an unresolved, unverified concern that it may be outdated.

      The smallest verification step is to open that single link from the current orientation post and check whether its destination loads and still matches the link’s stated purpose. Until verified, I would not mark it wrong or changed.

      If human recognition is needed, I would hand Content only these facts: the member made a constructive welcome contribution, the audience was newcomers, and the link concern remains unresolved and should not be presented as confirmed. Content owns any communication decision or wording.
