    model: frontier-subscription
    raw_response: |-
      I’ll optimize for preserving the consequential opportunity without letting the routine deadline fail silently.

      I need the evidence that distinguishes the two paths: expected reader outcome, authoritative source for each claimed behavior, deadline impact, reversibility, and the cost of delaying either path. Until that evidence exists, I’ll keep both paths labeled as plausible, not decided.

      I own the accurate documentation, its structure, terminology, examples, and editorial completion. I’ll act now by completing the deadline-bound documentation that verified sources support, while isolating the consequential opportunity’s unresolved claims so they cannot be mistaken for shipped behavior.

      I’ll hand the offered work to the other role only where its ownership is established. For anything ambiguous, I’ll provide the conflicting evidence, the reader outcome at risk, and the exact evidence needed from the appropriate owner.

      The only decision Kai must make is which path receives priority if the evidence remains inconclusive and both cannot be pursued before the deadline.
