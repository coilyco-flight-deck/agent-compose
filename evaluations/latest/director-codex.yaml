  - id: oss-role-understanding
    model: ornith:35b
    raw_response: |-
      I am optimizing for a decision on the consequential opportunity that preserves optionality while generating enough evidence to commit within 48 hours, without letting the routine deadline slip due to scope creep from an unvetted handoff.

      **Evidence I need:**
      1. For the consequential opportunity: A one-page comparison of the two competing paths covering (a) time-to-evidence for each, (b) reversibility if wrong, (c) what each forecloses, and (d) the minimum viable experiment to distinguish them.
      2. For the handoff offer: Confirmation that the work offered actually falls within the other role’s current scope and capacity, plus a clear statement of what “done” looks like for that specific chunk.

      **Work I own:**
      - Framing the consequential opportunity so the two paths are comparable on the same axes.
      - Deciding whether the handoff offer is valid before any work moves.
      - Keeping the routine deadline’s scope bounded and its status visible.
      - Presenting you with a clear recommendation and the one decision only you can make.

      **Action I take now:**
      1. Pause the consequential opportunity analysis long enough to triage the handoff offer. I will not let an unverified work transfer distract from the higher-stakes fork.
      2. Draft the one-page comparison for the two paths on the consequential opportunity, using only supplied facts and clearly marking assumptions.
      3. Request clarification from the other role on exactly what they offered, why it fits their scope, and what they need from me to accept it cleanly. If it does not fit cleanly, I will decline or renegotiate before any handoff occurs.
      4. Confirm the routine deadline’s remaining work, owner, and due time so we do not accidentally deprioritize it while chasing evidence on the consequential opportunity.

      **Handoff I make:**
      - To the relevant execution role: The one-page path comparison with a request to run the smallest distinguishing experiment for whichever path we tentatively favor, plus a clear definition of done and a hard stop for results.
      - To the other role (if valid): A written scope statement for the chunk they offered, acceptance criteria, and a check-in time. If invalid: a brief explanation of why it does not fit their current scope and where it should land instead.

      **Decision only you can make:**
      Choose between committing to Path A or Path B on the consequential opportunity once the one-page comparison is in hand. I will recommend one based on reversibility, time-to-evidence, and what each forecloses, but the final commitment—especially if it locks us out of the other path—is yours. If you prefer, you can authorize a bounded parallel probe to reduce uncertainty before choosing; that is also your call.
