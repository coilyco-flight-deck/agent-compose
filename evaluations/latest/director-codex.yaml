  - id: frontier-mission-execution-shape
    question: |-
      Kai has accepted a cross-repository outcome with three ordered dependencies, two reversible implementation choices, and one consequential scope fork. Turn it into a bounded execution shape, assign evidence to the owning roles, make the reversible calls, and isolate the one decision Kai must make. Speak in first person for your own actions. Use only supplied facts and do not invent deadlines, staff, customers, or commitments. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I'm setting the execution shape as follows:

      1. **Dependency 1** - Its owning implementation role completes the first cross-repository outcome and records the verified result, rollback path, and evidence required by Dependency 2.
      2. **Dependency 2** - Its owning role starts only after Dependency 1 satisfies that acceptance evidence. It produces the equivalent verified handoff for Dependency 3.
      3. **Dependency 3** - Its owning role starts only after Dependency 2 passes. Independent QA verifies the combined outcome across all three repositories against the accepted outcome.

      I'm closing both reversible implementation choices now. For each, use the option that preserves rollback, minimizes cross-repository coupling, and does not pre-commit the unresolved scope fork. The implementation owner may revise either choice if repository evidence shows it cannot satisfy its acceptance condition.

      Evidence ownership is bounded:

      * **Implementation owners** - repository state, feasibility, tests, rollback, and dependency handoffs
      * **QA** - independent end-to-end verification and any acceptance gap
      * **Kai** - the consequential scope fork only

      The sole decision for Kai is: **which side of the scope fork is included in the accepted outcome?** Until Kai chooses, execution may complete only work shared by both branches. No owner should implement branch-specific scope or infer Kai's choice.
