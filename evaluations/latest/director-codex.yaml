  - id: frontier-replay-v2-program
    model: gpt-5.6-sol
    raw_response: |-
      I would run this as a five-gate program. Validated branches remain candidates, not completed dependencies. Work may be prepared ahead of time, but no downstream branch lands until its preceding gate has objective evidence.

      1. **AOS ownership move**

         * **Outcome** - Agent Compose v2 ownership, configuration, and documentation live at the lowest AOS layer that fully determines them. Infrastructure consumes that contract and does not own or duplicate it.
         * **Engineer action** - Complete the AOS branch, remove obsolete ownership paths, update the public contract and feature documentation where the boundary materially changes.
         * **QA action** - Verify the ownership boundary, configuration source, compatibility behavior, and absence of downward fetching or duplicated runtime configuration.
         * **Unlock evidence** - A named commit landed on canonical AOS main, required local validation passed, the ownership contract is documented, and the canonical remote shows the landed commit.
         * **Blocked until then** - Infrastructure consumer migration may be developed for review, but it cannot land.

      2. **Infrastructure consumer migration**

         * **Outcome** - Every infrastructure consumer uses the landed AOS v2 contract. Legacy inputs and compatibility paths are removed only where the landed contract makes them unnecessary.
         * **Engineer action** - Inventory consumers, migrate each one, and derive configuration from the AOS-owned surface rather than reproducing it.
         * **Ops action** - Confirm deployment identity, environment-specific inputs, and rollout precedent. Any required live verification remains an ops action.
         * **QA action** - Validate the complete consumer inventory and prove that no active consumer still depends on the retired interface.
         * **Unlock evidence** - The exact AOS commit or released artifact consumed is recorded, all known consumers are accounted for, migration validation passes, and the infrastructure commit is landed on its canonical main.
         * **Blocked until then** - Core Roster reduction cannot land because removing entries before every consumer migrates could strand a consumer.

      3. **Core Roster reduction**

         * **Outcome** - Core Roster contains only the v2-supported minimum. Removed entries have either a migrated successor or explicit evidence that they are unused.
         * **Director decision** - Approve the keep, migrate, and remove classification. The criterion is operational need under the landed v2 ownership model, not historical presence.
         * **Engineer action** - Apply the approved reduction and update generated or derived surfaces through their owning workflow.
         * **QA action** - Check roster resolution, supported harness selection, defaults, and failure behavior for removed entries.
         * **Unlock evidence** - A reviewed roster inventory maps every previous entry to keep, migrate, or remove, infrastructure no longer references removed entries, validation passes, and the reduction commit is landed.
         * **Blocked until then** - Fresh evaluations cannot be treated as release evidence. Evaluations against the larger roster would certify the wrong product boundary.

      4. **Fresh evaluations**

         * **Outcome** - New evaluation results measure the fully landed ownership move, migrated consumers, and reduced roster. Earlier results remain historical evidence only.
         * **QA action** - Run the approved evaluation suite from clean inputs against exact landed revisions. Record model, harness, configuration, fixture revision, and result artifacts.
         * **Engineer action** - Address product defects found by evaluation through normal code changes. A changed product revision invalidates affected results and requires a fresh run.
         * **Director decision** - Classify failures as release-blocking defects, accepted limitations with an owner and revisit trigger, or invalid evaluations that must be rerun.
         * **Unlock evidence** - Results are reproducible, tied to exact canonical commits, cover the supported reduced roster, meet predetermined acceptance thresholds, and contain no unresolved release-blocking failures.
         * **Blocked until then** - Release gates cannot pass on branch validation, stale evaluations, or results from a different roster.

      5. **Release gates**

         * **Outcome** - Release proceeds only from the exact revisions certified by the fresh evaluations.
         * **Engineer evidence** - Repository validation is green for the release revisions, required documentation is current, and no uncommitted or branch-only change is part of the claimed release.
         * **QA evidence** - A signed-off evaluation summary identifies coverage, thresholds, failures, accepted limitations, and exact revisions.
         * **Ops evidence** - Required release workflows pass, artifacts exist with expected provenance, and rollout or deployment verification is observed through approved operational surfaces.
         * **Director decision** - Go only when all prior evidence refers to the same revision set. Otherwise hold and name the earliest failed gate.
         * **Completion evidence** - Canonical release records, successful required gates, artifact provenance, and any required rollout evidence. Until those exist, state remains “release candidate,” not “released” or “deployed.”

      For every existing validated branch, I would maintain one compact decision record:

      * **Purpose** - Which gate it serves.
      * **Base** - Which canonical commit it was built from.
      * **Validation** - What passed and where the evidence lives.
      * **Landing dependency** - The exact prior gate evidence it needs.
      * **Drift check** - Whether upstream changes require rebase and revalidation.
      * **Disposition** - Land, supersede, or hold. “Validated” alone never means “land.”

      The governing rule is simple: if evidence at gate three fails, the program returns to gate three, not gate one, unless the failure disproves an earlier ownership or migration assumption. Any code change after fresh evaluations reruns the affected evaluation scope before release approval.
