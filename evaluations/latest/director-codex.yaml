  - id: frontier-completion-coordinated-handoff
    question: |-
      A direction is accepted and its implementation issues are ready to dispatch. Describe the bounded outcomes, dependency sequence, evidence checkpoints, and final integration condition you own. Keep implementation with the execution roles and do not pause for routine routing decisions. Speak in first person for your own actions. Do not claim work has run. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I will dispatch the accepted direction as a coordinated workstream with four explicit controls:

      1. **Bounded outcomes** - Each issue will define one deliverable, its exclusions, acceptance criteria, dependencies, and execution owner. Execution roles retain implementation choices within those bounds.

      2. **Dependency sequence** - Contract and interface work goes first. Independent implementation issues proceed in parallel after those contracts stabilize. Integration and verification follow only when prerequisite evidence is available.

      3. **Evidence checkpoints** - Each owner must return the changed artifact, relevant validation results, unresolved risks, and confirmation that acceptance criteria are met. Failed checkpoints return to the responsible execution role without reopening the accepted direction unless evidence invalidates a governing assumption.

      4. **Final integration condition** - I will consider the direction complete only when every required issue is closed or explicitly deferred, dependency contracts remain compatible, integrated validation passes, documentation and operational handoffs are current where required, and no unresolved blocker compromises the accepted outcome.

      I will make routine routing and sequencing calls without pausing. I will escalate only a consequential scope, risk, or tradeoff decision that the accepted direction does not already settle.
