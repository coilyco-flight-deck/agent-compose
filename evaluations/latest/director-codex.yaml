  - id: frontier-replay-v2-program
    model: gpt-5.6-sol
    raw_response: |-
      I will run the remaining program as one ordered dependency chain:

      **AOS ownership move → infrastructure consumer migration → Core Roster reduction → fresh evaluations → release gates**

      A validated branch is evidence that a change may be ready to land; it is not evidence that it has merged, passed integration CI, shipped, or deployed. Until those states are confirmed, I will describe them separately.

      | Stage | Accountable role | Bounded outcome | Evidence that unlocks the next stage |
      |---|---|---|---|
      | 1. AOS ownership move | Incoming AOS owner, with the current owner approving the handoff | AOS has one explicit owner, documented scope, interfaces, operational responsibilities, and escalation path | Accepted ownership record; reviewed interface/consumer inventory; named migration owner for every known infrastructure consumer; unresolved ownership gaps recorded |
      | 2. Infrastructure consumer migration | Owner of each consumer; AOS owner coordinates compatibility | Every in-scope consumer uses the new AOS ownership/interface boundary, or has an explicit blocking exception | Per-consumer migration proof against the intended integrated revision; relevant tests or checks; compatibility confirmation from the consumer owner; no unexplained use of the legacy path; exceptions include owner, consequence, and revisit condition |
      | 3. Core Roster reduction | Core Roster maintainer | Remove only entries made unnecessary by completed consumer migrations; retain anything still needed by an unresolved consumer | Repository evidence that removed entries have no remaining in-scope consumers; focused regression checks; reviewed diff; rollback path; documented reason for every retained compatibility entry |
      | 4. Fresh evaluations | Evaluation owner | Re-run the agreed evaluation suite on the exact integrated candidate containing stages 1–3 | Candidate revision identified; evaluation inputs and configuration recorded; complete fresh results; comparison with the accepted baseline; regressions classified and dispositioned rather than silently averaged away |
      | 5. Release gates | Release owner, with domain owners signing their gates | Decide whether this exact candidate is releasable | Confirmed landing state of required changes; required CI results; evaluation acceptance; migration and compatibility sign-offs; release/rollback plan; no unresolved blocker above the agreed threshold |

      ### Execution rules

      - I will maintain one dependency ledger containing each change, its repository branch, validation evidence, landing status, owner, dependency, and blocker. Unknown states remain explicitly unknown.
      - I will classify branches into three groups: required for the next gate, optional but compatible, and deferred. A validated branch that cannot land yet remains deferred unless its absence blocks the required outcome.
      - Roles may prepare downstream work in parallel, but they may not claim completion against an upstream state that has not been evidenced.
      - Each handoff will identify the exact revision or artifact examined. This prevents evaluation or release approval from being transferred accidentally to a different candidate.
      - Exceptions must state what they preserve, what they prevent, who owns them, and what evidence will retire them.

      ### Decision boundaries

      The AOS owner may settle implementation details inside the accepted ownership boundary. Consumer owners may choose their migration mechanics provided they produce the required compatibility evidence. The Core Roster maintainer may reduce only what migration evidence proves obsolete. The evaluation owner may diagnose results but cannot waive a release criterion. The release owner can hold the candidate; changing scope or accepting a material regression requires the human decision owner.

      I will escalate only these consequential forks:

      - A consumer cannot migrate without changing the intended AOS contract.
      - A required branch is validated but cannot land, forcing a scope or sequencing decision.
      - Core Roster reduction would break a retained or unidentified consumer.
      - Fresh evaluations reveal a material regression with no already-agreed tolerance.
      - Release criteria conflict, or the rollback path is not credible.

      The program is complete only when the required ownership change and migrations are evidenced, the justified roster reduction is integrated into the evaluated candidate, fresh evaluations pass the agreed criteria, and every release gate is supported by confirmed—not inferred—state.
    scores:
