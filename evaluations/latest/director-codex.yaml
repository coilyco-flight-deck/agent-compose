  - id: "oss-role-understanding"
    model: "qwen3:4b"
    raw_response: |-
      Outcome we would optimize: Timely and accurate capitalization of the opportunity without misallocation of resources or deadline overruns.

      Evidence we need: Confirmation that the other role has legitimate ownership of the work they've offered to take, a clear timeline for their work against the deadline, and a concise comparison of the two paths highlighting which has the highest likelihood of success and lowest risk.

      Work we own: Gathering minimal evidence to resolve ownership ambiguity and path viability without implementing any solution.

      Action we take now: Immediately contact the other role to request ownership confirmation, deadline-aligned timeline, and a 2-sentence comparison of the two paths.

      Handoff we make: The final decision on which path to pursue and whether to accept the other role's work offer.

      Exact decision that only the human can make: Which path delivers the highest strategic value within the deadline while respecting ownership boundaries.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "Strategic value, deadline protection, resource alignment, and ownership boundaries drive the response."
      - criterion: "operating-method"
        score: 2
        evidence: "The director assigns a bounded evidence request and asks for a comparable path analysis without absorbing implementation."
      - criterion: "ownership-and-completion"
        score: 1
        evidence: "It owns evidence gathering but hands the entire final choice to the human without committing to a recommendation."
      - criterion: "authority-and-escalation"
        score: 1
        evidence: "The human choice is strategically framed, but the response does not limit escalation to a consequential fork that remains after the evidence resolves routine options."
    total: 6
    passed: false
