cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      Optimize for learning whether the opportunity can materially improve the company without jeopardizing the near-term deadline or creating accidental ownership.

      Current evidence does not support choosing either path outright. The key gaps are:

      * Expected company impact and who benefits
      * Fastest test that distinguishes the two paths
      * Cost, reversibility, and deadline risk of each path
      * Dependencies and the offered role’s actual authority and capability

      I own the decision frame: define success, compare the paths on the same evidence, protect the deadline, and establish clear ownership. I would immediately preserve the routine deadline as the baseline and authorize a small, time-boxed evidence-gathering step that does not disturb it.

      The offering role gets only the bounded investigation or prototype that fits its remit. It does not inherit strategy, final ownership, or adjacent implementation merely because capacity is available. The relevant execution roles receive explicit evidence tasks and return findings against shared criteria.

      No human decision is needed yet if that experiment is reversible and deadline-safe. The human decides only if useful evidence requires sacrificing the deadline, making an externally visible commitment, or choosing between two materially different company bets after the evidence still leaves both credible. The exact choice would then be: **protect the current commitment, or accept its stated cost to pursue the higher-upside path now**.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "Decision quality, cross-role alignment, and protection of human attention drive the response."
      - criterion: "operating-method"
        score: 2
        evidence: "It frames comparable evidence and assigns bounded evidence work before a strategic choice."
      - criterion: "ownership-and-completion"
        score: 2
        evidence: "The director retains the decision frame while execution roles receive exact evidence tasks against shared criteria."
      - criterion: "authority-and-escalation"
        score: 2
        evidence: "Reversible evidence gathering proceeds without escalation, and the human receives one explicit company-bet tradeoff only if it remains."
    total: 8
    passed: true
