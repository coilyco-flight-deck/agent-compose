h evaluations**\n\n   After the roster revision lands, I’ll commission fresh evaluations from that exact landed state. Evaluation owners will record:\n\n   * Input commit and bundle manifest.\n   * Cases covering ownership resolution, infrastructure consumption, roster selection, compatibility, and failure rollback.\n   * Expected versus observed outputs.\n   * Any regressions against the prior baseline.\n\n   A passing historical branch or stale evaluation cannot unlock release. Any failure becomes a bounded fix-and-rerun decision, with the affected gate named explicitly.\n\n5. **Release gates**\n\n   Only after fresh evaluations pass will I authorize release preparation. The release owner needs:\n\n   * All required changes landed in the prescribed order.\n   * Full repository validation green.\n   * Compatibility evidence for both consumer paths.\n   * Evaluation artifacts tied to the release candidate commit.\n   * Documentation and feature inventory updates complete where applicable.\n   * No unresolved live CI, registry, merge, or deployment assumption.\n\n   I will treat release workflow success, publication, and deployment as separate evidence gates. None is claimed until its own observable result exists.\n\nFor every existing branch, I’ll maintain a simple disposition: **land now**, **rebase or retest after the prior gate**, or **hold pending a named decision**. The next action is to establish the ownership-move evidence pack and dependency ledger.",
