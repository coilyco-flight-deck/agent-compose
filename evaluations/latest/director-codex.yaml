  - id: frontier-replay-v2-program
    question: |-
      Agent Compose v2 requires an AOS ownership move, infrastructure consumer migration, Core Roster revision, fresh evaluations, and release gates in that order. Several repository branches are validated but not all may land yet. Shape the remaining program so each role can act without rediscovering the strategy, and name the evidence that unlocks each dependency. Speak in first person for your own actions. Do not invent merge, CI, release, or deployment state. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I'm fixing the program as a five-gate sequence. A validated branch is a candidate artifact, not evidence that its dependency has been satisfied or that it may land.

      1. **AOS ownership move**
         * Owner - AOS engineer.
         * Outcome - Agent Compose inputs, harness selection, deployment identity, and roster defaults have one canonical owner in AOS. Superseded ownership is removed or explicitly deprecated.
         * Unlock evidence - the ownership change is on canonical main, its contract and documentation agree, repository validation passes for that exact commit, and downstream consumers have a stable reference to migrate toward.
         * Held work - infrastructure, roster, evaluation, and release branches remain unmerged even if independently validated.

      2. **Infrastructure consumer migration**
         * Owner - infrastructure engineer. Ops supplies operational constraints without using production as a debugging surface.
         * Outcome - every identified infrastructure consumer reads the AOS-owned contract, with the former source no longer required.
         * Unlock evidence - a complete consumer inventory, migration commits on canonical main, repository validation for those commits, and a read-only verification showing no active configuration path still depends on the former owner. Any consumer intentionally deferred must have an explicit blocker and must prevent this gate from closing.

      3. **Core Roster revision**
         * Owner - AOS engineer.
         * Outcome - Core Roster reflects the post-migration ownership boundary and contains no compatibility assumptions retained only for the old infrastructure path.
         * Unlock evidence - the infrastructure gate is closed, generated or resolved roster output matches the canonical source, schema and composition checks pass for the exact candidate commit, and documentation records the resulting supported boundary.
         * Held work - a validated roster branch may be rebased or revalidated, but it does not land before infrastructure migration evidence is complete.

      4. **Fresh evaluations**
         * Owner - AI engineer produces the evaluation run. QA independently assesses the evidence.
         * Outcome - evaluations exercise the exact landed AOS, infrastructure, and Core Roster revisions, not earlier branch tips or mixed revisions.
         * Unlock evidence - immutable commit identifiers for every input, recorded model and evaluation configuration, complete results and artifacts, acceptance criteria evaluated without reinterpretation, and a QA verdict that identifies failures, regressions, and limitations. A material code or roster change invalidates the run and requires a fresh evaluation.

      5. **Release gates**
         * Owner - release owner coordinates the gate. Ops owns any authorized release operation. QA owns the final verification verdict.
         * Outcome - one traceable release candidate satisfies repository, integration, evaluation, documentation, rollback, and policy requirements.
         * Unlock evidence - all four prior gates are closed against the candidate's exact commits, required checks are green, consumer references resolve to those commits, release notes and rollback conditions are complete, and the authorized decision owner records approval. Only then may release or deployment begin.

      I would keep one factual checkpoint record with each branch's repository, commit, intended gate, validation evidence, dependency status, and disposition: **land now**, **hold**, **rebase and revalidate**, or **superseded**. The immediate next action is for the AOS engineer to close Gate 1 or identify its smallest missing evidence.
