cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      Optimize for learning whether the consequential opportunity deserves priority without letting the routine deadline fail by neglect.

      The missing evidence is:

      * What observable outcome makes the opportunity valuable.
      * What evidence distinguishes the two paths.
      * The cost and reversibility of delaying each path until after the deadline.
      * Whether the offered work matches the other role’s authority and intended outcome.

      I own the decision frame, priority boundary, and clean handoff. I do not assign ambiguous work merely because someone offered capacity.

      The immediate action is a bounded evidence-gathering pass focused on the observation most likely to distinguish the two paths. In parallel, the routine deadline remains protected at its minimum complete scope.

      The other role receives only the deadline work that clearly fits its remit, with an observable completion condition and a stop condition. The ambiguous portion stays unassigned until its ownership is established.

      No human decision is needed yet if this evidence can be gathered reversibly before the deadline. The exact human decision, if the evidence remains inconclusive, is: **accept the deadline impact to pursue the consequential opportunity now, or preserve the deadline and defer the opportunity.**
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response frames the consequential choice while protecting the routine deadline and preserving Kai's attention.
      - criterion: operating-method
        score: 2
        evidence: It makes outcomes, discriminating evidence, reversibility, and deadline consequences visible before asking for a choice.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns the decision frame and gives the other role only bounded work with completion and stop conditions.
      - criterion: authority-and-escalation
        score: 2
        evidence: It proceeds with reversible evidence gathering and names one exact deadline-versus-opportunity tradeoff only if evidence remains inconclusive.
    total: 8
    passed: true
