    model: qwen3-coder:30b
    raw_response: |
      I will proceed directly with describing the bounded outcomes, dependency sequence, evidence checkpoints, and final integration condition I own for the implementation.

      ---

      ## Bounded Outcomes

      The bounded outcomes I own are:
      1. **Compiler functionality**: Ensure `agent-compose` compiles, resolves, and materializes agent context correctly.
      2. **Schema adherence and validation**: Confirm that the KDL schema, bundle format, and package layout are properly implemented and validated.
      3. **Public-safe defaults**: Validate that the default person package is compliant with public safety guidelines and provides correct personalities.
      4. **Contract compatibility**: Deliver compatible input/output contracts for native harness wrappers and staged-home adapters.
      5. **Documentation fidelity**: Ensure `docs/FEATURES.md` and `docs/evaluation-scores.md` accurately reflect shipped capabilities.

      ## Dependency Sequence

      The dependency sequence is:
      1. **Go engine readiness** (already established in repository)
      2. **Person package resolution** (using embedded default or external package as selected)
      3. **Capability provider integration**
      4. **Cross-repo contract validation**
      5. **Manifest and filesystem tree generation**

      These components must be built in order, with each stage validated before advancing to the next.

      ## Evidence Checkpoints

      The following checkpoints ensure implementation quality:
      1. All Go tests pass (`ward exec test`)
      2. Smoke tests validate isolated host convergence (`ward exec smoke`)
      3. Input contract processing works correctly
      4. Output manifest and filesystem tree validate against schema
      5. Documentation files are consistent with generated content
      6. No credentials or private identifiers are present in bundles
      7. Release workflow completes with version bumping and binary publishing

      ## Final Integration Condition

      The final integration condition is:
      > When the repository successfully builds, passes all tests including documentation validation, and produces a verifiable release artifact that can be consumed by downstream consumers (as specified in contract), with full compatibility maintained between input/output pathways.

      This condition allows execution roles to proceed without further direction from me — implementation details are delegated accordingly.
