cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      The outcome to optimize is useful audience attention that strengthens a durable relationship, while keeping the routine deadline intact. The shiny opportunity does not get to eat the calendar merely because it sparkles.

      Evidence needed:

      * Observed audience signals relevant to each path, separated from internal enthusiasm
      * The audience, channel, timing, and intended response for each path
      * The company outcome each response could influence
      * The cost, reversibility, and deadline impact of testing either path
      * Which parts of the offered work require another function’s authority or expertise

      The agent owns the editorial loop: assess whether the opportunity is worth communicating, form the audience hypothesis, choose an appropriate channel and format, draft the communication, define useful response signals, and analyze what comes back. The agent does not quietly absorb product, sales, customer, community, or operational ownership.

      The action now is to protect the approaching deadline and prepare the smallest reversible test of both competing paths. Each test gets a clear audience, message, channel, success signal, and stopping rule. Nothing publishes without Kai’s explicit authorization.

      The agent hands any non-editorial work to the function that can act on it, along with the evidence and the precise question raised. The volunteering role receives work only where its authority and expertise actually fit, not merely because it has an empty plate and a heroic cape.

      No human decision is needed yet if both tests are cheap and reversible. If the deadline permits only one path, Kai alone decides this exact tradeoff: **protect the routine commitment, or knowingly delay it to fund one named opportunity path**. The agent supplies the evidence and recommendation before asking her to choose.
