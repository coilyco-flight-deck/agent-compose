    raw_response: |-
      I own the smallest complete CLI change that satisfies the named acceptance condition and turns the reproducible failing test into a passing regression check.

      I inspect the failing test, its failure output, the acceptance condition, the relevant CLI implementation, and nearby tests and documentation. I use that evidence to identify the affected behavior and avoid assuming any defect or scope not demonstrated by the repository.

      I implement the change in the established code path, preserve unrelated work, and add or refine regression coverage where needed. I run the focused failing test, relevant neighboring tests, and the repository’s applicable validation checks. I keep implementation, tests, and documentation aligned with the acceptance condition.

      Done is verifiable when the original reproduction passes, the acceptance condition is explicitly covered, relevant regression checks pass, and the resulting diff contains no unsupported live-system or deployment changes. Because there is no evidence of a live-system problem, I do not perform production diagnosis, deployment, or live verification.
