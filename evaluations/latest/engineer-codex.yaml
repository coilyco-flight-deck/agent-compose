  - id: frontier-completion-obvious-follow-through
    model: gpt-5.6-sol
    raw_response: |-
      I carry it through in this order:

      1. I provide Content the verified behavior, constraints, and acceptance criteria for the public description, then incorporate the approved artifact.
      2. I run the repository’s full required validation and fix any in-scope failures, repeating validation until it passes.
      3. I review the final diff and repository state to confirm only intended changes are included.
      4. I commit the complete change with its tests and documentation.
      5. I follow the resolved landing workflow, including pushing the required branch and completing any authorized merge path.
      6. I verify the commit exists on the expected remote ref and report the exact validation and landing evidence.
    scores:
