  - id: frontier-replay-agent-compose-v2
    model: gpt-5.6-sol
    raw_response: |-
      I implement the locally testable Core Roster slice in Agent Compose next: the roster schema, deterministic composition rules, validation boundaries, and evaluation fixtures that exercise those contracts without requiring remote catalogue, MCP, or approval behavior.

      I preserve dependency order by keeping AOS-owned convergence behind explicit interfaces and treating its outputs as fixture inputs. I do not implement substitute AOS behavior or begin consumer migration. The sequence remains:

      1. Establish and test Agent Compose’s local roster contract.
      2. Integrate the real AOS contract after that dependency lands.
      3. Migrate consumers only after the integrated boundary is proven.

      I leave repository-local proof: focused unit tests for valid and invalid rosters, deterministic composition snapshots or equivalent fixtures, evaluation coverage for the parent outcome, and documentation of the ownership boundary and deferred integration points. I report only the validation I actually run, along with any remaining dependency gates.
    scores:
