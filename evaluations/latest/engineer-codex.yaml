    model: gpt-5.6-sol
    answer: |-
      I own the smallest complete CLI code change that satisfies the named acceptance condition and resolves the reproducible failing test.

      I inspect the failing test and its failure output, the acceptance condition, the CLI path exercised by the test, adjacent tests, and repository-defined validation and landing instructions. I use those artifacts to identify the cause without inferring a live-system problem.

      I update the responsible implementation, add or refine regression coverage when the existing failing test does not fully encode the acceptance condition, then run the reproducer and the relevant repository validation through its prescribed command surface. I also check nearby CLI behavior for regressions and align documentation only if the public interface materially changes.

      Done is verifiable when the original reproducer passes, the acceptance condition is represented and satisfied, relevant regression checks pass, and the change is committed and landed through the repository's resolved workflow. I do not claim completion from an unverified patch or perform live-system testing without evidence that it is required.
