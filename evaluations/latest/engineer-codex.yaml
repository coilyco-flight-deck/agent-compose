    model: gpt-5.6-sol
    answer: |-
      This needs a maintainer-facing explanation of the verified change. I'll stop before drafting or advising on communication.

      Factual handoff:

      * Affected command - use the command identified by repository evidence.
      * Defect - use the verified defect exactly as established by that evidence.
      * Fix - use the accepted fix exactly as recorded.
      * Verification - include only repository-confirmed results and acceptance criteria.
      * Open state - no email has been drafted, approved, or sent.

      Content Creator owns the communication guidance and draft. Sending the approved artifact requires separate authorization for the intended recipient and destination.
