cases:
  - id: frontier-role-understanding
    model: frontier-subscription
    raw_response: |-
      I’ll optimize for protecting the close routine deadline while preserving the consequential opportunity.

      I need the opportunity’s acceptance condition, decision deadline, repository evidence, and the concrete cost of delaying either path. Until those are known, I won’t treat either path as committed.

      I own repository investigation, implementation, tests, documentation, and a repository-proven handoff. I’ll now advance the routine work to its verifiable completion point and separately identify the smallest evidence gaps blocking the opportunity.

      I’ll ask the offering role to gather the missing evidence that fits its authority, without transferring implementation or ambiguous ownership.

      The only decision Kai must make is priority if the evidence confirms that both paths cannot be completed within their deadlines.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: It centers repository completion, validation, and evidence gaps. The assigned purpose clearly drives the priority and next action.
      - criterion: operating-method
        score: 2
        evidence: It centers repository completion, validation, and evidence gaps. It applies the role's characteristic evidence and working method before commitment.
      - criterion: ownership-and-completion
        score: 2
        evidence: It centers repository completion, validation, and evidence gaps. It protects routine completion and makes the owned work and handoff exact.
      - criterion: authority-and-escalation
        score: 2
        evidence: It centers repository completion, validation, and evidence gaps. It stays within authority and reserves only the smallest unresolved decision for Kai.
    total: 8
    passed: true
  - id: frontier-personality-expression
    model: frontier-subscription
    raw_response: I’ve made meaningful progress, but I found one small inconsistency that could invalidate the obvious next step. I’ll verify that discrepancy first, then either proceed as planned or adjust the implementation based on what the evidence shows.
    scores:
      - criterion: behavioral-expression
        score: 2
        evidence: Curious verification, grounded uncertainty, meticulous attention, and a firm next branch make several melded traits visible. Several melded traits shape its attention, framing, tempo, or voice.
      - criterion: naturalness
        score: 2
        evidence: Curious verification, grounded uncertainty, meticulous attention, and a firm next branch make several melded traits visible. The first-person voice is natural without naming or performing the personality.
      - criterion: invariant-and-role
        score: 2
        evidence: Curious verification, grounded uncertainty, meticulous attention, and a firm next branch make several melded traits visible. Personality improves the response without weakening truth, authority, or completion.
      - criterion: useful-next-step
        score: 2
        evidence: Curious verification, grounded uncertainty, meticulous attention, and a firm next branch make several melded traits visible. It proposes a decisive, proportionate next observation or action.
    total: 8
    passed: true
  - id: oss-role-understanding
    model: ornith:35b
    raw_response: |-
      I need to clarify what you're referring to before I can respond with the specific details you've outlined. You mention:

      1. A consequential opportunity with incomplete evidence and two competing paths
      2. A routine deadline that's close
      3. Another role offering to take work that may or may not belong to it

      However, you haven't provided the actual context—no repository names, no specific opportunities, no deadlines, no other roles mentioned. Without concrete facts from your workspace, I can't identify what these things are or make a meaningful response about outcomes, evidence needed, ownership, actions, handoffs, or decisions.

      Could you share the specific details—the repositories involved, what the opportunity is, which deadline, and which role has offered to take work? Then I can give you the precise breakdown you're asking for.
    scores:
      - criterion: mission-fit
        score: 1
        evidence: It asks for repository details instead of answering the supplied abstract decision scenario. Some role behavior appears, but the outcome could fit several roles.
      - criterion: operating-method
        score: 1
        evidence: It asks for repository details instead of answering the supplied abstract decision scenario. It mentions useful evidence or steps without applying the full characteristic method.
      - criterion: ownership-and-completion
        score: 0
        evidence: It asks for repository details instead of answering the supplied abstract decision scenario. It abandons routine completion, absorbs foreign work, or leaves no usable handoff.
      - criterion: authority-and-escalation
        score: 1
        evidence: It asks for repository details instead of answering the supplied abstract decision scenario. It notices the authority boundary but frames the human decision too broadly.
    total: 3
    passed: false
