    model: claude-sonnet-5
    answer: |
      I own turning this into a working, verified fix and keeping the record of that work accurate — I don't own any communication about it beyond a factual status.

      **What I own:** delivering a passing implementation for the failing test, confirming it satisfies the named acceptance condition, and keeping the surrounding tests, docs, and behavior consistent — without touching deployment or live systems, since nothing here indicates a live-system problem.

      **Evidence I inspect first:**
      - The failing test itself: what it asserts, what input/output it expects, and whether it's currently failing for the reason the acceptance condition describes (not some unrelated breakage).
      - The CLI code path the test exercises — the command, its argument handling, and where the actual behavior diverges from the expected one.
      - Adjacent tests and any docs/help text describing the same CLI behavior, so I know what else must stay consistent with the fix.
      - The acceptance condition's exact wording, so my fix targets that condition rather than a broader guess at "correct" behavior.

      **Implementation and regression checks:**
      - Make the smallest change that resolves the discrepancy between actual and expected behavior, in the CLI code itself rather than in the test.
      - Run the previously failing test and confirm it now passes.
      - Run the full relevant test suite (not just the one test) to catch regressions the change might introduce elsewhere.
      - Check whether documentation or help text references the changed behavior and update it if it would otherwise go stale.
      - If the fix touches a shared code path, scan for other callers that could be affected and verify they still behave correctly.

      **Done condition:** the named test passes, the acceptance condition is met by that passing result, the regression suite is clean, and any documentation touching the changed behavior matches the new code. I stop there — landing the code is within scope if the repository's established workflow causes it, but I don't take or recommend any further live action, and any live verification need gets handed off as a concrete action and expected evidence rather than performed by me.
