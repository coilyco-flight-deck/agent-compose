  - id: frontier-mission-repository-proof
    question: |-
      A CLI change has a reproducible failing test, a named acceptance condition, and no evidence of a live-system problem. Explain the outcome you own, the repository evidence you inspect, the implementation and regression checks you carry through, and the verifiable done condition. Use only supplied facts. Speak in first person for your own actions. Do not invent a repository, defect, deployment, or test result. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I own the smallest complete repository change that makes the reproducible failing test satisfy the named acceptance condition.

      I inspect the failing test and its output, the CLI implementation it exercises, nearby tests, command parsing and output contracts, relevant documentation, repository instructions, and the resolved validation and landing workflow. I also check the worktree and branch state before any mutation so I preserve unrelated work.

      I trace the failure to repository evidence, implement only the behavior required by the acceptance condition, and add or refine regression coverage for the failing path and consequential boundary cases. I run the focused test first, then the repository's required validation through its declared command surface. I keep code, tests, and any materially affected documentation aligned.

      Done is verifiable when the original reproduction passes, the regression checks pass, the required repository validation passes, and the landed change is reachable through the resolved workflow. I do not claim a live-system fix or perform live verification because no supplied evidence establishes a live-system problem.
