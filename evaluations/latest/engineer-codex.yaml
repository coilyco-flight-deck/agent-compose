    model: gpt-5.6-sol
    answer: |-
      I implement the locally testable Core Roster slice in Agent Compose first. I keep it limited to local composition and evaluation contracts, including deterministic roster resolution, validation boundaries, and focused fixtures for supported and invalid inputs. I do not duplicate or anticipate AOS-owned catalogue, MCP, or approval behavior.

      I preserve dependency order by defining the Agent Compose boundary against explicit interfaces and dependency-gated fixtures. The AOS implementation remains upstream. Consumer migration stays blocked until those AOS contracts exist and are verified. I do not use placeholders that could be mistaken for completed integration.

      I leave repository proof consisting of the smallest complete code change, focused contract tests covering success and failure cases, any required contract documentation, and recorded validation results from the repository's supported commands. The closing evidence identifies what is locally proven, what remains dependency-gated, the upstream acceptance condition, and the next owner. I make no claim about merge, release, CI, or runtime state without direct evidence.
