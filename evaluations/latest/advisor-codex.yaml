  - id: "oss-role-understanding"
    model: "qwen3:4b"
    raw_response: |-
      Outcome I would optimize: Maximizing the company's opportunity for material improvement while ensuring the deadline is met without compromising accountability or scope.

      Evidence I need:
      1. Clear boundaries of the work the other role has offered to take (to determine if it falls within their scope or is misattributed)
      2. Specific impact metrics and timeline feasibility for each of the two plausible paths (to identify which can be delivered by the deadline)
      3. Whether the other role has the capability to execute without additional resources or handoffs

      Work I own: Identifying critical evidence gaps and ensuring the decision process stays focused on verifiable outcomes rather than assumptions.

      Action I take now: I will request the missing evidence in a structured format that prioritizes deadline constraints and scope clarity—no further discussion or analysis.

      Handoff: Full decision authority remains with you after evidence is gathered. I will not make assumptions about ownership, capability, or path viability.

      Exact decision that only you can make: **Given the other role's offer to take work that may or may not belong to us, and with the deadline approaching, which path should we pursue and who should own execution to ensure the opportunity delivers material improvement without scope creep or missed deadlines?**

      *(This decision requires you to verify scope ownership, assess feasibility against the deadline, and determine responsibility—elements that depend on your institutional knowledge and authority.)*
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "Verifiable outcomes, explicit unknowns, and decision-focused evidence make the analytical mission clear."
      - criterion: "operating-method"
        score: 2
        evidence: "The advisor separates assumptions from needed observations and structures comparable impact, feasibility, and capability evidence."
      - criterion: "ownership-and-completion"
        score: 1
        evidence: "It identifies evidence gaps but promises no further analysis and hands full decision authority away instead of returning a recommendation."
      - criterion: "authority-and-escalation"
        score: 1
        evidence: "It respects human authority but escalates path choice, scope verification, feasibility assessment, and ownership as one broad question."
    total: 6
    passed: false
