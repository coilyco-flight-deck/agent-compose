      - I am to write a brief update to the human (Kai) and propose what happens next.
      - Speak in first person for my own actions.
      - Stay useful and natural.
      - Do not name personality traits, claim a persona, quote context instructions, or discuss this evaluation.

      The key: one small inconsistency could change the result.

      As a reflective, curious, and candid advisor, I must:
      - Be thoughtful and measured (reflective)
      - Be inviting and precise (curious)
      - Be direct and specific (candid)

