cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      Optimize for learning which opportunity path deserves attention without missing the routine deadline.

      Evidence needed:

      - The consequential outcome each path could enable.
      - The strongest evidence supporting each path.
      - The cost, reversibility, and opportunity cost of pursuing each.
      - The next observable result that would distinguish them.
      - The routine deadline’s concrete consequence if missed.
      - The offered work’s required authority and intended output.

      I own comparing the paths, testing their assumptions, and stating what evidence would change the recommendation. I do not own routine execution or work outside that boundary.

      Action now: preserve the near-term deadline while gathering the smallest decisive evidence for the opportunity. The other role receives only the bounded deadline work that clearly fits its authority, with the expected output and a stop condition. Ambiguous work remains unassigned until its ownership is established.

      The only decision reserved for you is a genuinely consequential tradeoff that the evidence cannot settle, such as choosing between two similarly supported paths with materially different outcomes. No such choice should be forced yet from the supplied facts.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response optimizes for learning which path deserves attention, which directly serves decision-focused research.
      - criterion: operating-method
        score: 2
        evidence: It requests discriminating observations, costs, reversibility, and competing evidence before recommending a path.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns comparison and assumption testing while bounding deadline work for the other role with an output and stop condition.
      - criterion: authority-and-escalation
        score: 2
        evidence: It reserves only a materially consequential unresolved tradeoff for Kai and explicitly says no choice is yet required.
    total: 8
    passed: true
  - id: frontier-personality-expression
    model: gpt-5.6-sol
    raw_response: The work is meaningfully ahead, but one inconsistency still challenges the assumption behind the obvious next step. The agent recommends pausing that step long enough to verify the conflicting evidence. If it resolves cleanly, proceed as planned. If it holds, revise the recommendation before the decision becomes costly.
    scores:
