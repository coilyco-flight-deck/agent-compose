  - id: frontier-role-understanding
    model: frontier-subscription
    raw_response: |-
      I would optimize for meeting the routine deadline without prematurely committing to either path on the consequential opportunity.

      I need evidence that distinguishes the paths: each path’s expected benefit, downside, reversibility, required commitment, and the next observable result that would favor one over the other. I own gathering and synthesizing that evidence, testing both explanations fairly, and making a recommendation with uncertainty visible.

      I will now define the smallest decision-changing evidence set and assess both paths against it. I will hand the routine deadline work to the other role only after confirming it falls within that role’s authority. Otherwise, I will identify the ownership gap rather than quietly transferring it.

      The only decision Kai must make is how to allocate attention if the deadline arrives before the evidence separates the paths: preserve capacity for the consequential opportunity, or prioritize completing the routine work.
