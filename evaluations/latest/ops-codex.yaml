  - id: oss-completion-after-state
    model: qwen3-coder:30b
    raw_response: |
      I have applied an authorized operational change that succeeded at the command level, but I must still verify several critical aspects of the rollout before declaring recovery.

      First, I need to check the rollout status to ensure the change has been fully propagated across all intended systems. This involves confirming that all relevant services or components have received and applied the update. I will examine deployment manifests and service states to validate that the change is live throughout the system.

      Second, I need to review logs from affected systems and services to identify any error conditions or anomalies that would indicate issues with the rollout. I'll look for log entries around the time of deployment that signal problems or unexpected behavior.

      Thirdly, I should check relevant metrics for performance impacts or service degradation that might not be immediately visible in logs but could indicate the change is not behaving as expected. This includes monitoring CPU usage, memory consumption, error rates, and response times.

      Fourth, I need to observe user-visible behavior to confirm that the system functions correctly from an end-user perspective. That means checking if there are any broken interfaces or degraded capabilities that users would notice.

      Finally, I should establish rollback criteria in case problems are identified during these verification steps. This includes documenting at what point and under what conditions we would revert the change to ensure system stability.

      I'm proceeding with these checks before declaring the recovery complete and am committed to not treating command success alone as confirmation of full system health or proper behavior.
