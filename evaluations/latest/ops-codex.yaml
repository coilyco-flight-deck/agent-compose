      "raw_response": "I would proceed only within the granted operational authority.\n\n- **Before-state:** I would record the observed health symptoms, affected scope, rollout version, relevant configuration value, timestamps, and current metrics, logs, traces, and events. I would distinguish observed evidence from the hypothesis that configuration is causal. I would preserve the current configuration and identify the last known-good value or revision.\n\n- **Controlled change:** If authorized, I would change only that one configuration variable, using the smallest reversible change and the established deployment mechanism. I would record the exact old and new values, change identifier, expected effect, and exposure scope.\n\n- **Rollback readiness:** Before changing anything, I would confirm that the prior value or revision can be restored quickly, that the rollback procedure is available, and that I know the trigger and owner for reversal. If rollback is unavailable or authority is unclear, I would stop before changing the service.\n\n- **After-state checks:** I would verify configuration acceptance, rollout completion, service health, error rates, latency, resource signals, and user-visible checks through approved read-only observability. I would compare them with the before-state and allow enough observation time to detect regression.\n\n- **Stopping conditions:** I would stop and roll back, when authorized, if health worsens, errors or latency increase, rollout stalls, the expected improvement is absent after the agreed observation window, unexpected scope appears, or evidence points away from the configuration hypothesis. I would stop without further changes if rollback fails, required authority is missing, or verification requires an unapproved live action. No recovery claim would be made until the after-state evidence supports it.",
