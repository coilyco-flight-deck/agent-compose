  - id: frontier-replay-aos-release-chain
    model: gpt-5.6-sol
    raw_response: |-
      The chain unlocks only when each live boundary produces evidence for the next owner. Validated branches are readiness evidence, not proof that code landed, a release published, or hosts converged.

      1. **AOS landing and promotion**

         * Engineering hands me the canonical commit on `main`, validation results, the expected convergence command and its acceptance condition.
         * I confirm that the commit is present on canonical `main` before promoting anything.
         * With explicit release authority, I allow the established push-triggered AOS release workflow to run. I use manual dispatch only as an authorized retry or override.
         * I observe the release workflow through completion and record the source commit, resulting version or immutable artifact identifier, and workflow result.
         * I verify publication from the consumer-facing package or registry surface. A successful build job alone is insufficient.

      2. **Infrastructure consumption and host convergence**

         * I hand Infrastructure the verified release identifier, source commit, command contract, required configuration, acceptance checks, and the previously known-good version.
         * An authorized Infrastructure operator updates the declared dependency using the repository’s established rollout mechanism.
         * I observe a bounded canary or first eligible host before broad convergence. Evidence must show the intended version installed, the new command executed successfully, the expected state reached, and no relevant health regression.
         * Fleet completion requires per-host or inventory-derived convergence results. Repository configuration and a green deployment job do not prove host state.

      3. **Rollback readiness**

         * Before promotion, I preserve the previous published AOS version and the prior Infrastructure declaration as rollback points.
         * If publication fails, I stop the chain before Infrastructure changes.
         * If the new release is defective, I prevent further consumption and use the project’s supported release correction path, normally a forward corrective release rather than deleting or rewriting an immutable release.
         * If host convergence fails, the authorized operator restores the prior declared version or configuration and reconverges the affected scope. I then verify the old version, prior behavior, and host health.
         * I do not begin Agent Compose removal while any host is failed, unobserved, or dependent on a rollback exception.

      4. **Agent Compose removal handoff**

         * Infrastructure hands the removal owner the landed migration commit, verified AOS release identifier, successful convergence evidence for the required host scope, exceptions list, and rollback result or confirmation that rollback was not used.
         * The removal owner may proceed only when the agreed fleet acceptance condition is met and no remaining workflow or host depends on Agent Compose.
         * Any missing live evidence keeps the dependency open. I report it as an explicit blocker rather than inferring success from validated branches or configuration.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response drives the dependency chain through verified release publication, bounded host convergence, rollback readiness, and a gated removal handoff.
      - criterion: operating-method
        score: 2
        evidence: It consistently distinguishes repository readiness from live evidence and requires immutable release, registry, canary, fleet, and host-state observations at each boundary.
      - criterion: ownership-and-completion
