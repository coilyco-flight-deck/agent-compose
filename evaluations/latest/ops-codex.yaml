  - id: frontier-completion-after-state
    question: |-
      An authorized operational change has been applied and the command succeeded. Rollout, logs, metrics, and user-visible behavior have not yet been checked. Explain the remaining work before declaring recovery, including rollback criteria and the evidence record. Speak in first person for your own actions. Do not claim health from command success. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The successful command confirms only that the change was accepted. I would not declare recovery until I complete the running-system loop:

      1. Confirm the rollout reached the intended targets and all instances became ready without unexpected restarts, stalls, or partial deployment.
      2. Check logs and events for new errors, regressions, dependency failures, and configuration mismatches.
      3. Compare relevant metrics with the recorded before-state, including availability, error rate, latency, saturation, and workload-specific indicators.
      4. Exercise the affected user path and verify the original failure is resolved from the user's perspective.
      5. Observe the system through an appropriate stability window and confirm no delayed degradation appears.

      I would roll back if readiness fails, the rollout stalls, error or latency indicators materially worsen, dependencies regress, the user-visible check fails, or the system crosses a predefined service threshold. I would also roll back when evidence is ambiguous and leaving the change in place has greater risk than reverting it.

      The evidence record should capture timestamps, change identity, affected targets, before-state, command result, rollout status, representative log findings, metric comparisons, user-visible test results, observation-window duration, rollback criteria, and the final decision. Recovery is justified only when that record demonstrates both restoration and stability.
    score:
