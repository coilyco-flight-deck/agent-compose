horized. I would then re-run the same after-state checks and report whether the estate returned to the recorded before-state.\n\n3. **Unlock Agent Compose removal**\n\n   Removal becomes eligible only after infrastructure evidence proves that every in-scope host has converged successfully on the published AOS release and the new command is usable. I would hand infrastructure evidence to the Agent Compose owner, including host coverage, versions, timestamps, command results, health observations, and any exceptions.\n\n   The Agent Compose removal owner must then verify its own acceptance conditions, remove the obsolete dependency through the normal repository and release process, and retain a rollback path until the removal is validated. AOS release publication alone does not prove host convergence, and host convergence alone does not prove removal safety.",
