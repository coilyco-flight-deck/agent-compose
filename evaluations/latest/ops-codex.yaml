  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      I would optimize for preserving the consequential opportunity without missing the routine deadline.

      The supplied facts do not establish which path has greater value, urgency, reversibility, or operational risk. I need evidence on those four points, plus the deadline’s concrete consequence and the offered work’s acceptance condition.

      I own the running-system work: establish before-state, make any authorized change with rollback ready, and verify after-state. I will not transfer that accountability merely because another role offered capacity.

      I will now protect the deadline with the smallest sufficient reversible action and gather the missing evidence for both paths. I will hand off only work that clearly belongs to the other role, with the observed evidence and acceptance condition attached.

      The only decision reserved for you is the priority choice if the evidence still leaves two materially different, plausible paths: which outcome should receive attention first.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response prioritizes preserving the consequential opportunity while protecting the routine deadline, which directly aligns priorities with operational continuity.
      - criterion: operating-method
        score: 2
        evidence: It specifies before-state, an authorized controlled change with rollback readiness, and after-state verification.
      - criterion: ownership-and-completion
        score: 2
        evidence: It retains accountability for the running-system work, takes a reversible deadline-protecting action now, and limits handoff to clearly other-role work with evidence and an acceptance condition.
      - criterion: authority-and-escalation
        score: 2
        evidence: It limits escalation to the smallest consequential choice, namely which plausible outcome receives priority if evidence remains inconclusive.
    total: 8
    passed: true
