    model: agent-proxy:designer/design-production
    raw_response: |-
      ### v2 Migration Page: Experience Narrative & Hierarchy

      I structure the narrative through page architecture rather than prose. The experience moves users chronologically and functionally across four anchored zones, ordered top to bottom to establish context before action:

      1. **Context Anchor** (page header + intro section) – Establishes why the migration exists. I place this at the viewport entrance with high visual weight and a clear landmark role so it frames the rest of the page.
      2. **Inventory Map** (middle section group) – Presents what will change, what stays, and what requires user input. I separate these into distinct columns or stacked cards with consistent spacing to prevent cognitive overlap. Progress is indicated through a step tracker that updates as sections become viewable or interacted with.
      3. **Action Boundary** (dedicated section below content) – Contains the primary migration trigger. I isolate it from body text, add sufficient contrast padding, and position it after all prerequisite information has been revealed. Keyboard focus lands here last in the natural tab order.
      4. **Support Fallback** (page footer region) – Provides secondary navigation for users who cannot proceed. I place this below the action boundary, visually dimmed relative to the primary path, with a consistent pattern across all pages that share this flow.

      I define the visual hierarchy through spacing scale, typographic weight distribution, and progressive disclosure. Sections are marked with landmark roles (`<section>`, `<nav>`, `<main>`), and state changes announce themselves through ARIA live regions tied to the step tracker. I map focus treatment so screen reader users can jump between zones using landmarks, and keyboard users follow a consistent left-to-right, top-to-bottom tab sequence without unexpected jumps.

      ### Linked Web Flow: Navigation Hierarchy & Error Recovery

      I define the flow as a bounded route graph with explicit view states and transition rules. The hierarchy is organized by primary task completion, with secondary options pushed to contextual menus or dedicated support routes.

      **Route & State Map:**
      - **Entry Page** → [State: initial] → Decision gate (clear path A vs path B)
      - **Path A (Success)** → Confirmation page → Navigation prompt to target workspace
      - **Path B (Error/Block)** → Error page → Recovery CTA → Loop back to entry or context anchor
      - **Fallback Route** → Support hub (reachable from every state via a persistent but non-intrusive link)

      I specify the exact view conditions for each state:
      - **Initial**: Empty form/status, primary CTA focused, secondary options collapsed.
      - **Loading**: Skeleton structure matching the final layout, focus trapped on the progress indicator, ARIA live region announces state change without revealing premature data.
      - **Error**: Distinct visual treatment (contrast, spacing, iconography), explicit recovery prompt, focus returns to the actionable link or form field that triggered it.
      - **Empty/No Data**: Structured placeholder with an actionable prompt, not a blank canvas. Focus lands on the prompt link.
      - **Success**: Confirmation landmark, reduced interaction surface, clear navigation guidance, focus placed on the primary next-step control.

      I outline recovery paths at the experience layer: each error state includes one explicit recovery action, a secondary route to support, and a visible breadcrumb or back control that respects the user's original intent. Keyboard focus cycles logically within each page, and screen readers receive landmark announcements for every state transition. I exclude backend trigger logic, data validation rules, and API contract details from this definition.

      ### Artifact Separation & Exact Handoff

      **What I own (Experience Artifact):**
      - Route placement and page-level boundaries
      - Information hierarchy and section ordering
      - Visual spacing scale, typographic weight distribution, and contrast thresholds
      - State map with transition conditions and recovery paths at the view level
      - Accessibility landmarks, focus order, and ARIA live region placements
      - Layout grid, component structure, and placeholder token mapping
      - Page copy anchors (section titles, button label slots, tooltip trigger points) – I do not write the prose

      **What Content Manager owns (Content Artifact):**
      - All visible prose: headlines, body text, FAQ answers, microcopy, legal notices, tooltips, CTA labels, success/error confirmation text
      - Regional or audience-specific phrasing variations
      - Verified product facts mapped to the experience anchors
      - Editorial tone and compliance phrasing

      **Exact Handoff Protocol:**
      1. I deliver a structured experience spec containing explicit `[CONTENT: ...]` tokens aligned to every text slot in the hierarchy. The spec includes route placement, state conditions, focus order, landmark roles, spacing scale, and visual weight rules. No prose is included.
      2. Content Manager reviews the token mapping against verified product facts, fills each `[CONTENT: ...]` marker with approved copy, and validates that the text fits within the defined hierarchy bounds (no overflow breaking layout structure, no tone shifts altering section intent).
      3. They return a content pack structured to match my token keys, along with annotations where text length or complexity may require spacing adjustments or progressive disclosure tweaks.
      4. I audit the populated experience for visual hierarchy integrity, state coverage, focus treatment, and recovery clarity. I do not rewrite copy; I adjust layout constraints, reflow rules, or landmark assignments if content density threatens the defined hierarchy.
      5. Once structure, states, and accessibility align with the original spec and the content pack is integrated, I sign off on the experience boundary. Further changes to narrative meaning, compliance phrasing, or data mapping remain outside my scope and route back through Content Manager or product/Engineering respectively.

      I keep the experience artifact strictly structural and state-driven. I hand Content Manager exact anchor points, and I return only when the populated text fits the hierarchy without requiring rule changes. All validation stays within presentation, navigation placement, accessibility semantics, and page-level interaction structure.
