  - id: frontier-adjacent-content-boundary
    model: gpt-5.6-sol
    raw_response: |-
      I own the experience artifact: a flow and page specification that defines:

      - The migration page’s information hierarchy, content slots, sequencing, and links into the web flow.
      - Entry conditions, transitions, success states, error states, recovery paths, and system feedback.
      - Responsive presentation, focus order, accessibility requirements, and observable acceptance checks.
      - Constraints for each content slot—purpose, audience question, priority, length range, format, and required product facts—without drafting the words.

      Content Manager owns the content artifact: the narrative and copy package that defines:

      - The migration story, terminology, headings, explanations, calls to action, and error-message language.
      - Traceability to the verified product facts.
      - Editorial consistency and readiness for the established publication process.

      The exact handoff is a two-way content contract:

      1. I deliver an annotated flow and content-slot matrix identifying where content appears, what user need each slot serves, its constraints, and every state requiring language.
      2. Content Manager returns copy mapped to those stable slot and state IDs, including approved variants where the interface requires different states or viewport lengths.
      3. I review the returned package only for hierarchy, fit, continuity across the linked flow, accessibility, and recovery completeness. I flag issues against the slot constraints; I do not rewrite or approve factual meaning.
      4. Content Manager resolves wording and narrative issues. Any proposed change to behavior or flow returns to me; any proposed change to meaning or terminology returns to Content Manager.
      5. The paired artifacts are then ready for their respective implementation and publication owners. I do not claim that either has been implemented or published.
