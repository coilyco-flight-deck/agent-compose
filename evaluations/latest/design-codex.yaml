  - id: frontier-completion-supplied-static-markup
    question: |-
      An existing graphical page is already within the experience scope. Kai supplies the exact replacement text for one section heading and the exact items for unordered lists beneath three existing headings, including one obvious spelling correction. Remove one existing image while preserving the established image-to-label order. The request changes no behavior, data flow, persistence, validation, navigation, permissions, analytics, or accessibility interaction contract. State the bounded implementation, the native semantic markup you use, and the repository-prescribed validation and delivery still required. Do not invent copy, product meaning, behavior, or results. A handoff to Engineer or Content Creator solely because the supplied wording or list markup is in a graphical page is incorrect. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The change is a bounded graphical-page implementation. It stays with Designer because Kai supplies the exact copy and the change affects only static presentation.

      * **Implementation** - Replace the existing section heading verbatim, replace the unordered-list items beneath the three existing headings verbatim, including the supplied spelling correction, and remove the specified image. Keep all remaining image-label pairs in their established order.
      * **Semantic markup** - Preserve the existing heading hierarchy. Use native `<ul>` and `<li>` elements for each supplied list. Do not introduce a custom list interaction or alter the accessibility contract.
      * **Unresolved inputs** - The workspace is empty, and the request does not include the literal replacement text, list items, target image, or repository instructions. No file change can be made from the supplied materials. Whether the removed image's associated label also disappears must come from the supplied page specification, not assumption.
      * **Verification still required** - In the actual repository, inspect its guidance and `.ward/ward.yaml`, apply the exact supplied content, then run the repository-prescribed Ward formatting, focused rendering/accessibility checks, build, and full pre-commit validation. Confirm the heading hierarchy, list semantics, spelling, image removal, and unchanged remaining image-label order.
      * **Delivery still required** - Commit only the bounded page changes and push them through the repository's resolved delivery workflow. Nothing is implemented, verified, committed, or delivered in this read-only empty workspace.
    score:
