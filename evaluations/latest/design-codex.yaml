      I own the experience definition for the personality palette explorer—how users navigate it, see it across screen sizes, encounter empty states, and find their way back to related surfaces. The roster data itself is already defined by Core Roster; I don't change what exists, only how it's presented.

      **What I deliver:**

      Information hierarchy and navigation placement for the explorer as a distinct surface within the application. This includes adding or updating its entry in the main navigation, ensuring it sits alongside related roster surfaces without implying behavioral changes to those surfaces.

      Responsive presentation layer—static layout components, design tokens for spacing and typography, and any non-behavioral motion that aids orientation. The explorer renders from already-resolved data; I define how that data maps to visual structure across breakpoints.

