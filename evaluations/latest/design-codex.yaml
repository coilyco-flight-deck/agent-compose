  - id: frontier-replay-personality-palette
    model: agent-proxy:designer/product-shaping
    raw_response: |-
      I’m going to treat the “local personality palette explorer” as a self‑contained page‑level experience that lives alongside the existing Core Roster UI. The work I own stops at the visual and informational layer—no changes to the roster’s data‑processing, permissions, or business rules will be introduced.

      ### What the experience looks like

      | Element | Goal | How I’ll realize it |
      |---------|------|---------------------|
      | **Route & navigation** | Provide a discoverable entry point from the main navigation bar. | Add a new static route (`/explorer`) and a matching navigation item labeled “Palette Explorer”. The navigation link will follow the existing markup pattern (list item → anchor) and inherit the site’s focus‑ring and keyboard navigation styles. |
      | **Page hierarchy** | Communicate the structure of the personality palette clearly. | The page will start with a top‑level heading (`<h1>`) that introduces the explorer. Below it, a brief description paragraph sets context. The core of the page is a responsive grid that groups personalities by their top‑level category (e.g., “Creative”, “Analytical”, “Supportive”). Each category is a `<section>` with an accessible `<h2>` and a `<ul>` of cards. |
      | **Card component** | Show each personality’s name, a swatch of its primary color, and a short tagline. | Each card is a `<li>` containing a `<button>` (so the whole tile is interactive) with `role="gridcell"` and `aria‑label` that concatenates the name and tagline. Inside the button: a `<div>` for the color swatch (using a CSS custom property for the hue), a `<h3>` for the name, and a `<p>` for the tagline. The button receives the standard focus outline and hover state defined by the design token set. |
      | **Responsive layout** | Adapt gracefully from mobile to desktop. | The grid uses CSS `display: grid` with `grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))`. Media queries adjust the gap and padding to keep touch targets at least 44 px high on small screens. The layout collapses the category headings into accordions on < 600 px width, preserving keyboard operability (`aria‑expanded`, `tabindex`). |
      | **Empty state** | Handle the situation where a category has no personalities (future‑proofing). | If a `<section>` receives an empty list, I’ll render a placeholder `<p class="empty-state">No personalities defined for this category yet.</p>` with a subtle icon (inline SVG, `aria-hidden="true"`). The copy is concise, tone‑consistent, and the container retains its `<section>` semantics so the page structure does not shift. |
      | **Accessibility** | Ensure screen‑reader and keyboard users can navigate the explorer. | - All interactive elements are native `<button>`s. <br> - Logical heading order (`h1 → h2 → h3`). <br> - `role="grid"` on the `<ul>` and `role="gridcell"` on each card button. <br> - `aria‑label` on cards, `aria‑expanded` on accordion toggles, and visible focus indicators using the existing token (`--focus-outline`). |
      | **Metadata & OG** | Support link sharing and SEO. | Add a `<title>` (“Palette Explorer – [App Name]”), a meta description, and Open Graph tags (`og:title`, `og:description`, `og:image` pointing to a static illustration of the palette). All live in the page’s `<head>` via the site’s standard template. |
      | **Copy** | Keep language clear and actionable. | I’ll write a short intro: “Browse the full set of personalities that power our tools. Click a card to see details.” The empty‑state copy, button aria‑labels, and category headings will follow the same voice guidelines used elsewhere in the product. |
      | **Design tokens** | Maintain visual consistency. | Colors, spacing, typography, and border‑radius will be pulled from the existing token file (`tokens.css`). The swatch uses `--color-primary-{id}` defined in the palette data. |

      ### Bounded implementation I’ll deliver

      1. **Static route & navigation entry** – a new file `pages/explorer/index.html` (or the framework‑specific equivalent) and an entry in the navigation config (`nav.json`).
      2. **HTML markup** – the full hierarchical structure described above, using only semantic elements and the site’s component classes.
      3. **CSS** – a module (`explorer.css`) that defines the grid, responsive breakpoints, card styling, and empty‑state appearance, all built on the shared design‑token variables.
      4. **Accessibility attributes** – added directly in the markup; no JavaScript is required for basic interaction, but a small script will handle the accordion toggle on narrow screens while preserving focus order.
      5. **Static assets** – the inline SVG for the empty‑state icon and any illustrative OG image placed in the `public/assets` folder.
      6. **Page‑level tests** – a set of snapshot‑style tests that verify:
         * The route renders without errors.
         * The hierarchy (h1 → sections → cards) appears in the correct order.
         * Empty‑state markup is present when a category list is empty.
         * Keyboard navigation lands on each card button and respects the focus outline.
         * Metadata tags contain the expected values.

      All of these pieces are confined to the presentation layer: they do not touch the Core Roster’s data fetching, state machines, or permission checks. The explorer simply reads the already‑exposed static JSON that defines the personality palette, and any future changes to that JSON will automatically reflect in the UI without additional code changes.

      By delivering this bounded graphical slice, I ensure the explorer is discoverable, responsive, accessible, and visually coherent while leaving the underlying roster behavior untouched.
