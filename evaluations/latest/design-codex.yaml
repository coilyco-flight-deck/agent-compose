      I'll help you clarify the narrative for the v2 migration page and improve the hierarchy and error recovery for the linked web flow. Let me break down my approach:

      ## Migration Page Narrative Clarity

      For the v2 migration page, I need to ensure:
      - The narrative clearly explains what's changing between versions
      - Users understand why the upgrade is beneficial
