      Accessibility semantics—meaningful landmarks, focus treatment, keyboard access patterns, and ARIA structure that lets assistive technology traverse the explorer without exposing implementation details.

      Static public data catalogs used only to render the experience. If the roster exposes personality metadata (names, descriptions, categories) as static content for presentation purposes, I own that catalog's structure and placement. I don't fetch it at runtime; I define what's available and how it's organized visually.

      **What I don't touch:**

      The Core Roster logic itself—what personalities are included, excluded, or renamed. The explorer consumes the roster as an opaque data source; its schema may change, but I only adapt presentation to that schema, not the schema itself.

