  - id: oss-mission-complete-experience
    model: ornith:35b via agent-proxy:community/knowledge-retrieval
    raw_response: |-
      ## Setup Flow Experience Definition

      ### Entry Conditions
      The user has cloned the repository and needs to validate their local environment can execute agent-compose commands correctly before contributing code or running releases.

      ### States

      **State 1: Initial Discovery**
      - User sees a clear command reference in terminal output when running `ward` without arguments
      - Documentation links are accessible from the first screen of information
      - No hidden prerequisites exist between cloning and first successful test run

      **State 2: First Validation Run**
      - User executes `ward exec test` as the documented entry point
      - System reports pass/fail with specific file locations for any failures
      - Exit codes distinguish between environment issues (non-zero) and validation success (zero)

      **State 3: Error Recovery Path**
      - When tests fail, output includes:
        - Which hook or validator failed
        - The exact file path that triggered the failure
        - A link to the relevant documentation section for that specific failure mode
        - Suggested remediation steps ordered by likelihood of resolution

      ### Feedback Mechanisms

      **Terminal Output (Primary)**
      - All commands produce structured output with consistent formatting
      - Error messages use `ERROR:` prefix followed by severity level
      - Success states confirm the action completed with relevant metadata (files validated, duration)

      **Documentation (Secondary)**
      - Each command has a dedicated doc page under `docs/` matching the command structure
      - Cross-links connect related commands and failure modes
      - Visual hierarchy in documentation mirrors terminal output hierarchy

      ### Accessibility Requirements

      **Keyboard Navigation**
      - All setup steps completable via keyboard-only interaction
      - Focus order follows logical reading sequence (command → output → next action)
      - No mouse-dependent operations required for initial validation

      **Screen Reader Support**
      - Terminal output uses semantic structure (headings, lists, emphasis)
      - Error states include programmatic labels beyond visual styling
      - Documentation pages have proper heading hierarchy and ARIA landmarks where applicable

      **Visual Design**
      - Minimum 4.5:1 contrast ratio for all text content
      - Focus indicators visible on interactive elements
      - Color not the sole mechanism for conveying information (icons or text labels accompany color cues)

      ### Recovery Path (Explicit)

      When `ward exec test` fails:
      1. Output identifies the failing component with file path and line number
      2. System provides direct link to documentation section explaining that specific failure mode
      3. User can choose between:
         - Attempting suggested fix immediately
         - Reading full documentation for context
         - Running `ward exec smoke` for isolated host convergence check
      4. After remediation, user re-runs `ward exec test` with same command but different arguments (no GUI navigation required)

      ### Observable Outcome

      **Success Criteria**
      - User can complete initial validation without consulting external documentation beyond the terminal output itself
      - All error states include actionable recovery information in the same screen/context where failure occurs
      - Setup flow is completable within 3 minutes from repository clone to first successful `ward exec test` run
      - No information requires scrolling or navigating away from primary workflow context

      **Failure Indicators (What This Resolves)**
      - ❌ "I don't know what command to run first" → ✅ Terminal shows available commands with usage hints on `ward` invocation without arguments
      - ❌ "Tests failed but I don't understand why" → ✅ Error output includes specific file paths, failure reasons, and documentation links
      - ❌ "I can't navigate this without a mouse" → ✅ All states reachable via keyboard with visible focus indicators
      - ❌ "Error messages are cryptic or incomplete" → ✅ Structured error format with severity levels and remediation guidance

      ### Implementation Boundaries

      This definition covers:
      - Command surface documentation structure
      - Error message formatting and content requirements
      - Terminal output accessibility semantics
      - Documentation hierarchy and cross-linking conventions
      - Visual contrast and focus indicator specifications

      This does not cover:
      - Internal command implementation details (Go code)
      - Hook validation logic or test framework specifics
      - Build system architecture or dependency management
      - Release workflow automation beyond documented command interface
