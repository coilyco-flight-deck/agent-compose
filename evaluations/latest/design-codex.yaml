  - id: frontier-mission-complete-experience
    model: ornith:35b via agent-proxy:community/knowledge-retrieval
    raw_response: |-
      # Setup Flow Experience Definition

      ## Entry Conditions

      The flow begins when a developer initiates environment configuration for Kai's developer tooling. The entry point requires:
      - An unconfigured local workspace
      - Network connectivity to verify package availability
      - A terminal or browser session with focus

      I define the entry as explicit rather than implicit, so developers know they've started something that will change their environment state.

      ## States and Transitions

      The flow moves through four distinct states:

      **1. Discovery State**
      - The system presents available packages/components to install
      - Each option includes its purpose, dependencies, and estimated disk usage
      - Selection is required before proceeding

      *Feedback*: Visual indicators show which items are selected, with a running summary updating in real time.

      *Error recovery*: Developers can deselect any item or search/filter the list. No data loss occurs from changing selections at this stage.

      *Accessibility*: All package options are keyboard-navigable with clear focus indicators. Each option includes an aria-label describing its function and size requirements. Screen readers announce selection state changes immediately.

      **2. Configuration State**
      - Selected packages require environment-specific configuration (paths, ports, credentials scope)
      - The system validates each input against format constraints before accepting it

      *Feedback*: Inline validation messages appear below invalid fields within 300ms of input. Required fields are marked with visual and aria-required attributes.

      *Error recovery*: Invalid inputs remain in their field with the error message visible. Developers can clear and re-enter without losing other valid configuration. A "Reset to defaults" option is available for each section.

      *Accessibility*: Error messages use `aria-describedby` pointing to the invalid field. Focus moves to the first invalid field on form submission attempt, announced by screen readers. Color is never the sole error indicator; icons and text accompany it.

      **3. Installation State**
      - The system executes package installation with progress reporting
      - Multiple parallel downloads may occur

      *Feedback*: A progress bar shows overall completion percentage. Individual packages display their own status (downloading, extracting, configuring). Estimated time remaining updates every 10 seconds.

      *Error recovery*: If a single package fails, the flow pauses and presents three options: retry that package, skip it and continue with others, or abort the entire installation. The choice is explicit and reversible within a 30-second window before auto-continuing.

      *Accessibility*: Progress updates are announced to screen readers via `aria-live="polite"` regions every 5 seconds. Pause/abort buttons have clear labels indicating their scope (e.g., "Skip this package" vs "Cancel all"). Keyboard users can see progress without waiting for focus changes.

      **4. Completion State**
      - The system verifies installation integrity and presents next steps
      - Documentation links are provided based on what was installed

      *Feedback*: A summary shows what was successfully configured, with verification status (✓) for each component. Any warnings or partial configurations are clearly marked.

      *Error recovery*: If verification fails, the flow returns to Installation State with the specific failure highlighted and a direct retry option. No manual troubleshooting is required at entry conditions; the system handles known failure modes.

      *Accessibility*: The completion summary uses semantic headings (h2, h3) for structure. Links have descriptive text rather than "click here." Focus moves to the summary on state transition with appropriate `aria-live` announcement.

      ## Observable Outcomes

      The flow is complete when:
      - All selected packages are installed and verified
      - Configuration files are written to their expected locations
      - The system presents a clear next step (e.g., "Run `kai init`" or "Open the dashboard")
      - A log of what was done is available for reference

      The flow fails visibly when:
      - Network connectivity drops during installation
      - Disk space runs out
      - A package cannot be verified after installation
      - Required dependencies conflict with existing system state

      Each failure presents an explicit recovery path rather than a cryptic error code or silent exit.

      ## Accessibility Verification Checklist

      Before considering this definition complete, I verify:
      - [ ] All states are reachable via keyboard-only navigation
      - [ ] Focus management is consistent across transitions (no lost focus)
      - [ ] Color contrast meets WCAG AA for all text and interactive elements
      - [ ] Error messages are associated with their fields via `aria-describedby`
      - [ ] Dynamic content updates use appropriate `aria-live` regions
      - [ ] Interactive elements have descriptive labels beyond their visible text
      - [ ] The flow can be completed by a screen reader user without mouse assistance
    scores:
