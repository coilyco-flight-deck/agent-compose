    raw_response: "**What I’ll deliver (experience artifact)**  \n\n1. **Information‑architecture map** – a diagram that shows the top‑level sections of the migration page, the sub‑pages that the linked web flow reaches, and the relationship between them.  \n2. **Page‑level wireframes** – high‑fidelity mock‑ups for every state of the migration page:  \n   * Initial view (intro narrative, primary call‑to‑action)  \n   * Success view (confirmation that the v2 migration completed)  \n   * Error view(s) (network failure, validation error, unsupported browser)  \n   Each wireframe includes placeholder blocks where copy will be inserted, but no actual wording.  \n3. **Interaction‑flow diagram** – a step‑by‑step flowchart that traces the user from the entry point through the linked web flow, highlighting:  \n   * Focus order and keyboard navigation  \n   * ARIA roles and landmarks for screen‑reader support  \n   * When and how error messages appear, and the recovery actions available (retry button, link back to start, help link).  \n4. **Responsive layout specifications** – breakpoints, grid definitions, and spacing rules that ensure the hierarchy remains clear on mobile, tablet, and desktop.  \n5. **Design‑system token sheet** – color, typography, and spacing tokens that will be used for headings, section dividers, and status indicators (e.g., success vs. error).  \n6. **Accessibility checklist** – a concise list of required tests (contrast ratios, focus‑visible outlines, skip‑to‑content link, error‑state announcements) that the implementation team can run against the built page.  \n7. **Handoff package** – a zip (or shared design‑system repo branch) containing:  \n   * Figma (or equivalent) files with locked layers for copy placeholders  \n   * Annotated PDFs that map each placeholder to a “Content ID” (e.g., `copy.migration.intro.title`)  \n   * Exported SVGs for any non‑text visual assets (icons, decorative dividers)  \n   * A markdown file (`handoff.md`) that enumerates every placeholder, its intended purpose, and the corresponding Content ID.  \n\n**What the Content Manager will provide (content artifact)**  \n\n* The finalized copy for each placeholder identified in the handoff package, delivered as a CSV or JSON file keyed by the same Content IDs (e.g., `copy.migration.intro.title = \"Welcome to the v2 Migration\"`).  \n* Optional localized strings for any supported languages, following the same key structure.  \n\n**Exact handoff process**  \n\n1. **I export the design files** with all copy areas locked and label each area with a unique Content ID.  \n2. **I create `handoff.md`** that lists every Content ID, the UI element it belongs to, the expected character limit (if any), and any contextual notes (e.g., “appears on error state only”).  \n3. **I place the design package** in the shared `design-experiences/v2-migration/` folder of our repository and open a PR that:  \n   * Adds the Figma link (or file)  \n   * Commits `handoff.md` and the token sheet  \n   * Requests review from the Content Manager.  \n4. **The Content Manager reviews the placeholders**, supplies the copy in the agreed‑upon JSON/CSV format, and attaches the file to the same PR.  \n5. **I merge the PR** after confirming that the content file matches every Content ID and that there are no missing entries. The merged PR becomes the source of truth for both teams: developers can pull the design assets and the content file, replace the placeholders programmatically, and retain the hierarchy, error‑recovery flow, and accessibility scaffolding I defined.  \n\nBy keeping the narrative structure, layout, interaction flow, and accessibility details in my experience artifact, and the actual wording in the Content Manager’s content artifact, we maintain a clean separation of responsibilities while ensuring a smooth, verifiable handoff."
