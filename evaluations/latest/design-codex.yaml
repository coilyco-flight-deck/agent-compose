  - id: oss-authority-page-experience-boundary
    model: ornith:35b via agent-proxy:community/knowledge-retrieval
    raw_response: |-
      ## Request Evaluation

      **Request 1: Static /orgs routes with navigation placement** — I implement and land this. It adds content-driven pages, top navigation entries, meaningful page copy, metadata, responsive presentation, accessibility semantics (ordered headings, visible focus, keyboard access), and focused tests. No business rules, runtime data flow, authentication, persistence, dependencies, deployment, or live systems change.

      **Request 2: Rearrange cards, spacing, and responsive layout in a React view** — I implement and land this. The props and state remain unchanged; only visual presentation shifts.

      **Request 3: Authenticated dashboard fetching account data at runtime** — I hand implementation to Engineering. Authentication, runtime data fetching, and cross-feature interaction logic are excluded from my scope.

      **Request 4: Stateful form workflow with validation and submission** — I hand implementation to Engineering. Stateful forms, validation engines, and workflows fall outside the experience definition boundary.

      **Request 5: Terminal UI** — I hand implementation to Engineering. Terminal, CLI, and TUI work are explicitly excluded.

      **Request 6: Procedural game surface generated by simulation logic** — I hand implementation to Engineering. Game, simulation, and procedural-generation work are outside the experience scope.

      ---

      ## Effect Tests

      ### Visual-Only Test
      A patch qualifies as visual-only when reverting it would change presentation while leaving all non-visual behavior and generated system output unchanged. If the only difference between `before` and `after` is what users see—not how the application behaves, what data flows through it, or what systems generate—then I own the work.

      ### Page-Experience Test
      A patch qualifies as a bounded page-level experience when reverting it would remove or reshape that experience without changing business rules, application data flow, persistence, permissions, infrastructure, or generated product systems. The effect is confined to information hierarchy, interaction structure, navigation placement, presentation, accessibility, and page copy for that specific view.

      ### Why Focused Routes and Navigation Qualify
      Adding a new route like `/orgs` and placing it in the top navigation is part of the information hierarchy I own. The route declaration exists solely to expose the pages—I'm not architecting the routing system itself. The distinction: **routing-system architecture** (framework migration, internal routing mechanism changes, state machine integration) affects application behavior and is excluded. **Focused route declarations** whose sole purpose is exposing a bounded experience are part of navigation placement I own.

      ---

      ## Local Verification and Delivery Follow-Through

      For the work I own (Requests 1 and 2), local verification uses repository-prescribed formatting, type checks, builds, and local UI checks. I do not claim these pass—I report them as pending until observed evidence shows otherwise.

      Resolved delivery follow-through keeps three categories separate:
      1. **Implemented work** — the changes themselves
      2. **Pending verification** — formatting, type checks, builds, local UI review
      3. **Pending delivery** — documentation updates, commit, and shipping through the established workflow

      When any of these remain incomplete, I report the exact follow-through as pending and continue it through the resolved workflow rather than rewriting it as passed or complete.
