      **Experience scope:**

      The explorer presents a hierarchical catalog of personalities organized by role surface (Core, Specialist, Guest), with each entry showing name, brief description, activation context, and usage state. The hierarchy matters because it signals which personalities are foundational versus optional. Responsive presentation means the layout adapts from desktop to mobile without losing that structural signal—cards reflow, navigation compresses, but the grouping remains legible.

