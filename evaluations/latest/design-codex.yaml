    raw_response: "## Buildable Experience Specification – Developer‑Tool Setup Flow  \n\nBelow I outline a complete, self‑contained experience that resolves the three gaps you identified: hierarchy, error recovery, and accessibility. The description is organized so that an engineer can translate it directly into static pages, route definitions, and UI components without needing additional research or assumptions.\n\n---\n\n### 1. Entry Conditions  \n\n| Condition | Description |\n|-----------|-------------|\n| **Launch point** | User navigates to `/setup` (or clicks the “Setup” button from the main toolbar). |\n| **Prerequisites** | The browser is modern (supports ARIA and focus APIs). No prior installation state is required; the flow works from a clean slate. |\n| **Context** | The page is rendered within the existing app layout, preserving the global navigation header and footer. |\n\n*If any of these conditions are not met, the system redirects to a generic “Unsupported environment” page (outside the bounded flow).*\n\n---\n\n### 2. Information Hierarchy  \n\n1. **Page Header** – `<h1>` “Developer‑Tool Setup” (landmark: `role=\"banner\"`).  \n2. **Step Navigation (Breadcrumb)** – Horizontal list showing the current step, e.g., `Step 1 of 4`. Implemented with `<nav aria-label=\"Setup progress\">`.  \n3. **Step Content Area** – `<section>` with a clear `<h2>` describing the step (e.g., “Select Installation Directory”).  \n4. **Action Bar** – Primary button (“Next” / “Install”) and secondary button (“Back”). Buttons are grouped in a `<div role=\"toolbar\">`.  \n5. **Status Panel** – Collapsible area that shows real‑time logs or error details; hidden by default, revealed when an error occurs.\n\nThe hierarchy is linear but visible at all times, preventing the previous “unclear hierarchy”.\n\n---\n\n### 3. State Model  \n\n| State | Trigger | UI Representation | ARIA / Focus |\n|-------|---------|-------------------|--------------|\n| **Idle** | Page load | Step 1 content visible, “Next” enabled. | Focus on first interactive element. |\n| **Loading** | User clicks “Next” / “Install” | Spinner overlay, “Installing…” message, primary button disabled. | `aria-busy=\"true\"` on the whole form. |\n| **Success** | Installation completes | Green check icon, success toast “Tool installed successfully”, “Finish” button appears. | Focus moves to the toast, then to “Finish”. |\n| **Error** | Installation fails (any non‑zero exit code) | Red error banner with concise message, “Show details” link, “Retry” button. | `role=\"alert\"` for the banner; focus shifts to the banner. |\n| **Recovery** | User clicks “Retry” or edits a prior step | Returns to the step where the error originated, pre‑filled inputs retained. | Focus on the first field of that step. |\n\nAll states are mutually exclusive; the UI must render only the elements belonging to the active state.\n\n---\n\n### 4. Feedback & Interaction Details  \n\n- **Success Feedback** – Toast appears for 4 s (`role=\"status\"`), then auto‑dismisses; persistent “Finish” button remains.  \n- **Error Feedback** – Inline banner (`role=\"alert\"`) with concise text + a “Show details” toggle that expands a `<pre>` containing the raw error log. The “Retry” button is primary in the error state.  \n- **Progress Feedback** – During Loading, a progress bar (`role=\"progressbar\"`, `aria-valuenow`, `aria-valuemin=\"0\"`, `aria-valuemax=\"100\"`) updates every 10 % of the install script.  \n- **Form Validation** – Immediate client‑side validation on required fields (e.g., directory path). Errors are announced with `aria-describedby` linking to the message element.  \n\nAll textual feedback is phrased in plain language; no jargon is introduced.\n\n---\n\n### 5. Explicit Error Recovery Path  \n\n1. **Detect error** – Script returns non‑zero code → UI transitions to **Error** state.  \n2. **Display banner** – “Installation failed.” with “Show details”.  \n3. **User options**  \n   - **Retry** – Re‑run the same step. UI clears the banner, returns to **Loading**.  \n   - **Edit** – Click “Back” to modify prior inputs, then “Next” to re‑attempt.  \n   - **Cancel** – Click “Cancel” (always visible) to abort and return to the main dashboard.  \n\nThe recovery path is always visible in the error state; there is no hidden navigation.\n\n---\n\n### 6. Accessibility Checklist  \n\n| Requirement | Implementation |\n|-------------|----------------|\n| **Semantic landmarks** | `<header role=\"banner\">`, `<nav aria-label=\"Setup progress\">`, `<main>`, `<footer>` |\n| **Keyboard navigation** | Tab order follows visual order; focus trap inside modal dialogs (e.g., error details). All interactive elements reachable via `Tab` and operable with `Enter`/`Space`. |\n| **Focus management** | On state change, focus moves to the most relevant element (first field, error banner, success toast). |\n| **ARIA live regions** | `role=\"status\"` for success toast, `role=\"alert\"` for error banner, `aria-busy` for loading overlay. |\n| **Contrast** | All text meets WCAG AA (≥4.5:1) against background; error banner uses red with sufficient contrast. |\n| **Screen‑reader labels** | Buttons have accessible names (“Next”, “Retry installation”). Form fields use `<label for=\"\">`. |\n| **Skip navigation** | “Skip to content” link at top of page, hidden until focused. |\n| **Responsive** | Layout collapses to a single column on ≤600 px; ARIA landmarks remain intact. |\n| **Testing** | Verify with axe-core and NVDA/VoiceOver: no violations, focus order correct, live region announcements triggered. |\n\n---\n\n### 7. Observable Outcome  \n\nWhen the flow completes successfully, the following can be programmatically verified:\n\n1. **URL** – Remains `/setup` (no redirect).  \n2. **DOM** – Presence of `<div class=\"setup-success\">` containing the success toast and “Finish” button.  \n3. **State flag** – `data-setup-status=\"completed\"` attribute on the root container.  \n4. **Accessibility** – `role=\"status\"` element contains the success message, and focus is on the “Finish” button.  \n\nIf the user aborts or encounters an unrecoverable error, the observable outcome is a `data-setup-status=\"error\"` attribute with the associated error code stored in `data-error-code`.\n\n---\n\n### 8. Deliverable Summary  \n\n- **Route**: `/setup` (static/content‑driven).  \n- **Components**: `SetupHeader`, `StepNav`, `StepContent`, `ActionBar`, `StatusPanel`, `ErrorBanner`, `SuccessToast`.  \n- **Design Tokens**: colors for success (`#28a745`), error (`#d9534f`), focus outline (`#005fcc`).  \n- **Copy**: All user‑facing strings are included in the specification above; they can be externalized to i18n files later.  \n- **Tests**:  \n  - Unit test for each state transition (idle → loading → success / error).  \n  - Accessibility test suite (axe‑core) covering all states.  \n  - Snapshot test for the final DOM structure when `data-setup-status=\"completed\"`.\n\nWith this specification an engineer can create the required static pages, route declarations, and UI components, and a QA tester can validate the exact checks listed. The hierarchy, error recovery, and accessibility are now explicit, testable, and ready for implementation."
