    raw_response: |-
      # Two experience artifacts, one handoff protocol

      ## Artifact 1: v2 migration page

      **What I define (experience):**
      - Page-level information hierarchy: header placement, section ordering, visual grouping of related steps
      - Navigation entry point in the site map and breadcrumbs
      - State transitions between onboarding → v1 status check → v2 selection → confirmation
      - Empty states when no v1 projects exist
      - Error recovery for failed project lookups or permission denials
      - Accessible semantics: heading structure, landmark roles, focus treatment, keyboard navigation patterns
      - Presentational components: progress indicator, step cards, comparison table layout
      - Static public data used only to render the experience (migration path catalog)
      - Metadata and Open Graph treatment for this page

      **What Content Manager defines (content):**
      - Specific v1 → v2 mapping rules per product
      - Policy language about deprecation timelines
      - Exact feature name changes between versions
      - Legal or compliance wording around data migration guarantees
      - Support contact information and escalation paths

      **Handoff point:**
      I ship the page template with section anchors, component slots, and state handling. Content Manager fills each slot with verified product facts. I do not write the mapping rules; they do not reorder my sections. If a policy statement changes the user's next step (e.g., "this feature is removed" vs. "this feature moves"), we pause and resolve whether that belongs in content or state logic before either of us edits.

      ---

      ## Artifact 2: Linked web flow with hierarchy and error recovery

      **What I define (experience):**
      - Route structure: how this page connects to the v2 migration page, related documentation, and support surfaces
      - Navigation placement for entry points from existing product contexts
      - Hierarchy decisions: which information sits primary vs. secondary, what collapses on mobile, what requires scrolling
      - Error recovery paths: retry flows, fallback destinations when a linked resource is unavailable, partial failure states
      - Accessibility semantics for the flow's navigation structure and interactive elements
      - Focus treatment between steps in multi-step sequences within this flow
      - Presentational components: step indicators, back/forward controls, contextual help placement
      - Empty states when no related resources exist

      **What Content Manager defines (content):**
      - Which linked documents actually exist and their current URLs
      - Specific guidance text for each step in the flow
      - Contextual help content that explains decisions at each junction
      - Support escalation language if the user needs to leave the automated flow

      **Handoff point:**
      I define which nodes exist in the flow graph and how they connect. Content Manager populates each node with verified guidance. If a linked document is removed or relocated, I surface that as an error state rather than silently breaking the link; Content Manager provides the replacement URL or confirms removal before either of us updates the route.

      ---

      ## Shared protocol between us

      **I will not:**
      - Write product-specific mapping rules
      - Invent feature names or version numbers
      - Publish content without verification confirmation
      - Implement routes that point to unverified URLs

      **Content Manager will not:**
      - Reorder my section hierarchy without design review
      - Change error state handling logic
      - Add navigation entries outside the agreed route graph
      - Modify accessibility semantics in ways that break the experience definition

      **When either of us encounters uncertainty about ownership:**
      We flag it explicitly, name which artifact it belongs to (experience vs. content), and resolve before proceeding. No assumptions about where a boundary falls get implemented without confirmation from both sides.
