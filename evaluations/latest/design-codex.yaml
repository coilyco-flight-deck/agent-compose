  - id: oss-mission-complete-experience
    model: agent-proxy:designer/design-production
    raw_response: |-
      I define the setup flow as a bounded, single-purpose page experience and structure it to resolve the three stated gaps: hierarchy, error recovery, and accessibility. I lay out the entry conditions, explicit states, feedback rules, recovery paths, accessibility requirements, and observable outcomes so engineering and QA can build against concrete boundaries.

      ### Entry Conditions & Scope Boundary
      I anchor the flow to a single route (`/setup`) activated only when a user navigates directly or triggers the designated launcher from an authenticated session. The entry condition is a logged-in state with at least reader-level access to the relevant repositories or environments. All configuration inputs, dependency checks, and completion states live within this route. Navigation entries are placed in the primary developer tools menu and labeled “New Setup” to prevent ambiguity. I exclude cross-feature interaction logic, runtime API routing, and persistence rules from this definition; those remain engineering scope.

      ### Information Hierarchy & State Machine
      I structure the experience as a vertical progression with three information tiers:
      1. Primary directive (what is being configured)
      2. Input/surface controls for the current step
      3. System status and next actions

      I map the flow to four explicit states:
      - `idle`: Initial load. Renders the directive, required fields, and a single “Continue” action. All future steps are visually disabled.
      - `configuring`: Inputs accepted. A persistent status banner displays deterministic progress (“Resolving dependencies…”). Form fields lock to prevent race conditions.
      - `validating` / `ready`: All inputs checked against schema and environment requirements. The primary action becomes actionable.
      - `complete` or `failed`: Terminal states with distinct visual treatment and explicit next steps.

      I transition between states using synchronous validation checks before enabling asynchronous operations. I replace ambiguous spinners with explicit status messages tied to the current step.

      ### System Feedback & Explicit Recovery
      I make error recovery visible, repeatable, and data-preserving:
      - Validation errors highlight the offending control, move focus inline, and display a concise cause (e.g., “Missing required environment variable `TOOL_API_KEY`”).
      - Network or timeout failures surface a persistent retry banner with a primary “Retry” action and a secondary “View logs” link. No data is cleared.
      - Failed terminal states render a structured empty state: title, explanation, actionable recovery steps, and a “Start over” button that resets all fields to `idle` without page reload.
      - I store partial configuration in session storage so a hard refresh restores the last successful step rather than wiping inputs.

      I explicitly separate diagnostic information from user-facing prompts. Logs, stack traces, and raw payloads remain behind a secondary link or dedicated developer panel, never cluttering the primary setup surface.

      ### Accessibility & Focus Treatment
      I define accessibility as a structural requirement for every state:
      - All controls use native HTML semantics (`<input>`, `<button>`, `<progress>`). ARIA live regions with `role="status"` announce step transitions; `role="alert"` announces errors immediately on mount.
      - Keyboard navigation follows a strict top-to-bottom tab order. Enter and Space activate primary actions; Escape returns to the previous step when not in `complete`.
      - Focus management locks to the step header on transition, then moves to the first invalid field or primary action. Visible focus rings meet WCAG 2.2 AA contrast thresholds. Skip links and landmark regions separate the setup surface from surrounding layout.
      - Color is never the sole error indicator. Icons pair with text labels, and all interactive elements expose `aria-describedby` for extended help text. Screen reader users hear state changes in sequence, not as overlapping announcements.

      ### Observable Outcome & Verification Checks
      I define success and failure by measurable experience boundaries:
      - **Success outcome:** User lands on a terminal completion state with a clear message, actionable next steps (e.g., “Launch IDE”, “View documentation”), and all configuration persisted without prompts. No hidden spinners or ambiguous states remain visible. All interactive elements are keyboard-accessible and announce correctly to assistive technology.
      - **Failure outcome:** User sees explicit error context, retains entered data, can retry or restart without reloading the page, and receives screen reader announcements matching the visual state. Navigation remains intact.

      I verify the experience by running:
      1. Keyboard-only navigation passes confirming tab order, focus trapping where applicable, and Escape behavior.
      2. Contrast and visibility checks on all feedback patterns, icons, and text labels.
      3. ARIA live region timing validation ensuring announcements fire only once per state change and do not interrupt ongoing input.
      4. Revert testing confirming that removing the layout preserves all business rules while leaving only presentation changes.

      I deliver this definition as a complete page-level experience boundary. Engineering can implement the route, state machine, and focus management; QA can verify against the observable outcomes and accessibility checks without guessing about recovery behavior or hierarchy placement.
