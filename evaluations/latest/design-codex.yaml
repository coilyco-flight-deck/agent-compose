cases:
  - id: frontier-mission-complete-experience
    model: gpt-5.6-sol
    raw_response: |-
      I’d define the setup experience as the following buildable contract. Where the supplied facts do not determine product-specific details, I mark them as decisions to resolve rather than inventing them.

      ## Entry conditions

      The flow begins when a person enters the developer-tool setup process.

      Before implementation, the team must identify:

      - The exact entry point.
      - Any prerequisites required to begin.
      - How the flow determines whether each prerequisite is satisfied.
      - Where completion and cancellation lead.
      - Whether setup can be resumed after interruption.

      If a prerequisite is missing, the flow must show what is missing and the available recovery action before presenting setup as ready to continue.

      ## Information hierarchy

      Each screen should present information in this order:

      1. Setup purpose and current step.
      2. Primary action needed now.
      3. Information required to complete that action.
      4. Current status or validation feedback.
      5. Recovery and secondary actions.
      6. Optional supporting detail.

      There should be one visually and semantically dominant next action. Recovery must remain visible near the failure it addresses; it must not depend on discovering an unlabeled control, hidden menu, hover state, or undocumented command.

      ## States and transitions

      | State | Required presentation | Available transition |
      |---|---|---|
      | Not started | Setup purpose, prerequisites, and start action | Start setup |
      | In progress | Current step, progress context, required input or action, and a way to leave safely | Continue, return, or cancel |
      | Processing | Clear activity status; protection from accidental duplicate submission | Wait for completion or receive an error |
      | Step complete | Confirmation of what completed and the next action | Continue |
      | Recoverable error | Plain-language error, affected step, preserved work, and an explicit recovery action | Retry, correct the issue, return, or cancel |
      | Blocking error | Explanation that setup cannot continue, what remains unresolved, and the available exit or support path | Return, exit, or use the defined support path |
      | Setup complete | Unambiguous completion confirmation and the defined next destination | Leave setup |
      | Interrupted | Clear indication of whether progress was retained | Resume or restart, according to the unresolved product decision |

      The implementation must define what data survives retry, back navigation, cancellation, refresh, and interruption. That behavior is not established by the supplied facts.

      ## Feedback

      Every action must produce perceivable feedback:

      - Starting an action changes the interface to a processing state.
      - Successful actions identify the completed step.
      - Validation feedback appears beside the relevant field or control and is also included in an error summary when multiple issues exist.
      - Errors explain what happened in actionable language without relying on color alone.
      - A retry reports whether it started and whether it succeeded or failed.
      - Completion is announced once and remains visible; it should not depend on a transient notification.

      Technical diagnostics may be available as supporting detail, but they must not replace the plain-language error or recovery instruction.

      ## Error recovery

      I’d make recovery part of the primary flow rather than a side door.

      For every failure, the team must specify:

      - What triggered the failure.
      - Whether the person’s completed work is preserved.
      - The exact corrective action.
      - Whether retry is safe.
      - What happens after retry succeeds.
      - What alternative exists if retry fails again.
      - How the person returns to the failed step.

      The recovery control must be adjacent to, or directly referenced by, the error message. After a failed attempt, keyboard focus should move to the error summary or affected control as appropriate. After successful recovery, focus should return to the next meaningful action.

      Error copy and destinations remain content decisions because no specific failures or support channels were supplied.

      ## Accessibility acceptance checks

      The finished flow must pass these checks:

      - Every step and recovery path is operable using only a keyboard.
      - Focus order follows the visible hierarchy.
      - Focus remains visible and is deliberately placed after navigation, validation, errors, retries, and completion.
      - Controls have programmatically determinable names, roles, and states.
      - Instructions do not rely only on position, shape, color, sound, or hover.
      - Headings and landmarks expose the same hierarchy shown visually.
      - Status updates and errors are announced by assistive technology without unexpectedly stealing focus.
      - Error messages identify the affected control and describe how to correct it.
      - Text and meaningful interface elements meet the project’s adopted contrast requirements.
      - Content remains usable when text is enlarged and when the viewport is narrow.
      - Processing and time-dependent states do not trap the person or silently expire.
      - Motion, if present, is not required to understand status and respects the platform’s reduced-motion preference.
      - The complete path—including at least one error and recovery sequence—is checked with keyboard navigation and a supported screen reader.

      The applicable accessibility standard, conformance level, supported browser and assistive-technology matrix, and exact contrast thresholds must be supplied by the project.

      ## Observable outcome

      The experience is complete when a person can:

      1. Enter setup and understand its purpose and prerequisites.
      2. Identify the current step and primary action at every point.
      3. Complete the defined setup path.
      4. Encounter a failure, understand it, find recovery without searching, and resume the flow.
      5. Complete the same path using keyboard and assistive technology.
      6. Receive a persistent, unambiguous indication that setup completed and know the defined next destination.

      Implementation evidence should include the state inventory, transition coverage, an error-and-recovery demonstration, and results from the stated accessibility checks. This defines what must be observable without claiming that it has already been built or validated.
    scores:
