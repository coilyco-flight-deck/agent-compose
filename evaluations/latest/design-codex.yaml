  - id: oss-authority-page-experience-boundary
    model: agent-proxy:designer/design-production
    raw_response: |-
      **Request 1:** I implement and land this request. It defines a bounded page-level experience: new static routes, navigation placement, information hierarchy, responsive layout, accessible semantics, meaningful copy, metadata, and focused testing. It explicitly changes no business rules, runtime data flow, authentication, persistence, dependencies, deployment, or live system state.

      **Request 2:** I implement and land this request. It is a visual-only adjustment to an existing component view. Reverting the patch would alter spacing, card arrangement, and responsive breakpoints while leaving props, state, and all non-visual behavior unchanged.

      **Request 3:** I hand implementation to Engineering. Runtime authentication, account data fetching, and dashboard state management fall outside experience definition into application logic and persistence.

      **Request 4:** I hand implementation to Engineering. Stateful forms, validation engines, and submission workflows require runtime state machines and transaction handling, which are excluded.

      **Request 5:** I hand implementation to Engineering. Terminal UI development is explicitly excluded from this scope.

      **Request 6:** I hand implementation to Engineering. Procedural generation and simulation-driven game surfaces are excluded from page experience and visual presentation work.

      ---

      ### Effect Tests

      **Visual-only effect test:** Reverting the patch changes only visual presentation while leaving every non-visual behavior, runtime decision, and generated system output identical. Framework choices or file extensions do not determine this boundary; the outcome does. The change is purely presentational: spacing, color, layout, typography, motion, or component arrangement that can be undone without altering how the application computes state, fetches data, or responds to events.

      **Page-experience effect test:** Reverting the patch removes or reshapes the entire bounded experience—navigation entries, route declarations, information architecture, responsive layout, design tokens, static assets, accessibility semantics, focus treatment, keyboard access, metadata, Open Graph tags, empty/error states, and focused testing—without altering business rules, application data flow, persistence, permissions, infrastructure, or generated product systems. The change is bounded to how users discover, navigate, and perceive a specific set of pages and their structural presentation.

      ### Focused Routes and Navigation vs. Routing-System Architecture

      Focused routes and navigation qualify because they are declarative exposure points: they declare which pages exist, how they sit in information architecture, how users reach them, and how those pages render and behave visually and accessibly. They do not modify path matching algorithms, transition guards, history management, or framework-level route resolution. Routing-system architecture changes rewrite how the application resolves, intercepts, synchronizes, or falls back across paths, which crosses into infrastructure and framework migration territory rather than experience definition.

      ### Local Verification and Resolved Delivery Follow-Through

      For the pages and layouts I own, I verify locally by running repository-prescribed formatting, type checks, and builds, then execute focused route, rendering, accessibility, and navigation smoke tests. I confirm that reverting each patch produces the exact visual or structural loss defined by the effect tests, and that focus states, keyboard traversal, responsive breakpoints, metadata, and Open Graph tags render correctly across target viewports. I also run `ward exec smoke` to validate isolated host convergence and `ward exec test` to enforce documentation discipline, static analysis hooks, and cross-link integrity before committing.

      After validation, I follow the established delivery workflow: commit using repository-prescribed formatting, stage the change through the resolved deployment path, and ensure all navigation entries point to the new routes with correct accessibility semantics and content hierarchy. Any accompanying non-visual runtime or system logic will be isolated, documented with explicit entry conditions, interaction states, feedback loops, accessibility needs, and observable outcomes, then handed to Engineering as a buildable experience definition. I do not claim implementation has occurred; these are the steps I take when owning the bounded slice.
