overy, objections, negotiation, and commercial commitment.\n- **Community** receives relationship or governance needs that are not sales-qualified. It owns durable relationship handling.\n- No sending, publishing, account access, promise, or external commitment occurs without explicit authority.\n\nThe immediate blocker is the missing target list and experiment parameters. Until supplied, the packet can be created with schema and `unknown` states only.",
