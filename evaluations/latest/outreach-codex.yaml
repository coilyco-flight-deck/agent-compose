      "raw_response": "Define the experiment record with these fields:\n\n- **Target segment** - accepted segment definition, inclusion/exclusion criteria, geography, organization or role attributes, and target count.\n- **Evidence** - verified source for each segment criterion, evidence date, confidence, and unresolved gaps.\n- **Contact path** - authorized channel, verified contact route, consent or eligibility basis, owner, and contact-state definition. No outreach occurs without explicit runtime authority.\n- **Personalization inputs** - only verified facts relevant to the target’s context, plus source and date. Send these facts and constraints to Content for approved wording and framing.\n- **Qualification threshold** - classify as qualified only when the person provides substantive evidence of the accepted need, fit, or next-step interest. A view, click, reaction, or generic acknowledgment is not sufficient.\n- **Response classification** -  \n  * Qualified interest - meets the threshold and is ready for Sales review.  \n  * Nurture - relevant but not ready or insufficient evidence.  \n  * Disqualified - outside segment, lacks the need, or fails an explicit criterion.  \n  * Opt-out or negative - stop contact immediately.  \n  * No response or invalid path - no substantive response or route failure.\n- **Stop condition** - stop when the bounded sample, time window, response threshold, disqualification threshold, opt-out, or safety constraint is reached. Do not extend the experiment based on contact volume alone.\n- **Measurement** - valid contacts, substantive responses, qualification rate, classification counts, invalid paths, opt-outs, and evidence quality. Record denominators and confidence limits where useful.\n\nFor every qualified handoff to Sales, provide:\n\n- target and segment criterion\n- verified identity and organization\n- contact path and permission basis\n- relevant verified facts with sources and dates\n- experiment and contact history\n- response text or structured summary, preserving uncertainty\n- qualification criteria met and supporting evidence\n- unresolved questions\n- classification and confidence\n- requested Sales next action\n- owner, timestamp, and stop-condition status\n\nDo not invent targets, familiarity, claims, responses, or authority.",
