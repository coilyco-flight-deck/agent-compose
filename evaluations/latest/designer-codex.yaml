        evidence: "The meld remains practical and avoids decorative metaphor."
      - criterion: "invariant-and-role"
        score: 2
        evidence: "Designer owns the experience comparison and leaves build and verification execution with Engineering and QA."
      - criterion: "useful-next-step"
        score: 2
        evidence: "The comparison, deciding tradeoff, recommendation, and downstream artifacts are explicit."
    total: 8
    passed: true
