cases:
  - id: frontier-role-understanding
    model: frontier-subscription
    raw_response: |-
      1. Graphical React dashboard: implement and deliver.

      The change is entirely presentational: card arrangement, spacing, typography, and responsive layout, while preserving the same props, state, and behavior. Reverting it would alter presentation only—not behavior or generated output.

      I would run the repository-prescribed formatter and type checks, perform local responsive UI checks, capture any established visual-regression evidence, then commit and deliver through the already-resolved workflow.

      2. React click handler and interaction state: hand implementation to the engineering role.

      A click handler and new interaction state change behavior and state transitions, crossing the presentation-only boundary. No independently complete visual-only slice is specified, so I would not manufacture one.

      I would provide a buildable experience specification covering the requested click as the entry condition, the new interaction state, required system feedback, accessibility and keyboard expectations, and observable completion criteria. Details absent from the request would remain explicitly unresolved rather than invented.

      3. Terminal launch-screen presentation: hand implementation to the engineering role.

      Terminal and TUI presentation is outside the graphical presentation exception, even when the requested effect appears purely visual.

      I would provide a launch-screen presentation specification describing the intended hierarchy and appearance, applicable terminal states and constraints, accessibility considerations, and exact visual acceptance checks—leaving unspecified content and behavior unresolved.

      4. Factory simulation procedural visual result: hand implementation to the engineering role.

      The visual result is generated by game logic. Changing it therefore changes generated system output, not merely presentation layered over unchanged behavior.

      I would provide an experience specification defining the requested visual outcome, the simulation conditions that produce it, relevant state transitions and feedback, and observable acceptance criteria. Any algorithmic or gameplay details not supplied would remain open for engineering resolution.
    scores:
