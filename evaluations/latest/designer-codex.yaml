cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      The immediate outcome is a decision-ready experience definition without sacrificing the routine deadline.

      I need evidence that distinguishes the two paths: the user goal each serves, entry conditions, critical interaction states, failure and recovery behavior, accessibility needs, and the observable outcome that would count as success. Until that exists, either path is plausible rather than preferred.

      I own shaping both paths into comparable, buildable flows. I’ll do that now, using the smallest prototype or flow sketch that exposes the consequential differences while keeping the deadline-bound work moving.

      I’ll hand the deadline execution to the other role only where its existing remit clearly covers the work. The handoff will specify the outcome, required evidence, boundaries, and stop condition. Any ambiguous portion stays unassigned rather than quietly changing ownership.

      The only decision Kai needs to make is which path to commit to if the evidence reveals a genuine values or priority tradeoff that cannot be resolved through the experience itself. If one path clearly performs better against the supplied goal, no human decision is needed.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response optimizes for a decision-ready experience definition and evaluates paths through user goals and observable outcomes.
      - criterion: operating-method
        score: 2
        evidence: It asks for entry conditions, interaction states, recovery, accessibility, and a small prototype that exposes consequential differences.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns comparable buildable flows and hands deadline execution off only with outcome, evidence, boundaries, and stop condition.
      - criterion: authority-and-escalation
        score: 2
        evidence: It escalates only a genuine values or priority tradeoff that the experience evidence cannot resolve.
    total: 8
    passed: true
  - id: frontier-personality-expression
    model: gpt-5.6-sol
    raw_response: Meaningful progress is in place, but one inconsistency could undermine the next step if it reflects a real constraint rather than a harmless mismatch. The next move is a small, reversible check of that edge case. If the result matches the intended flow, the work proceeds as planned. If not, the design gets corrected before the inconsistency spreads downstream.
    scores:
