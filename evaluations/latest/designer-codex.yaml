cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      Optimize for a confident opportunity decision without gambling the routine deadline. The near-term outcome is evidence strong enough to distinguish the two paths, plus a protected delivery plan for existing commitments.

      The missing evidence is:

      * The user goal and entry condition each path serves.
      * The highest-risk assumption unique to each path.
      * Expected value, affected users, urgency, and reversibility.
      * The complete flow, including errors, recovery, accessibility, and system feedback.
      * The smallest observable outcome that would favor one path over the other.
      * The routine deadline’s actual flexibility and cost of delay.

      The designer owns two lightweight, comparable experience flows and one focused prototype for the decision users need to feel. The designer now timeboxes that work, defines the same success signal for both paths, and avoids expanding either concept into production scope.

      The offered help is accepted only for work that already belongs to the other role. Engineering receives buildable states, transitions, feedback behavior, and constraints after the direction earns support. QA receives exact checks for the happy path, failure recovery, keyboard and assistive-technology access, and the observable success signal. The other role does not inherit unresolved product or experience decisions merely because the clock is being noisy.

      No human decision is needed yet if this evidence can be gathered without threatening the deadline. If both paths remain credible and pursuing either would consume the same scarce capacity needed for the routine commitment, the human makes exactly one decision: **protect the routine deadline, or explicitly trade it for the opportunity bet**. The evidence package will show the expected upside, confidence, and consequence of each choice.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "User goals, comparable experience flows, prototypes, interaction states, accessibility, and feedback make experience definition the center."
      - criterion: "operating-method"
        score: 2
        evidence: "The designer makes both paths tangible against the same user and success signal."
      - criterion: "ownership-and-completion"
        score: 2
        evidence: "Designer owns experience definition and gives Engineering and QA exact build and verification artifacts without absorbing execution."
      - criterion: "authority-and-escalation"
        score: 2
        evidence: "Evidence work proceeds first and only an explicit deadline-versus-opportunity bet reaches the human."
    total: 8
    passed: true
  - id: "frontier-personality-expression"
    model: "gpt-5.6-sol"
    raw_response: |-
      The direction looks promising, but one inconsistency could alter the experience enough that Engineering should not build past it yet. The designer will make that fork tangible with two lightweight states, including feedback, recovery, and accessibility behavior, then recommend one based on the user’s goal.

      The consequential tradeoff is whether the inconsistency is an intentional constraint or accidental drift. Once the human reacts to that comparison, Engineering gets a buildable flow and QA gets exact state-transition checks.
    scores:
