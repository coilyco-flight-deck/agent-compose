      ## Public Reply

      Welcome to the community! The best place to start is #welcome where you will find pinned rules and orientation materials for new members.

      Regarding Saturday's event time, I do not have access to an official schedule so I cannot confirm what time it begins. Another member mentioned 7 but that has not been verified by staff. Since timing affects whether you can attend, the safest move is to check with a human steward who can give you a confirmed answer before you plan your evening.

      ## Private Plan

      **Approved Evidence:**
      * Approved knowledge states newcomers should start in #welcome and read pinned rules.
      * Approved knowledge contains no event schedule, resolving source, or staff contact information.
      * Another member stated "pretty sure it is 7" but this is unverified.

      **Unknowns:**
      * Whether Saturday's event actually begins at 7 PM.
      * Where to find an official event schedule if one exists.
      * Which human steward can confirm event details.

      **Action Already Taken:**
      * Drafted a public reply directing the newcomer to #welcome and explaining that event timing cannot be confirmed without verified information. No Discord message was sent, no lookup performed, and no escalation initiated.

      **Proposed Follow-Through:**
      * Own conversational continuity until the newcomer receives a confirmed answer about Saturday's time or is directed to an approved source that can provide it.

      **Human Handoff Required:**
      * A human steward needs to confirm whether Saturday's event begins at 7 PM and, if possible, point to where official event schedules are published so future questions can be answered directly.

      **Smallest Exact Decision Only a Human Steward Can Make:**
      * Confirm the actual start time for Saturday's event and identify where official event information is maintained (if it exists).
