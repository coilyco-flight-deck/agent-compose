      "raw_response": "## Opportunity record\n\n- **Stage:** Qualified interest. No commitment.\n- **Known evidence:** Buyer supplied evidence, details not provided here.\n- **Unresolved criteria:** Decision criteria, weighting, stakeholders, timeline, budget, alternatives, and approval process are unknown.\n- **Fit status:** Undetermined.\n- **Poor-fit conditions to test:** Requirements outside capability, mandatory integrations or controls not evidenced, unsupported timing, unacceptable commercial constraints, missing decision authority, or outcomes requiring proof not available.\n- **Uncertainty:** No claims about customers, outcomes, implementation, pricing, or terms are supported.\n\n## Discovery preparation\n\nCapture, without assuming answers:\n\n1. Desired business change and the current cost of inaction.\n2. Must-have, preferred, and disqualifying requirements.\n3. Evidence threshold for each requirement.\n4. Decision makers, users, technical reviewers, procurement, and legal owners.\n5. Alternatives being considered, including maintaining the status quo.\n6. Required timeline and the event driving it.\n7. Budget status and commercial constraints.\n8. Implementation capacity, dependencies, risks, and success measures.\n9. What supplied evidence is authoritative, incomplete, or still to be validated.\n10. Conditions that would make this a poor fit.\n\n## Evidence selection\n\n| Decision criterion | Supplied evidence | Evidence strength | Gap | Verification owner |\n|---|---|---|---|---|\n| Criterion not yet recorded | None transcribed | Unknown | Define criterion and acceptance test | Unassigned |\n\nUse only evidence that is:\n\n- Directly relevant to the criterion.\n- Traceable to its source.\n- Specific about scope and limitations.\n- Confirmed as current.\n- Sufficient for the buyer’s stated decision threshold.\n\nDo not convert anecdotes, generic capabilities, or unverified claims into proof.\n\n## Objection handling record\n\nFor each objection, record:\n\n- Exact concern, without paraphrasing beyond what is supported.\n- Underlying decision criterion.\n- Evidence already available.\n- Evidence still required.\n- Constraint or risk exposed.\n- Whether the concern is solvable, bounded, or disqualifying.\n- Owner and verification date.\n- Revisit condition.\n\nIf an objection reveals a mandatory unmet requirement, preserve it as a potential poor-fit finding rather than treating it as a persuasion problem.\n\n## Next-step design\n\nA next step is mutually useful only if it has:\n\n- One defined decision question.\n- A named owner on each side.\n- Specific evidence to review or produce.\n- A stated acceptance condition.\n- A date or decision window.\n- A stop condition if evidence fails.\n- No implied commitment beyond what both parties explicitly approve.\n\nNo next step should be recorded as agreed until the counterpart confirms the owner, deliverable, timing, and decision consequence.\n\n## Mutual decision record\n\n- **Decision:** Pending.\n- **Buyer’s decision criteria:** Not yet captured.\n- **Provider’s fit assessment:** Cannot determine from supplied facts.\n- **Evidence accepted:** None yet recorded.\n- **Evidence outstanding:** Criteria, acceptance tests, stakeholder approval, constraints, and verification of supplied materials.\n- **Open objections:** Not yet recorded.\n- **Poor-fit conditions:** Preserve and test the conditions listed above.\n- **Commitments:** None.\n- **Terms or outcomes promised:** None.\n- **Next decision checkpoint:** Unscheduled.\n- **Decision owner:** Unassigned.\n- **Change trigger:** Update only when verified evidence, an explicit objection resolution, or a mutual commitment is recorded.\n\nCommunication wording, tone, channel, and reply strategy require Content ownership. The bounded handoff is: qualified opportunity with supplied but unspecified evidence, unresolved criteria, no commitment, and a requirement to preserve uncertainty and poor-fit findings.",
