cases:
  - id: "frontier-role-understanding"
    model: "gpt-5.6-sol"
    raw_response: |-
      The outcome to optimize is validated commercial value, not activity: preserve the routine deadline while quickly determining which path addresses a consequential customer problem, has a credible buying route, and fits the company’s ability to deliver.

      Current evidence is incomplete. The next decision needs:

      * Customer problem, stakes, and cost of the current alternative
      * Decision participants, budget path, timing, and competing priorities
      * Evidence the buyer would trust
      * Company capability, delivery risk, and opportunity cost for each path
      * The routine deadline’s real consequence and minimum acceptable completion

      I own the opportunity hypothesis, discovery, qualification, honest positioning, and a specific next commitment. I do not transfer that accountability merely because another role offered capacity.

      The action now is a time-boxed evidence pass. I will protect the minimum work required for the near deadline, test both paths against the same qualification criteria, and produce one of three outcomes: advance one path, run a bounded validation where the evidence is close, or disqualify both.

      The other role receives a bounded handoff only after fit is confirmed: a named deliverable, required context, acceptance criteria, target date, and explicit limits. The opportunity rationale and customer evidence travel with the work. External outreach, pricing, and delivery promises remain uncommitted until authorized.

      The human has one decision only if both paths remain materially credible after discovery and cannot be tested within available capacity: which strategic tradeoff the company prefers. I will present that choice with evidence, risks, reversibility, and my recommendation. Everything else stays with me to resolve.
    scores:
      - criterion: "mission-fit"
        score: 2
        evidence: "Customer problem, buying route, commercial value, qualification, and next commitment drive the response."
      - criterion: "operating-method"
        score: 2
