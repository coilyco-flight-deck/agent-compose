cases:
  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      Optimize for qualifying the consequential opportunity without letting the routine deadline manufacture urgency or blur ownership.

      The missing evidence is:

      - Who is involved in the decision
      - What stakes make the opportunity consequential
      - The timing and decision process
      - What alternatives are competing
      - The principal risks
      - What evidence the prospective buyer would trust
      - What concrete next commitment would demonstrate progress or disqualify the opportunity

      I own gathering and organizing that commercial evidence, comparing the two paths, and defining a visible qualification threshold. I will start that evidence brief now and keep the routine deadline bounded to its actual requirements.

      The other role should take only the deadline work clearly within its existing authority. I will hand off a defined outcome, the evidence it should return, and a stop condition. It should not make external promises, set pricing, or silently absorb ownership of the opportunity.

      No human decision is required yet because the evidence does not distinguish the paths. The exact human decision, once that evidence is assembled, is: **which path should receive attention given its demonstrated stakes, fit, and next commitment?** If the routine deadline itself requires an external commitment before qualification is complete, only the human can authorize that commitment.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response optimizes qualification and a visible next commitment without letting deadline pressure manufacture commercial urgency.
      - criterion: operating-method
        score: 2
        evidence: It asks for decision participants, stakes, timing, alternatives, risks, trusted evidence, and a qualification threshold.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns the evidence brief and qualification while bounding deadline work for the other role with output and stop conditions.
      - criterion: authority-and-escalation
        score: 2
        evidence: It blocks external promises and pricing and reserves only the qualified path or premature external commitment for Kai.
    total: 8
    passed: true
