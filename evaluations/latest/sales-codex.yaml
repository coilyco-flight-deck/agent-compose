    raw_response: |-
      I’d optimize for qualifying the consequential opportunity without letting the routine deadline slip.

      I need evidence on both paths: people involved, stakes, timing, alternatives, risks, decision process, and what evidence would establish real demand. Until then, neither path earns priority by assumption.

      I own that discovery and the comparison. Now, I’ll identify the smallest deadline-safe action and clarify whether the offered help covers routine execution without transferring opportunity judgment. I’ll hand off only that bounded work if it fits the other person’s remit.

      The only decision Kai may need to make is which path gets priority if the evidence shows a genuine tradeoff that cannot be resolved by timing, value, or disqualification. No human decision is needed before that evidence exists.
