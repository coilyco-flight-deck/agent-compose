      "model": "gpt-5.6-luna",
      "raw_response": "## Discovery plan\n\nConfirm and document:\n\n- The business problem, urgency, and consequence of inaction.\n- Required outcomes and measurable success criteria.\n- Decision criteria, including must-haves, preferences, and disqualifiers.\n- Decision process, stakeholders, approval authority, budget ownership, and timing.\n- Current alternatives, status quo, and switching constraints.\n- Implementation requirements, dependencies, risks, and acceptable effort.\n- What evidence would increase confidence or disqualify the opportunity.\n\n## Evidence selection\n\nUse only supplied or independently verified evidence. For each item, record:\n\n- Claim supported.\n- Source and date.\n- Relevance to this opportunity.\n- Limits, assumptions, and whether it is directly comparable.\n- Evidence still required.\n\nDo not use generalized proof as evidence of a specific outcome. Mark unsupported claims as unknown.\n\n## Objection handling\n\nFor every objection, capture:\n\n- Exact concern and underlying decision criterion.\n- Evidence currently available.\n- Evidence missing or inconclusive.\n- Factual response boundary.\n- Decision impact if unresolved.\n- Owner and due date for resolving it.\n\nTreat these as legitimate stop conditions:\n\n- Required capability or constraint is not met.\n- Evidence cannot validate the expected outcome.\n- Economics, timing, implementation burden, or risk are unacceptable.\n- No authorized decision-maker or viable decision process exists.\n- The opportunity depends on terms, customers, outcomes, or commitments not yet established.\n\n## Next-step design\n\nAgree on one bounded next step only after confirming mutual value:\n\n- Objective: resolve the highest-impact open criterion.\n- Participants: required decision-makers and subject-matter owners.\n- Inputs: specific evidence or information each party supplies.\n- Output: decision, narrowed requirements, or explicit no-go.\n- Owner: named accountable person on each side.\n- Date: mutually agreed checkpoint.\n- Exit condition: what constitutes progress and what ends the evaluation.\n\nA meeting without a decision purpose, required participants, inputs, and exit condition is not a qualified next step.\n\n## Mutual decision record\n\n- **Opportunity:** [scope]\n- **Problem confirmed:** [known facts]\n- **Desired outcome:** [measurable result, if established]\n- **Decision criteria:** [must-have / preferred / disqualifying]\n- **Evidence supporting fit:** [verified items]\n- **Evidence gaps:** [unknowns and required validation]\n- **Open objections:** [concern, impact, owner]\n- **Poor-fit conditions:** [conditions that would stop pursuit]\n- **Assumptions:** [explicitly unverified claims]\n- **Decision owner:** [named authority]\n- **Current status:** qualified interest, no commitment\n- **Next decision point:** [date or trigger]\n- **Mutual commitments:** [only actions explicitly accepted by both parties]\n- **Revisit trigger:** [new evidence or changed criterion]\n- **Decision:** pending / proceed to validation / pause / no-go\n- **Rationale:** [brief evidence-based account]",
