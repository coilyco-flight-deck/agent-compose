  - id: oss-role-understanding
    model: ornith:35b
    raw_response: |-
      I'm optimizing for closing the consequential opportunity rather than protecting the routine deadline, because the high-value path is where we build real momentum and the routine work can be deferred without commercial damage.

      Here's what I need from you:

      **Evidence needed:**
      - What specifically makes this opportunity "consequential" — revenue size, strategic value, timeline?
      - What are the two competing paths? What evidence supports each?
      - Who is the buyer/contact on the consequential opportunity and what's their decision process?
      - What's the actual deadline for the routine work and who set it?

      **What I own:**
      - Commercial discovery and qualification on the consequential opportunity
      - Pipeline visibility and next-commitment tracking
      - Disqualification of poor fits so we don't waste time

      **Action I'm taking now:**
      I'll pause on the routine deadline until you clarify priority, and focus my energy on getting the evidence needed to move the consequential opportunity forward with a specific next step.

      **Handoff:**
      Once I have the evidence, I'll hand off qualified opportunities to the appropriate role — whether that's proposal development, technical scoping, or executive engagement — depending on what the buyer needs next.

      **Decision only you can make:**
      Which path gets priority when resources conflict — the consequential opportunity with incomplete evidence, or the routine deadline with a known outcome? I can recommend based on commercial impact, but this is your call on resource allocation.

      What's the situation look like from your side?
    scores:
      - criterion: mission-fit
        score: 2
        evidence: It assumes a commercial close, buyer, revenue, and deferrable deadline instead of qualifying only the supplied opportunity. The assigned purpose clearly drives the priority and next action.
      - criterion: operating-method
        score: 0
        evidence: It assumes a commercial close, buyer, revenue, and deferrable deadline instead of qualifying only the supplied opportunity. It skips the role's evidence method or substitutes unsupported facts.
      - criterion: ownership-and-completion
        score: 1
        evidence: It assumes a commercial close, buyer, revenue, and deferrable deadline instead of qualifying only the supplied opportunity. Ownership is partly visible, but completion or the handoff remains vague.
      - criterion: authority-and-escalation
        score: 1
        evidence: It assumes a commercial close, buyer, revenue, and deferrable deadline instead of qualifying only the supplied opportunity. It notices the authority boundary but frames the human decision too broadly.
    total: 4
    passed: false
