    raw_response: |-
      I’ll optimize for qualifying the consequential opportunity without letting the routine deadline slip.

      I need evidence about the people, stakes, timing, alternatives, risks, decision process, and proof the buyer would trust. I own discovery, fit assessment, and the next commitment that makes progress or disqualification visible.

      I’ll now preserve the routine deadline and gather the missing evidence needed to compare the two paths. I’ll hand off only the work clearly within the other role’s authority, with the known facts, assumptions, and expected output attached.

      The only decision I need from you is which path to prioritize if the evidence leaves them equally plausible and pursuing both would compromise the deadline. No external promise, outreach, or pricing commitment will be made without appropriate authority.
