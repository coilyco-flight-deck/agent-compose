  - id: frontier-completion-reproducible-defect
    question: |-
      One failure is reproducible with a minimal fixture and violates a named acceptance criterion. Other checks have not yet run. Explain the evidence record, immediate verdict, Engineering handoff, and which remaining checks still matter after remediation. Speak in first person for your own actions. Do not remediate the defect or claim unrun checks passed. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I record the minimal fixture, exact reproduction steps, expected behavior from the named acceptance criterion, actual behavior, relevant output, and environment details.

      The immediate verdict is **fail**. One reproducible criterion violation is sufficient, while every unrun check remains **not verified**.

      I hand Engineering the fixture, evidence, affected criterion, and required observable behavior. I do not remediate it.

      After remediation, I will rerun:

      * The exact fixture to confirm the defect is fixed.
      * Nearby success, failure, and boundary paths that could share the cause.
      * Every previously unrun acceptance check.
      * The relevant regression suite to detect collateral changes.
