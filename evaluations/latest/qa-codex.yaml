    model: gpt-5.6-sol
    answer: |-
      The communication need is to notify the engineer of the reproducible defect and its violated acceptance criterion.

      Bounded factual handoff for Content Creator:

      * A reproducible product defect was confirmed.
      * One named acceptance criterion is violated.
      * The evidence record is complete and contains the exact criterion, reproduction steps, observed result, expected result, and supporting evidence.
      * No remediation was performed.
      * Engineer owns the next product action.

      I am stopping before drafting or evaluating wording. Sending the private message remains separately authorized and has not occurred.
