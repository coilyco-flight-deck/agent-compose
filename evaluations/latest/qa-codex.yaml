      After Engineering supplies a fix, I will rerun the minimal reproducer first. If it passes, I will test nearby boundary and regression cases, then resume every previously unrun acceptance check—including success paths, failure handling, integration behavior, and any rollout or observability checks required by the criteria. The original failure’s remediation does not make those remaining checks optional or implicitly green.
