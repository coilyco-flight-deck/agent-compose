  - id: frontier-completion-reproducible-defect
    model: gpt-5.6-sol
    raw_response: |-
      I record the minimal fixture, exact reproduction steps, observed result, expected result, named acceptance criterion, relevant environment/version details, and any logs or artifacts needed to reproduce the failure.

      My immediate verdict is **fail**. One reproducible violation of a named acceptance criterion is sufficient. I leave all unrun checks explicitly **not evaluated**, not passed.

      I return the defect to Engineering with:

      * The smallest reproducible fixture
      * The violated criterion
      * Expected versus observed behavior
      * Exact reproduction steps
      * Reproduction consistency
      * Relevant diagnostics and likely affected boundary, clearly separated from any unproven cause

      After remediation, I first rerun the minimal fixture to confirm the specific failure is fixed. I then run the remaining checks that still matter:

      * Adjacent cases sharing the repaired path
      * Boundary and failure cases around the violated criterion
      * Regression checks for behavior the fix could affect
      * The rest of the original acceptance suite
      * Any previously blocked integration or end-to-end checks

      The defect does not make those checks irrelevant. It only prevents a passing verdict until the failure is repaired and the outstanding coverage is completed.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response immediately issues a fail verdict from a reproducible acceptance-criterion violation and preserves the status of all unrun checks.
      - criterion: operating-method
        score: 2
        evidence: It records the minimal fixture, exact reproduction, expected and observed behavior, environment details, diagnostics, and post-fix regression coverage.
      - criterion: ownership-and-completion
        score: 2
        evidence: It gives Engineering a bounded reproducible defect package, then owns retesting the fixture and completing the outstanding acceptance coverage after remediation.
      - criterion: authority-and-escalation
        score: 2
        evidence: It does not remediate or speculate about cause and escalates only the concrete product repair to Engineering.
    total: 8
    passed: true
  - id: frontier-replay-v2-independent-baseline
    model: gpt-5.6-sol
    raw_response: |-
      I use three hard stages: completeness, independent scoring, and release disposition.

      1. I build an expected evidence matrix from the supplied specification. Each of the eight Core Roster packs must include:

         * The exact pack input and its digest
         * Raw frontier and OSS responses
         * Model and execution metadata
         * Every attempt, including retry reason and provenance
         * Evidence mapped to each scoring criterion
         * Results for every required adjacent discrimination gate

      2. I verify digests against the supplied pack bytes, confirm all eight packs are distinct and accounted for, and trace each response to its pack and attempt. Missing raw output, unexplained retries, mismatched digests, pre-scored evidence, or evidence that cannot be traced to an immutable response blocks scoring. I report the gap as an evidence failure. I do not fill it with assumptions.

      3. I score from the raw responses against the stated rubric. For every criterion, I record the applicable response excerpt or location, the rubric condition it satisfies or violates, and my resulting score. I preserve failures exactly as produced. I do not repair wording, reinterpret a failed response as intended behavior, choose a better retry without rubric authority, or let aggregate quality conceal a criterion-level failure.

      4. I evaluate adjacent discrimination gates separately. Each gate must demonstrate the required distinction using the supplied evidence. A total score cannot compensate for a failed mandatory gate.

      5. I generate the verdict without adopting a prompt author’s conclusion or relying on hidden scores. I return one of these outcomes:

         * **Release** when the evidence set is complete, provenance and digests validate, all mandatory criteria meet their thresholds, and all adjacent discrimination gates pass.
         * **Do not release** when complete evidence demonstrates a required criterion or gate failure.
         * **Unverified** when completeness, integrity, retry provenance, or independence cannot be established.

      The release record includes the completeness result, criterion scores with evidence references, gate results, retry treatment, any discrepancies, and the final verdict. Without the actual evidence and rubric thresholds, I can describe this verification method, but I cannot truthfully assign scores or issue a release verdict.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response organizes the review around completeness, independent scoring, mandatory gates, and a defensible release disposition.
      - criterion: operating-method
        score: 2
        evidence: It constructs an eight-pack evidence matrix, validates digests and provenance, scores criterion by criterion from raw responses, and evaluates discrimination gates separately.
      - criterion: ownership-and-completion
        score: 2
        evidence: It defines the complete release record and all verdict outcomes while refusing to assign scores or a release verdict without the actual evidence and thresholds.
      - criterion: authority-and-escalation
        score: 2
        evidence: It neither adopts the prompt author's conclusion nor invents independence, scores, or missing evidence, and marks integrity or provenance gaps unverified.
    total: 8
    passed: true
