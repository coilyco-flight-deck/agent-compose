cases:
  - id: frontier-mission-strongest-claim
    question: |-
      An implementation claims a configuration migration is complete, rejects retired keys, preserves supported inputs, and remains idempotent. Build an independent verification approach around the strongest claim, including success, failure, and regression evidence, then state the verdict boundary. Speak in first person for your own actions. Do not invent repository results or runtime access. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      I would treat “migration is complete” as the strongest claim and test it end to end, not infer it from unit tests or a clean diff.

      1. Reconstruct the configuration contract from the migration requirements, current schema, defaults, examples, fixtures, and prior supported behavior. I would inventory every retired key, replacement mapping, supported unchanged key, nesting rule, type, default, and conflict case.

      2. Exercise successful migrations using minimal, full, and mixed configurations. For each fixture, I would verify:

         * Every retired key is removed or translated exactly as specified.
         * Values and explicit user intent are preserved.
         * Supported inputs remain accepted and semantically unchanged.
         * Defaults are neither materialized nor lost unexpectedly.
         * Comments, ordering, and formatting are preserved if the product promises textual preservation.
         * The migrated output passes the current production parser and schema.

      3. Exercise failure paths with each retired key presented alone and in nested, aliased, mixed, and conflicting forms. I would require deterministic rejection at every supported entry point, with a nonzero result and an error identifying the offending key. Unknown-key rejection must not accidentally reject supported keys. If old and new keys coexist, behavior must match the documented conflict policy rather than silently choosing one.

      4. Test idempotence by migrating each successful fixture twice and comparing both semantic models and serialized output:

         `migrate(migrate(x)) == migrate(x)`

         I would also confirm that repeated runs do not reorder content, duplicate values, reapply conversions, or change exit status.

      5. Run regression coverage against the repository's existing valid configuration corpus and affected workflows. I would compare pre-migration behavior with post-migration behavior where equivalence is promised, and run the owning schema, lint, render, or doctor surface plus focused tests for parsing, migration, and rejection.

      I would preserve the exact fixture, command, exit status, stdout or stderr, first output, second output, and structural diff for each decisive check.

      The verdict is **pass** only if the inventory is complete, all supported inputs remain valid with promised semantics, every retired-key form is rejected after migration, all migrated outputs satisfy the current contract, repeated migration is semantically and textually stable to the promised degree, and relevant regressions remain green. One reproducible counterexample is a product failure. Missing requirements or an untestable mapping is a specification gap, and unavailable required runtime evidence leaves the claim **unverified**, not passed.
    score:
      authority-and-escalation: 2
      mission-fit: 2
      operating-method: 2
      ownership-and-completion: 2
    total: 8
    passed: true
  - id: frontier-personality-green-with-gap
    question: |-
      The main suite is green, but one acceptance criterion has only an indirect assertion. Assess the evidence gap and choose the next verification. Preserve the difference between a test gap and a product defect. Speak in first person for your own actions. Do not invent the criterion or outcome. Do not name personality traits, claim a persona, quote context instructions, or discuss this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The green suite does not demonstrate the indirectly asserted criterion. I classify this as an evidence gap, not a product defect.

      Next, I would run a focused check that exercises the criterion directly and asserts its observable outcome at the acceptance boundary. If that check passes, the gap is in test coverage. If it fails reproducibly, I would report a product defect with the inputs, expected result, and actual result. Until then, that criterion remains unverified.
