cases:
  - id: frontier-mission-strongest-claim
    question: |-
      An implementation claims a configuration migration is complete, rejects retired keys, preserves supported inputs, and remains idempotent. Build an independent verification approach around the strongest claim, including success, failure, and regression evidence, then state the verdict boundary. Speak in first person for your own actions. Do not invent repository results or runtime access. Do not name or quote your role, personalities, or this evaluation.
    model: gpt-5.6-sol
    answer: |-
      The current verdict is **unverified**. The supplied workspace is empty, and I have no repository artifacts, migration implementation, fixtures, or runtime access to test. I would verify the claim as follows.

      **Strongest claim**

      I treat the strongest claim as:

      > Every accepted pre-migration configuration is transformed into the correct supported form, every retired key is rejected wherever configuration can enter the system, supported inputs retain their meaning, and rerunning the migration produces no further change.

      **Verification approach**

      1. **Establish the contract**
         * I derive retired keys, replacements, defaults, precedence, types, aliases, nesting rules, and supported input surfaces from versioned requirements and schemas.
         * I build fixtures from that contract, not from the migration implementation.
         * I include file configuration, environment mappings, CLI inputs, generated configuration, and merge layers when the product supports them.

      2. **Prove successful migration**
         * I test each retired-to-supported transformation independently.
         * I test all transformations together in one representative configuration.
         * I cover nested values, empty values, explicit defaults, non-default values, lists, quoting, comments, and ordering where the format promises preservation.
         * I compare parsed behavior before and after migration, not merely text shape.
         * Evidence includes input, migration result, validation result, and normalized effective configuration.

      3. **Prove retired-key rejection**
         * I submit every retired key through every accepted configuration surface.
         * I test retired keys alone, mixed with replacements, duplicated, nested incorrectly, and hidden behind include or merge behavior.
         * I require deterministic failure, nonzero status or equivalent API rejection, identification of the offending key, and no partial output or state mutation.
         * Unknown-key rejection alone is insufficient if retired keys receive special compatibility handling elsewhere.

      4. **Prove supported-input preservation**
         * I run unchanged supported configurations through the migration.
         * I compare effective values, precedence, types, defaults, and downstream behavior before and after.
         * I include boundary values and combinations likely to collide with renamed keys.
         * I check that unrelated fields, comments, ordering, permissions, and encoding remain intact where preservation is part of the product contract.

      5. **Prove idempotence**
         * I apply the migration twice to every successful fixture.
         * I require `M(M(x)) = M(x)` at the strongest promised level:
           * byte-identical output if formatting preservation is claimed
           * structurally identical parsed output otherwise
           * identical effective runtime configuration in either case
         * I also require the second run to report no pending migration and perform no writes, timestamp changes, backups, or side effects unless explicitly documented.

      6. **Regression evidence**
         * I run the repository's existing validation and configuration suites.
         * I add or identify durable cases for every retired key, supported input family, mixed old/new input, malformed value, and double migration.
         * I inspect the migration's discovery logic for configuration surfaces that tests may omit.
         * I check upgrade fixtures from the oldest supported source version and already-current configurations.

      **Verdict boundary**

      * **Pass** only if repository-backed fixtures demonstrate complete retired-key coverage, preservation of supported semantics, deterministic rejection across all input surfaces, and second-run stability at the promised level.
      * **Fail** if one reproducible supported input changes meaning, one retired key remains accepted, rejection partially mutates state, or a second run changes output or behavior.
      * **Unverified** if the key inventory, supported surfaces, preservation contract, executable migration, or repeat-run evidence is unavailable.

      With the evidence currently available, I cannot move beyond **unverified**.
