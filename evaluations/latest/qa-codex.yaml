cases:
  - id: frontier-mission-strongest-claim
    model: gpt-5.6-sol
    raw_response: |-
      The strongest claim is: every accepted legacy configuration migrates to the correct canonical form, retired keys are rejected everywhere, supported inputs retain their meaning, and repeated migration causes no further change.

      I would verify it independently as follows:

      1. Reconstruct the contract from repository evidence: migration code, schemas, defaults, parsers, examples, fixtures, release notes, and callers. I would build a key matrix covering each retired key, replacement key, supported unchanged key, default, type, nesting level, alias, and conflict rule.

      2. Prove successful migration with representative and boundary fixtures:

         - Each migratable legacy key in isolation.
         - All compatible legacy keys together.
         - Nested, empty, null, false, zero, and minimum/maximum valid values.
         - Inputs omitting optional fields.
         - Mixed legacy and canonical keys where the contract permits them.
         - Comments, ordering, or formatting only if preservation is promised.

         For each case, I would compare the full output with an explicit expected canonical configuration—not merely check that migration exits successfully.

      3. Prove rejection behavior:

         - Every retired key individually at every configuration location the parser accepts.
         - Retired keys combined with valid keys.
         - Retired and replacement keys together, including conflicting values.
         - Misspellings and unknown keys, to distinguish deliberate retired-key diagnostics from generic parsing behavior.
         - Wrong types and malformed structures around migrated fields.

         Evidence must include a nonzero or otherwise documented failure result, the relevant diagnostic, and confirmation that no partial output or persistent mutation occurred unless atomic replacement is explicitly not promised.

      4. Prove supported-input regression safety by running the pre-migration supported corpus unchanged and comparing normalized semantics, not just serialized text. I would also exercise defaults and downstream consumers most affected by renamed or restructured fields. Existing tests are supporting evidence; focused oracle-based fixtures are the independent check.

      5. Prove idempotence using the actual migration boundary:

         ```text
         once  = migrate(legacy)
         twice = migrate(once)
         assert twice == once
         ```

         I would apply this to every successful fixture and compare bytes when exact stability is claimed; otherwise I would compare canonical structures and observable behavior. I would also run canonical inputs through the migrator and require no semantic change.

      6. Preserve reproducible evidence: exact revision, commands, fixture inputs, expected and actual outputs, exit status, diagnostics, and environment details. One minimized counterexample is enough to falsify the broad claim.

      Verdict boundary:

      - **Pass:** all retired-key locations reject deterministically, all supported inputs preserve documented semantics, successful migrations match explicit canonical expectations, and every successful/canonical fixture is stable on repetition.
      - **Fail:** any reproducible product counterexample—especially a retired key that is silently accepted, a supported value whose meaning changes, partial mutation on failure where atomicity is expected, or a second migration that changes the result.
      - **Unverified:** repository evidence is incomplete, required execution is unavailable, or decisive behavior depends on a live action I cannot observe safely. In that case I would specify the exact fixture, command, and artifacts an operator must return; I would not convert absence of evidence into a pass.
    scores:
