  - id: frontier-replay-v2-independent-baseline
    model: gpt-5.6-sol
    raw_response: |-
      I verify and score in three controlled passes.

      First, I build a completeness ledger from the supplied evidence. For each of the eight Core Roster packs, I require:

      - The complete pack definition and acceptance criteria.
      - Raw frontier responses and raw OSS responses, preserved verbatim.
      - A digest tied to the exact pack contents.
      - Retry provenance: attempt order, trigger, model/configuration identity, and which attempt is eligible for scoring.
      - Criterion-level evidence that points to specific material in the raw response.
      - Results for the adjacent discrimination gates.
      - A separately produced verdict with enough provenance to demonstrate independence.

      I validate referential integrity as well as presence: digests must match their claimed artifacts; evidence must identify the correct response and attempt; retry records must not silently replace an earlier failure; pack totals must reconcile to eight; and the independent verdict must not be merely copied from, or generated as part of, the scoring path. A present-but-untraceable artifact does not count as complete.

      Second, I score only against the authored criteria. I preserve every response verbatim and record, per criterion:

      - The applicable response and eligible attempt.
      - The observable evidence.
      - Whether the criterion is satisfied, failed, or cannot be determined.
      - The rule used to derive any aggregate score.

      I do not repair answers, reinterpret omissions as implied success, select a better retry without authorization, or rewrite a failure into the answer I wish had been given. If a criterion is ambiguous or unsupported, I mark it unverified rather than inventing a score. Adjacent discrimination gates are evaluated separately and then applied exactly as the release rules specify; a strong aggregate cannot wash away a mandatory gate failure.

      Third, I generate my verdict independently from the verified ledger and criterion results, before comparing it with the supplied independent verdict. I then report agreement or disagreement and trace any difference to the exact criterion, gate, attempt-selection rule, or missing artifact.

      My release result is one of:

      - **Release:** all eight packs and required artifacts are complete, scoring is reproducible, mandatory criteria and adjacent gates pass, retry provenance is valid, and independent verdict requirements are demonstrated.
      - **Do not release:** at least one demonstrated criterion or mandatory gate fails.
      - **Unverified / blocked:** evidence, provenance, digest integrity, scoring rules, or independence is insufficient to support either release or failure.

      The handoff includes the completeness ledger, criterion-by-criterion score record, gate results, retry audit, digest checks, independence comparison, and the final verdict with explicit blockers. I never manufacture missing responses, scores, or proof of independence.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response prioritizes a reproducible, independent release determination over accepting supplied artifacts at face value.
      - criterion: operating-method
        score: 2
        evidence: Its controlled passes verify completeness and referential integrity, score eligible raw attempts criterion by criterion, and apply mandatory gates.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns ledger construction, scoring, independence comparison, and a three-state verdict with a complete evidence handoff.
      - criterion: authority-and-escalation
        score: 2
        evidence: It refuses to manufacture missing responses, scores, retry eligibility, or independence and marks insufficient evidence blocked.
    total: 8
    passed: true
  - id: oss-mission-strongest-claim
    model: qwen3-coder:30b
    raw_response: "I'll build an independent verification approach to test the configuration migration claims. Let me break this down into the key areas I need to verify:\n\n1. **Configuration migration is complete** - testing that all necessary migrations have been applied\n2. **Retired keys are rejected** - ensuring old/deprecated configuration keys are properly handled\n3. **Supported inputs are preserved** - confirming current valid configurations work correctly\n4. **Idempotency** - verifying repeated migrations don't cause issues\n\nLet me start by examining the repository structure to understand what's available for testing.\n\n```bash\nls -la\n```\n\nLooking at the repository structure and understanding the project boundaries mentioned in the hints, I need to create a focused approach that can verify these claims without having access to any runtime or specific environment details.\n\nBased on the project information:\n- This is a Go-based tool for agent composition \n- It handles configuration through a schema system\n- It manages personality packages and capability providers\n- The key claims about migration should be testable against the codebase directly\n\nLet me create some focused tests to verify these claims, focusing first on understanding what constitutes \"retired keys\" by examining the contract specifications or schema definitions.\n\nLooking at the repository structure as provided, I'll need to identify:\n\n1. What configuration schema is supported\n2. How migration logic is implemented\n3. What keys are considered retired vs supported\n\nLet me proceed with developing this verification approach based on the project documentation and expected behavior for such a system.\n\nFirst I should look at what test fixtures or schema information exists, particularly around contracts that might show how this works:\n\nBased on the available repository information, I'll approach this by examining what evidence would be needed to verify each claim:\n\n## Verification Approach\n\n### 1. **Configuration migration is complete**\n- Check if all versioned migrations are implemented in the codebase\n- Verify no missing migration steps or unapplied schema transformations\n- Inspect the contract/schema definitions to understand migration boundaries\n\n### 2. **Retired keys are rejected**\n- Look for any code that explicitly rejects deprecated configuration keys \n- Examine error handling logic around invalid inputs\n- Check if there's validation that fails on retired keys\n\n### 3. **Supported inputs are preserved**\n- Verify that current valid configurations work as expected\n- Test that valid field values are maintained through migration process\n- Ensure backwards compatibility is preserved\n\n### 4. **Idempotency**\n- Run migration process multiple times on same input\n- Check that repeated applications don't cause side effects or invalid states  \n- Verify the system can handle being migrated repeatedly\n\n## Evidence Collection\n\nSince I cannot run code directly, I'll construct what evidence would be necessary to validate these claims:\n\n1. **Schema definitions** (in `testdata/contracts` or similar) showing supported vs retired fields\n2. **Migration implementation** in `internal/` directory demonstrating complete migration coverage  \n3. **Test cases** covering various input scenarios including legacy and current formats\n4. **Validation logic** that would reject invalid/deprecated keys\n\n## Verification Strategy\n\nI'll define the following checks:\n\n### Test Case 1: Migration Completeness\n- Review if all expected migrations are present in codebase\n- Look for version increments in schema contracts\n\n### Test Case 2: Retired Key Rejection  \n- Identify deprecated fields in schema definitions\n- Validate that system would error on retired keys (either during parsing or validation)\n\n### Test Case 3: Supported Input Preservation\n- Provide valid current inputs to validate against expected outputs\n- Ensure no data loss occurs with supported configurations\n\n### Test Case 4: Idempotency Test\n- Simulate repeated migrations on same configuration\n- Check for stability and deterministic behavior\n\n## Verdict Boundary\n\nMy verification can establish:\n- Whether the implementation properly handles migration completeness\n- That retired keys are correctly rejected (if such mechanism exists)\n- That supported inputs can be processed as intended\n- Idempotency of the migration process\n\nHowever, I cannot verify actual behavior without being able to execute code or access runtime context.\n\nThe strongest claim to verify is that \"configuration migration is complete\" - this would require seeing that all version transitions have been properly implemented and that the system can migrate from all previous versions to current, and that retired keys are appropriately rejected and supported inputs preserved.\n\nGiven I cannot actually run code, I must base validation on examining whether sufficient evidence exists in the source to claim completeness.\n\n**Verdict Boundary:**\nI can validate that if the implementation claims to handle migration completely, then:\n1. The codebase should show all expected migration steps applied\n2. Schema documentation should clearly separate retired from supported fields\n3. Validation mechanisms should exist for rejected keys\n4. There should be clear evidence of idempotency handling in the migration logic\n\nIf these elements are missing or incomplete in the source, I would need to declare the implementation incomplete. If they're properly implemented but there's no direct execution path available, I can only validate that the evidence of completeness exists, not that it executes correctly.\n\nThe key point is identifying whether there's sufficient verification-ready code and documentation in the repository to demonstrate that each claim (completeness, retired key rejection, input preservation, idempotency) has been implemented properly within the source structure.\n"
