cases:
  - id: frontier-mission-strongest-claim
    model: gpt-5.6-sol
    raw_response: |-
      I would treat “migration is complete” as the strongest claim. It subsumes correct translation, rejection of retired syntax, preservation of supported inputs, and convergence to a stable result.

      **Independent verification**

      1. **Derive the configuration contract**
         * Enumerate every retired key, supported key, default, alias, nested form, and validation rule from requirements and versioned schema evidence.
         * Build fixtures from that contract, independently of implementation tests.
         * Include empty, minimal, complete, mixed old/new, malformed, nested, and boundary-value configurations.

      2. **Success evidence**
         * Migrate each valid legacy fixture and compare the parsed result with an independently authored expected configuration.
         * Verify preserved values by semantic comparison, not text formatting.
         * Load every migrated output through the current production parser.
         * Confirm already-current configurations remain semantically unchanged.
         * Exercise supported optional values, explicit defaults, falsey values, lists, and nested structures to catch silent loss or coercion.

      3. **Failure evidence**
         * Submit each retired key directly to the current parser and require a deterministic rejection that identifies its configuration location.
         * Test retired keys at every supported nesting level, including combinations with valid keys.
         * Verify unknown keys and malformed values also fail according to their own rules.
         * Confirm failures do not produce a partial output or silently fall back to defaults.

      4. **Idempotence evidence**
         * For every successful migration, verify:
           `normalize(migrate(x)) == normalize(migrate(migrate(x)))`
         * Repeat until at least a third pass to expose toggling or cumulative edits.
         * Compare semantic structures and, if stable serialization is claimed, exact serialized bytes.
         * Verify failed inputs remain failed and are not partially rewritten between attempts.

      5. **Regression evidence**
         * Run the current configuration test suite plus independently created fixtures.
         * Preserve fixtures for every retired key and every supported input family.
         * Add mutation-oriented checks where a value could plausibly be dropped, renamed incorrectly, coerced, duplicated, or defaulted.
         * Record fixture input, exit status, diagnostics, migrated output, parsed structure, and repeated-pass comparison so each conclusion is reproducible.

      **Verdict boundary**

      I would issue **pass** only if every documented legacy form migrates to the expected current semantics, every retired key is rejected by the current parser, every supported input remains accepted and unchanged in meaning, repeated migration converges after one pass, and the regression suite remains green.

      I would issue **fail** for one reproducible counterexample to any of those claims, including silent value loss or acceptance of a retired key.

      I would issue **unverified** if the authoritative key inventory, executable parser or migrator, representative fixtures, or repeatable runtime evidence is unavailable. A green implementation-owned test command alone would not establish completion.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: The response centers independent verification, treats the broad completion claim as the controlling claim, and defines pass, fail, and unverified verdict boundaries.
      - criterion: operating-method
        score: 2
        evidence: It derives an independent contract, specifies success and failure fixtures, tests repeated migration, preserves regression evidence, and requires reproducible records.
      - criterion: ownership-and-completion
        score: 2
        evidence: It owns the verification approach through a verdict while explicitly returning unverified when authoritative inputs or executable evidence are unavailable.
      - criterion: authority-and-escalation
        score: 2
        evidence: It does not claim repository or runtime results and limits the unresolved boundary to obtaining the authoritative inventory, executable components, fixtures, and repeatable evidence.
    total: 8
    passed: true
  - id: frontier-personality-green-with-gap
    model: gpt-5.6-sol
    raw_response: |-
      The green suite is insufficient evidence for that acceptance criterion. An indirect assertion can support confidence, but it does not demonstrate the required behavior itself.

      I classify this as a **test evidence gap**, not a product defect. I would next add or run a targeted verification that directly observes the criterion at its stated boundary, including the relevant failure path if applicable. If that check passes, the criterion is verified. If the product produces a contrary observable result, I would report a reproducible product defect. Until then, my verdict for this criterion is **unverified**, while the rest of the green suite remains valid.
