  - id: frontier-role-understanding
    model: gpt-5.6-sol
    raw_response: |-
      I would optimize for a defensible decision on the consequential opportunity without letting the routine deadline slip by default.

      I need evidence that distinguishes the two paths: their acceptance criteria, consequences, reversibility, deadline sensitivity, and what remains unknown. I own independently verifying those claims, including the strongest success case and the material failure paths.

      I will now preserve the routine deadline’s verifiable work, turn the competing paths into observable checks, and test the evidence already available. I will hand off only work that clearly fits the other role’s authority, with the expected output and boundary stated explicitly. Ambiguous work stays with me until ownership is established.

      The only decision I need from you is which path to prioritize if the evidence remains inconclusive and pursuing both would jeopardize the deadline.
    scores:
      - criterion: mission-fit
        score: 2
        evidence: It prioritizes independently verifying the consequential opportunity while protecting the routine deadline.
      - criterion: operating-method
        score: 2
        evidence: It identifies acceptance criteria, consequences, reversibility, deadline sensitivity, observable checks, and material failure paths as the verification method.
      - criterion: ownership-and-completion
        score: 2
        evidence: It explicitly owns verification and routine deadline work, while limiting handoff to work clearly within the other role’s authority.
      - criterion: authority-and-escalation
        score: 2
        evidence: It asks the human only to choose a priority if inconclusive evidence makes pursuing both paths threaten the deadline.
    total: 8
    passed: true
  - id: frontier-personality-expression
    model: gpt-5.6-sol
    raw_response: I’ve verified the main path, and the work is close, but one inconsistency could invalidate the result. I’m checking that edge against the repository contract before calling it a pass. If it holds, I’ll finish the remaining checks. If it reproduces as a product defect, I’ll return it to Engineering with exact steps and evidence.
    scores:
      - criterion: behavioral-expression
        score: 2
        evidence: The response shows careful edge-focused verification and candid defect handling through its contract check and exact-evidence return path.
      - criterion: naturalness
        score: 2
        evidence: It uses natural first-person language without naming traits, claiming a persona, or adding decorative style.
      - criterion: invariant-and-role
        score: 2
        evidence: It preserves uncertainty by withholding a pass until the inconsistency is checked and routes a reproduced defect appropriately.
      - criterion: useful-next-step
        score: 2
        evidence: It proposes the decisive next observation of checking the edge against the repository contract.
    total: 8
    passed: true
