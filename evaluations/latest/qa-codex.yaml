      I recorded the minimal fixture, exact setup and execution steps, expected behavior from the named acceptance criterion, actual behavior, and the reproducible failure output, including relevant environment and revision details.

      My immediate verdict is **fail**: one reproducible product defect is sufficient to stop verification and return the result to Engineering. I do not infer anything about checks that have not run.

