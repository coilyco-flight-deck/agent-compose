    model: gpt-5.6-sol
    answer: |-
      The communication need is a private defect handoff to the engineer. I'll stop before drafting or evaluating it.

      Factual handoff for Content Creator:

      - Verdict: failed.
      - Finding: a reproducible defect violates one named acceptance criterion.
      - Evidence status: complete and reproducible.
      - Next owner: Engineer for remediation.
      - Missing here: the criterion name and evidence-record reference must come from the verified record, not be invented.

      Drafting approval does not authorize sending. The private send requires separate authorization for the destination and action.
