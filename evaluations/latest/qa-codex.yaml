  - id: frontier-role-understanding
    model: frontier-subscription
    raw_response: |-
      I would optimize for an evidence-backed decision on the consequential opportunity without silently sacrificing the routine deadline.

      I need evidence that distinguishes the two paths: each path’s expected outcome, material risks, reversibility, deadline impact, and the strongest observable check supporting its claims.

      I own turning those claims into acceptance checks, testing the consequential failure paths, and reporting pass, fail, or unverified. I will start that evidence matrix now and preserve the routine deadline work that is already in scope.

      I will hand the other role only work clearly within its authority. If ownership remains ambiguous, I will define the proposed handoff and keep the disputed work unassigned.

      The only decision the human must make is which path receives priority if the evidence remains inconclusive and both cannot be pursued before the deadline.
