# Forgejo-canonical release pipeline. Every main push validates. Product-impact
# changes publish automatically unless a tracked major-release hold is active.
# Runs queue without cancellation so closely spaced pushes validate in order.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      publish: ${{ steps.impact.outputs.publish }}
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Validate the release commit
        run: ward exec test

      - id: impact
        name: Classify product release impact
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BASE: ${{ github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          publish="$(ward exec release-impact)"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"

      - id: tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco-flight-deck/agentic-os/actions/tag-bump@main
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          create_tag: true
          release_sha: ${{ github.sha }}

      - name: Fetch the release tag into the build checkout
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: git fetch --tags --force

      - name: Build binaries and package metadata
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: |
          ward exec release-build
          ward exec release-package

      - id: create
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco-flight-deck/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: agent-compose ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in \
            dist/agent-compose-darwin-arm64 \
            dist/agent-compose-linux-amd64 \
            dist/agent-compose-linux-arm64 \
            dist/agent-compose-windows-amd64.exe \
            dist/SHA256SUMS \
            dist/agent-compose.rb \
            dist/agent-compose.json
          do
            name=$(basename "$asset")
            curl -fsSL -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${asset}" \
              "${FORGEJO_API}/releases/${RELEASE_ID}/assets?name=${name}"
            echo "uploaded ${name}"
          done

      - name: Update the Homebrew tap
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_WRITE_TOKEN:-}" ]; then
            echo "::warning::TAP_WRITE_TOKEN is absent; skipping Homebrew update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git tap
          cp dist/agent-compose.rb tap/Formula/agent-compose.rb
          cd tap
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git add Formula/agent-compose.rb
          git commit -m "chore(agent-compose): bump formula to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${TAP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git" \
            HEAD:main

      - name: Update the Scoop bucket
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SCOOP_WRITE_TOKEN:-}" ]; then
            echo "::warning::SCOOP_WRITE_TOKEN is absent; skipping Scoop update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git bucket
          cp dist/agent-compose.json bucket/bucket/agent-compose.json
          cd bucket
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git add bucket/agent-compose.json
          git commit -m "chore(agent-compose): bump manifest to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${SCOOP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git" \
            HEAD:main
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
