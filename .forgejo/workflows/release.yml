# Forgejo-canonical single-stage release pipeline. Every main push validates,
# bumps the minor version, publishes binaries, and refreshes install channels.
# Runs queue without cancellation so closely spaced pushes release in order.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Validate the release commit
        run: ward exec test

      - id: tag
        uses: coilyco-flight-deck/agentic-os/actions/tag-bump@main
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          create_tag: true
          release_sha: ${{ github.sha }}

      - name: Fetch the release tag into the build checkout
        run: git fetch --tags --force

      - name: Build binaries and package metadata
        run: |
          ward exec release-build
          ward exec release-package

      - id: create
        uses: coilyco-flight-deck/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: agent-compose ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create.outputs.release_id }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in \
            dist/agent-compose-darwin-arm64 \
            dist/agent-compose-linux-amd64 \
            dist/agent-compose-linux-arm64 \
            dist/agent-compose-windows-amd64.exe \
            dist/SHA256SUMS \
            dist/agent-compose.rb \
            dist/agent-compose.json
          do
            name=$(basename "$asset")
            curl -fsSL -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${asset}" \
              "${FORGEJO_API}/releases/${RELEASE_ID}/assets?name=${name}"
            echo "uploaded ${name}"
          done

      - name: Update the Homebrew tap
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_WRITE_TOKEN:-}" ]; then
            echo "::warning::TAP_WRITE_TOKEN is absent; skipping Homebrew update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git tap
          cp dist/agent-compose.rb tap/Formula/agent-compose.rb
          cd tap
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git add Formula/agent-compose.rb
          git commit -m "chore(agent-compose): bump formula to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${TAP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git" \
            HEAD:main

      - name: Update the Scoop bucket
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SCOOP_WRITE_TOKEN:-}" ]; then
            echo "::warning::SCOOP_WRITE_TOKEN is absent; skipping Scoop update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git bucket
          cp dist/agent-compose.json bucket/bucket/agent-compose.json
          cd bucket
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git add bucket/agent-compose.json
          git commit -m "chore(agent-compose): bump manifest to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${SCOOP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git" \
            HEAD:main
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              proxy_url = os.environ.get("FORGEJO_EGRESS_PROXY", "").strip()
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({"https": proxy_url})
                  if proxy_url
                  else urllib.request.ProxyHandler()
              )
              try:
                  with opener.open(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
