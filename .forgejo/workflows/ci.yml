# Pull-request validation. This repository had none: release.yml validates on
# the main push, in the same job that tags and publishes, so a bad merge was
# only discoverable after it landed and took the release pipeline with it.
#
# Runs the same `ward exec test` the release job runs, so a pull request gets
# exactly the check that is going to gate it after merge rather than a lighter
# approximation that can disagree.
#
# pull_request only, because release.yml already validates every main push and
# duplicating it here would run the whole suite twice per merge.
#
# This cancels superseded runs and release.yml deliberately does not: a
# superseded pull request has nothing left to prove, a release does.
#
# The cache is here because `ward exec test` ends with `pre-commit run
# --all-files`, so hook environments dominate a cold run.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Validate the pull request
        run: ward exec test
