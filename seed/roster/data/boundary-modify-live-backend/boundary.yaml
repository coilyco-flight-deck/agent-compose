boundary: modify-live-backend
order: 1
skill: boundary-modify-live-backend
owner: sysadmin
summary: Systems Administrator changes running backend systems, other roles observe and hand the action over
acts:
  - side: own
    tool: kubectl
    text: kubectl get -o wide and paste the before state
  - side: own
    tool: kubectl rollout status
    text: kubectl rollout status after the change, re-read with the same get, and paste the after state in the same report
  - side: own
    tool: git revert
    text: 'write the rollback line before the forward line: kubectl rollout undo, helm rollback, or git revert'
  - side: scoped
    tool: just
    text: just run, or the project's own launch verb, so the thing you are changing is one you started yourself
  - side: scoped
    tool: kubectl
    text: kubectl config current-context, or the equivalent, and confirm it is the local one before the change rather than after
  - side: scoped
    tool: create_issue
    text: create_issue the moment the same change is wanted on a hosted surface, rather than reaching for it because the command is identical
  - side: defer
    tool: kubectl
    text: 'kubectl get, logs, and describe are reads and stay open to you: run them and paste the output'
  - side: defer
    tool: create_issue
    text: create_issue with the exact command you did not run and its expected result, so the owning seat runs one line rather than re-investigating
  - side: defer
    tool: AskUserQuestion
    text: AskUserQuestion the sysadmin seat while it is live, rather than filing and waiting
