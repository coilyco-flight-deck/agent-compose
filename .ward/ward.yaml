# Catalog schema: coilyco-flight-deck/agentic-os.
catalog:
  description: "agent-compose - personality-engine context composition and delivery."
  dependsOn:
    - forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    - forgejo.coilysiren.me/coilyco-flight-deck/ward

commands:
  test:
    run: sh scripts/test.sh
    description: Run all repository validation (Go tests, then the pre-commit suite).
  build:
    run: go build ./...
    description: Compile every package.
  lint:
    run: go vet ./...
    description: Run Go static analysis.
  install:
    run: go install ./cmd/agent-compose
    description: Install the agent-compose binary into GOBIN.
  tidy:
    run: go mod tidy
    description: Reconcile go.mod and go.sum with the source imports.
  pre-commit:
    run: pre-commit run --all-files
    description: Run the complete pre-commit suite explicitly.
  release-build:
    run: sh scripts/release-build.sh
    description: Cross-compile version-stamped release binaries into dist/.
  release-package:
    run: sh scripts/render-packaging.sh
    description: Render the brew formula and scoop manifest from dist/ binaries.
