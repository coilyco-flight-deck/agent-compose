# Catalog schema: coilyco-flight-deck/agentic-os.
catalog:
  description: "agent-compose - personality-engine context composition and delivery."
  dependsOn:
    - forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    - forgejo.coilysiren.me/coilyco-flight-deck/ward

commands:
  smoke:
    run: sh scripts/smoke.sh
    description: Build acompose and report isolated host convergence stages.
  smoke-verbose:
    run: sh scripts/smoke.sh --verbose
    description: Run the smoke with captured acompose convergence transcripts.
  test:
    run: sh scripts/test.sh
    description: Run Go and palette tests, then the pre-commit suite.
  build:
    run: go build ./...
    description: Compile every package.
  lint:
    run: go vet ./...
    description: Run Go static analysis.
  fmt:
    run: gofmt -w .
    description: Format Go source files.
  install:
    run: go install ./cmd/agent-compose
    description: Install the agent-compose binary into GOBIN.
  tidy:
    run: go mod tidy
    description: Reconcile go.mod and go.sum with the source imports.
  pre-commit:
    run: pre-commit run --all-files
    description: Run the complete pre-commit suite explicitly.
  evaluation-scorecard:
    run: go run ./cmd/agent-compose scorecard --results evaluations/latest --out docs/evaluation-scores.md
    description: Refresh the committed compact scorecard from validated evaluation records.
  evaluation-scorecard-check:
    run: go run ./cmd/agent-compose scorecard --results evaluations/latest --out docs/evaluation-scores.md --check
    description: Fail when the committed evaluation scorecard is stale.
  evaluation-packs:
    run: sh scripts/render-evaluation-packs.sh
    description: Render the complete Core Roster review packs into an explicitly selected empty directory.
  evaluation-baseline:
    run: sh scripts/earn-evaluation-baseline.sh
    description: Re-earn the committed baseline by driving, independently reviewing, and recording every active case.
  harness-refresh:
    run: go test ./internal/nativeui -run TestVendoredHarnessData -update -v
    description: Re-extract the vendored Claude Code verb and theme-token lists from the installed binary.
  palette-build:
    run: sh scripts/palette-web.sh build
    description: Generate canonical palette data and build the local explorer.
  palette-test:
    run: sh scripts/palette-web.sh test
    description: Type-check, build, and verify the local palette explorer.
  palette-serve:
    run: sh scripts/palette-web.sh dev
    description: Generate canonical palette data and serve the local explorer.
  palette-tidy:
    run: npm --prefix web/personality-palette install --package-lock-only --ignore-scripts --no-audit --no-fund
    description: Reconcile the local explorer package lock with package.json.
  evalkit-board:
    run: sh scripts/eval-board.sh
    description: Print the flat eval case list the current roster implies.
  evalkit-prompts:
    run: sh scripts/eval-prompts.sh
    description: Compose one bundle per role and write its delivery as the eval system prompt.
  evalkit-smoke:
    run: sh scripts/eval-smoke.sh
    description: Send one live request through Agent Proxy to prove the eval transport works.
  evalkit-check:
    run: sh scripts/evalkit-check.sh
    description: Lint, format-check, type-check, and test the evalkit Python package.
  evalkit-sync:
    run: uv sync
    description: Reconcile the evalkit virtualenv with pyproject.toml.
  evalkit-run:
    run: uv run python -m evalkit.run
    description: Run the eval subject across every candidate at n=5 through Agent Proxy.
  evalkit-filter:
    run: uv run python -m evalkit.filter
    description: Apply item analysis and pick the surviving board from the candidates.
  evalkit-grade:
    run: uv run python -m evalkit.grade
    description: Grade the behavior board by hand, one keystroke per case.
  release-build:
    run: sh scripts/release-build.sh
    description: Cross-compile version-stamped release binaries into dist/.
  release-package:
    run: sh scripts/render-packaging.sh
    description: Render the brew formula and scoop manifest from dist/ binaries.
  release-package-test:
    run: sh scripts/render-packaging-test.sh
    description: Render v2 fixture package metadata and inspect its public contract.
  release-impact:
    run: sh scripts/release-impact.sh
    description: Decide whether one validated revision should publish a product release.
  release-impact-test:
    run: sh scripts/release-impact-test.sh
    description: Exercise documentation, result, product, hold, and manual release fixtures.

agent:
  workflow: merge-remote-main
