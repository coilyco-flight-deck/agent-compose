[project]
name = "evalkit"
version = "0.1.0"
description = "Eval orchestration and human grading for the agent-compose behavior board."
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.255",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["evalkit/tests"]
# TestType is CheckList vocabulary, not a test class.
python_classes = []

[tool.agentic-os.documentation-layout]
# Contract fixtures model bundle trees. Embedded definitions are product
# assets validated by the person loader, not repository documentation.
# .evalkit is the gitignored run cache. The hook walks the filesystem instead
# of git ls-files, so composed prompts land in it and block every commit.
excludes = ["testdata/contracts/**", "internal/person/data/**", ".evalkit/**"]

[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"
