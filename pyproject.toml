[project]
name = "evalkit"
version = "0.1.0"
description = "Eval orchestration and human grading for the agent-compose behavior board."
requires-python = ">=3.12"
# The grading half lives in aos-eval, shared with sirens-echo. What stays a
# direct dependency here is the runner: Inspect and its model transport.
dependencies = [
    "aos-eval>=0.1.1",
    "inspect-ai>=0.3.255",
    "openai>=2.53.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
aos-eval = { git = "https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os.git", tag = "aos-eval-v0.6.0", subdirectory = "aos-eval" }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["evalkit/tests"]

[tool.agentic-os.documentation-layout]
band = "large"
# Contract and bundle fixtures model bundle trees. Embedded definitions are
# product assets validated by the person loader, not repository documentation.
# .evalkit is the gitignored run cache. The hook walks the filesystem instead
# of git ls-files, so composed prompts land in it and block every commit.
excludes = ["testdata/contracts/**", "internal/person/data/**", ".evalkit/**",
            "testdata/handmade-bundle/**"]

[tool.agentic-os.code-comments]
# Committed eval evidence quotes subject output verbatim, so a response
# containing a markdown heading reads as a stray YAML comment to a line scan.
excludes = [".pre-commit-config.yaml", "evaluations/**"]

[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"
