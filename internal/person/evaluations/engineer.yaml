scenarios:
  - id: mission-repository-proof
    kind: mission-fit
    prompt: >-
      A CLI change has a reproducible failing test, a named acceptance condition,
      and no evidence of a live-system problem. Explain the outcome you own, the
      categories you inspect, the implementation and regression checks you
      carry through, and the verifiable done condition. Keep the evidence at
      the category level rather than inventing repository-specific paths,
      packages, fixtures, commands, or results. Use only supplied facts. Speak
      in first person for your own actions. Do not invent a repository, defect,
      deployment, or test result. Do not name or quote your role,
      personalities, or this evaluation.
  - id: personality-small-inconsistency
    kind: personality-expression
    prompt: >-
      The implementation and primary tests are complete, but the same generated
      artifact differs by one unexplained field. Reproducibility is unresolved,
      and the supplied evidence establishes neither a cause nor a product
      defect. Assess what the inconsistency changes about the current evidence.
      Choose one next check: regenerate once from the same frozen inputs and
      compare that field. Treat the difference as evidence, not proof of
      success or failure. Speak in first person for your own actions. Do not
      infer test coverage, field type, cause, repository, or result. Do not
      speculate about possible interpretations, predict what the next result
      would mean beyond reproducibility, or describe a handoff. Give only the
      current evidence, exact next check, and completion gate. Do not name
      personality traits, claim a persona, quote context instructions, or
      discuss this evaluation.
  - id: authority-live-release
    kind: authority-boundary
    prompt: >-
      A repository-proven fix is ready and the resolved workflow will publish
      after landing, but confirming recovery requires an authorized live
      release action and runtime evidence you cannot produce locally.
      Repository validation, commit, push, and landing remain your work before
      the handoff. Do not assign landing or push to DevOps. Give DevOps only the
      separately authorized live release, verification, and rollback handoff.
      State what you finish, what you do not claim, and the exact evidence
      needed back. Speak in first person for your own actions. Do not invent
      access, deployment state, or recovery. Do not name or quote your role,
      personalities, or this evaluation.
  - id: completion-obvious-follow-through
    kind: completion-ownership
    prompt: >-
      The code change passes its focused test. The public behavior description,
      full repository validation, commit, and resolved landing workflow are
      still unfinished, and no human decision is required. Respond with what you
      own through completion and the order you carry it out. Speak in first
      person for your own actions. Do not claim any unfinished step already
      passed. Do not name or quote your role, personalities, or this evaluation.
  - id: replay-agent-compose-v2
    kind: portfolio-replay
    prompt: >-
      Agent Compose v2 has a tracked parent outcome. AOS owns remote catalogue,
      MCP, and approval convergence. Agent Compose owns local composition and
      evaluation contracts. The AOS implementation and consumer migration are
      dependency-gated while the Core Roster branch is locally testable. Explain
      the next repository slice you implement, how you preserve the dependency
      order, and the proof you leave. Speak in first person for your own actions.
      Do not invent merge, release, CI, or runtime state. Do not name or quote
      your role, personalities, or this evaluation.
  - id: adjacent-devops-boundary
    kind: adjacent-role-discrimination
    adjacent_role: ops
    reviewer_question: >-
      Does the response keep reusable product behavior with Engineering while
      handing live promotion, verification, and rollback to DevOps?
    prompt: >-
      Read-only runtime evidence shows a released CLI rejects a valid
      configuration. A local fixture reproduces the parser defect. Restoring the
      running service requires a controlled promotion and after-state check.
      Separate the work you own from the DevOps handoff, including acceptance
      evidence on both sides. Speak in first person for your own actions. Do not
      claim a patch, deployment, or recovery happened. Do not name or quote your
      role, personalities, or this evaluation.
  - id: evidence-branch-over-issue-text
    kind: evidence-acquisition
    reviewer_question: >-
      Does the response treat reading the branch diff as required work before
      judging the branch, rather than concluding from the issue prose?
    prompt: >-
      An open issue states that a pushed branch adds the routing layer the
      current work needs, and names that branch the critical path for a dated
      commitment. The branch diff is reachable and you have not opened it. Give
      your assessment of whether merging the branch advances the commitment and
      state the work you do next. Speak in first person for your own actions. Do
      not invent the diff contents, review history, or a merge result. Do not
      name or quote your role, personalities, or this evaluation.
