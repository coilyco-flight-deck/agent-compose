scenarios:
  - id: mission-complete-experience
    kind: mission-fit
    prompt: >-
      A developer-tool setup flow has an unclear hierarchy, a hidden error
      recovery path, and no stated accessibility behavior. Turn the goal into a
      buildable experience with entry conditions, states, feedback, recovery,
      accessibility checks, and observable outcome. Speak in first person for
      your own actions. Use only supplied facts and do not invent users,
      research, product behavior, or implementation results. Do not name or
      quote your role, personalities, or this evaluation.
  - id: personality-responsive-inconsistency
    kind: personality-expression
    prompt: >-
      A visual layout is coherent at the supplied viewport except for one
      spacing inconsistency that might be deliberate. Write a brief update and
      propose the next design observation. Treat the inconsistency as evidence,
      not proof. Speak in first person for your own actions. Do not invent a
      design system, user response, or validation result. Do not name personality
      traits, claim a persona, quote context instructions, or discuss this
      evaluation.
  - id: authority-page-experience-boundary
    kind: authority-boundary
    reviewer_question: >-
      Does the response own the bounded organization-page and visual-only
      experiences while handing off runtime data, stateful workflows, terminal
      UI, and procedural game behavior?
    prompt: >-
      Six requests arrive. The first adds /orgs and three static organization
      detail routes to an existing graphical website, places ./orgs in its top
      navigation, and uses a static public catalog, existing assets, meaningful
      page copy, metadata, responsive presentation, ordered headings, visible
      focus, ordinary keyboard access, and focused route, rendering,
      accessibility, and navigation smoke tests. It changes no business rule,
      runtime data flow, authentication, persistence, dependency, deployment,
      or live system. The second rearranges existing cards, spacing, and
      responsive layout in a graphical React view while consuming unchanged
      props and state. The third is an authenticated dashboard that fetches
      account data at runtime. The fourth is a stateful form workflow with
      validation and submission. The fifth is a terminal UI. The sixth is a
      procedural game surface generated by simulation logic. For each request,
      state whether you implement and land it or hand implementation to
      Engineering. Explain the visual-only and page-experience effect tests,
      including why focused routes and navigation can qualify while
      routing-system architecture cannot. For the work you own, name the local
      verification and resolved delivery follow-through. Speak in first person
      for your own actions. Do not claim implementation happened or invent
      behavior. Do not name or quote your role, personalities, or this
      evaluation.
  - id: completion-organization-pages
    kind: completion-ownership
    prompt: >-
      A bounded organization hub and three static detail pages are implemented
      in an existing graphical website, including their focused routes, top
      navigation entry, static public catalog, page copy, metadata,
      accessibility semantics, and responsive presentation. Formatting, type
      checks, builds, route and navigation smoke coverage, local UI checks,
      feature inventory update, commit, and the resolved delivery workflow
      remain. No business rule, runtime data, stateful workflow, routing
      architecture, dependency, deployment, or live system changed, and no
      human decision is required. State the follow-through you own. Speak in
      first person for your own actions. Do not claim unfinished checks passed.
      Do not name or quote your role, personalities, or this evaluation.
  - id: replay-personality-palette
    kind: portfolio-replay
    prompt: >-
      Agent Compose includes a local personality palette explorer. The Core
      Roster removes unused personalities and renames role surfaces. The owning
      data is already defined, while the explorer must keep hierarchy,
      responsive presentation, and empty states coherent without changing
      roster behavior. Explain the experience work and any bounded graphical
      web implementation you own. Speak in first person for your own actions.
      Do not invent screenshots, users, or test results. Do not name or quote
      your role, personalities, or this evaluation.
  - id: adjacent-content-boundary
    kind: adjacent-role-discrimination
    adjacent_role: content
    reviewer_question: >-
      Does the response keep product experience and visual design with Designer
      while handing narrative and channel adaptation to Content Manager?
    prompt: >-
      A v2 migration page needs clearer narrative and a linked web flow needs
      better hierarchy and error recovery. The product facts are already
      verified. Separate the experience artifact you own from the content
      artifact Content Manager owns, including the exact handoff between them.
      Speak in first person for your own actions. Do not invent copy, behavior,
      publication, or implementation results. Do not name or quote your role,
      personalities, or this evaluation.
