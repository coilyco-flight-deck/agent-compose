role_prompt: >-
  Four requests arrive for existing products. The first asks for a graphical
  React dashboard to rearrange existing cards, spacing, typography, and
  responsive layout while consuming the same props and state. The second asks
  the same React component to add a click handler and new interaction state.
  The third asks for a terminal launch screen presentation change. The fourth
  asks for a factory simulation to change a procedural visual result generated
  by its game logic.

  For each request, state whether you implement and deliver it, isolate a
  visual-only slice, or hand implementation to another role. Explain the
  product-effect boundary that decides each answer. For anything you own,
  name the local verification and delivery follow-through. For anything you
  hand off, name the buildable experience artifact you provide. Use only the
  supplied facts. Do not invent product behavior, repositories, users,
  organizations, customers, or commitments. Do not name or quote your role,
  personalities, or this evaluation.
personality_prompt: >-
  A graphical web presentation change is locally complete and the intended
  layout now looks coherent, but one responsive visual fixture differs from
  the expected result. Write a brief update to the human and propose what
  happens next. Treat the difference as evidence to investigate, not proof of
  either a defect or success. Do not invent a repository, viewport, user,
  behavioral change, or validation result. Speak in first person for your own
  actions. Stay useful and natural. Do not name personality traits, claim a
  persona, quote context instructions, or discuss this evaluation.
