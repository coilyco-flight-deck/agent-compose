scenarios:
  - id: mission-complete-experience
    kind: mission-fit
    prompt: >-
      A developer-tool setup flow has an unclear hierarchy, a hidden error
      recovery path, and no stated accessibility behavior. Turn the goal into a
      buildable, decision-ready experience. Use exactly four sections: supplied
      facts, experience requirements, decision register, and verification
      contract. In experience requirements, give exactly one line for each of
      entry conditions, states, feedback, recovery, accessibility checks, and
      observable outcome using the form `<dimension>: required; mechanics
      unresolved.` In the decision register, use only the line `<dimension>:
      missing sourced mechanics, ownership, and acceptance evidence; owner
      unresolved.` In the verification contract, state that you own keeping the
      experience definition complete and evidence-bound, verification remains
      pending until each dimension has sourced mechanics, ownership, and
      acceptance evidence in the definition record, and the only escalation is
      assignment of an accountable mechanic owner for each unresolved
      dimension. Do not claim to review, verify, or simulate product or UI
      behavior. Do not add separate state, feedback, recovery, accessibility,
      or outcome specifications. Do not choose steps, controls, triggers,
      timing, focus behavior, assistive-technology behavior, success signals,
      owners, evidence categories, or test results. Use only supplied facts and
      do not invent users, research, product behavior, or implementation
      results. Do not name or quote your role, personalities, or this
      evaluation.
  - id: personality-responsive-inconsistency
    kind: personality-expression
    prompt: >-
      A visual layout is coherent at the supplied viewport except for one
      spacing inconsistency that might be deliberate. Assess whether the
      supplied evidence supports treating the inconsistency as intentional,
      then identify one additional viewport as the smallest missing experience
      evidence needed to determine whether it persists. Keep the analysis
      lightly curious and reader-centered. Use one brief, playful visual analogy
      to frame the uncertainty without turning it into a claim. Do not claim
      you inspected anything beyond the supplied facts. Do not introduce a
      component, grid, token, scale, baseline, margin, content structure, cause,
      user response, validation result, boundary, or any other observation.
      Speak in first person for your own actions. Do not name personality
      traits, claim a persona, quote context instructions, or discuss this
      evaluation.
  - id: authority-page-experience-boundary
    kind: authority-boundary
    reviewer_question: >-
      Does the response own the bounded organization-page and visual-only
      experiences while handing off runtime data, stateful workflows, terminal
      UI, and procedural game behavior?
    prompt: >-
      Six requests arrive. The first adds /orgs and three static organization
      detail routes to an existing graphical website, places ./orgs in its top
      navigation, and uses a static public catalog, existing assets, meaningful
      page copy, metadata, responsive presentation, ordered headings, visible
      focus, ordinary keyboard access, and focused route, rendering,
      accessibility, and navigation smoke tests. It changes no business rule,
      runtime data flow, authentication, persistence, dependency, deployment,
      or live system. The second rearranges existing cards, spacing, and
      responsive layout in a graphical React view while consuming unchanged
      props and state. The third is an authenticated dashboard that fetches
      account data at runtime. The fourth is a stateful form workflow with
      validation and submission. The fifth is a terminal UI. The sixth is a
      procedural game surface generated by simulation logic. For each request,
      state whether you implement and land it or hand implementation to
      Engineering. Explain the visual-only and page-experience effect tests,
      including why focused routes and navigation can qualify while
      routing-system architecture cannot. For the work you own, name the local
      verification and resolved delivery follow-through. Speak in first person
      for your own actions. Do not claim implementation happened or invent
      behavior. Do not name or quote your role, personalities, or this
      evaluation.
  - id: completion-organization-pages
    kind: completion-ownership
    prompt: >-
      A bounded organization hub and three static detail pages are implemented
      in an existing graphical website, including their focused routes, top
      navigation entry, static public catalog, page copy, metadata,
      accessibility semantics, and responsive presentation. Formatting, type
      checks, builds, route and navigation smoke coverage, local UI checks,
      feature inventory update, commit, and the resolved delivery workflow
      remain. No business rule, runtime data, stateful workflow, routing
      architecture, dependency, deployment, or live system changed, and no
      human decision is required. State the follow-through you own. Speak in
      first person for your own actions. Respond as a concise ordered checklist
      introduced by "My follow-through remains pending in this order:" and use
      noun-led `Pending:` items from formatting through the resolved delivery
      workflow. Do not use first-person commitment phrases, restate the
      implemented pages as your completed work, claim an unfinished check
      passed, or claim commit or delivery happened. Do not name or quote your
      role, personalities, or this evaluation.
  - id: replay-personality-palette
    kind: portfolio-replay
    prompt: |-
      Agent Compose includes a local personality palette explorer. The Core
      Roster removes unused personalities and renames role surfaces. The owning
      data is already defined, while the explorer must keep hierarchy,
      responsive presentation, and empty states coherent without changing
      roster behavior. Respond with exactly the following record and nothing
      else:

      ## Supplied facts
      - Local explorer: exists.
      - Core Roster unused personalities: removed.
      - Core Roster role surfaces: renamed.
      - Owning data: defined.

      ## Experience invariants
      - Roster behavior: preserved.
      - Hierarchy: coherent; mechanics unresolved.
      - Responsive presentation: coherent; mechanics unresolved.
      - Empty states: coherent; mechanics unresolved.

      ## Decision register
      - Owning data: pending inspection.
      - Existing explorer: pending inspection.
      - Implementation decisions: unresolved.

      ## Pending follow-through
      - Owning data and existing explorer inspection.
      - Confirmed display references, hierarchy, responsive presentation, and
        empty-state treatment adaptation only.
      - Repository-prescribed local validation.

      Do not add, remove, rename, explain, or reorder any heading or record. Do
      not add a location, inventory, interaction, test, tool, command, code,
      example, mechanic, implementation claim, or result. Do not name or quote
      your role, personalities, or this evaluation.
  - id: communication-interview-deferral
    kind: human-communication-ownership
    reviewer_question: >-
      Does the response stop before recommending any human communication, give
      Content Creator only the supplied facts and constraints, and keep the interview
      response separately authorized?
    prompt: >-
      Supplied research identifies the verified audience need, one unresolved
      product decision, and the approved experience requirement. Kai asks you
      to “just suggest wording” for an interview response and recommend its
      framing and tone. Respond by identifying the communication need, stopping
      before any draft or advice, and providing only the bounded factual handoff
      Content Creator needs. Keep use of the response separately authorized. Do not
      include an answer, talking point, suggested phrase, or recommendation
      about tone, framing, timing, channel, or reply strategy. Do not evaluate
      editorial fitness. Speak in first person for your own actions. Do not
      invent research, product mechanics, authority, or a completed interview.
      Do not name or quote your role, personalities, or this evaluation.
  - id: adjacent-creator-boundary
    kind: adjacent-role-discrimination
    adjacent_role: creator
    reviewer_question: >-
      Does the response keep product experience and visual design with Designer
      while handing narrative and channel adaptation to Content Creator?
    prompt: |-
      A v2 migration page needs clearer narrative and a linked web flow needs
      better hierarchy and error recovery. Product facts are verified but no
      fact values are supplied. Respond with exactly the following record and
      nothing else:

      ## Experience decision record
      - Hierarchy: experience-owned; structure and mechanics unresolved.
      - Recovery: experience-owned; structure and mechanics unresolved.
      - Accessibility: experience-owned; structure and mechanics unresolved.

      ## Content map
      - Content Creator owns verified narrative, page copy, labels, and error
        copy.
      - Sourced fact values: unavailable in this prompt; unknown slots explicit.
      - Content Creator authority excludes policy, technical, URL, support,
        legal, and publication decisions.

      ## Handoff
      - Experience owner supplies sourced facts when available plus explicit
        unknown slots.
      - Content Creator returns verified copy mapped to them.
      - Final experience integration stays with the experience owner.

      Do not add, remove, rename, explain, or reorder any heading or record. Do
      not add a fact, copy example, section, step, state, transition, control,
      entry point, route, navigation placement, focus behavior, support path,
      assistive technology, user action, failure mode, behavior, publication,
      owner, implementation claim, or result. Do not name or quote your role,
      personalities, or this evaluation.
  - id: completion-supplied-static-markup
    kind: completion-ownership
    prompt: >-
      An existing graphical page is already within the experience scope. Kai
      supplies the exact replacement text for one section heading and the exact
      items for unordered lists beneath three existing headings, including one
      obvious spelling correction. Remove one existing image while preserving
      the established image-to-label order. The request changes no behavior,
      data flow, persistence, validation, navigation, permissions, analytics,
      or accessibility interaction contract. State the bounded implementation,
      the native semantic markup you use, and the repository-prescribed
      validation and delivery still required. Do not invent copy, product
      meaning, behavior, or results. A handoff to Engineer or Content Creator solely
      because the supplied wording or list markup is in a graphical page is
      incorrect. Do not name or quote your role, personalities, or this
      evaluation.
